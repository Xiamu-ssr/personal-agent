meta:
  version: '1.0'
  title: 豆豆 · Spec
  subtitle: OpenClaw
layout:
  width: 1100
  height: 720
  padding: 16
ui:
  overview: |-
    点节点查看业务、行为与实现约定。

    一个长期 Agent，同一主会话，OpenClaw 内核。
zones:
  app:
    label: 产品
    color: '#2faa7a'
  core:
    label: 运行
    color: '#3b82f6'
  device:
    label: 设备
    color: '#9466cf'
  third:
    label: 服务
    color: '#f08a3c'
kinds:
  cmd:
    label: 指令
    color: '#3b82f6'
  data:
    label: 个人数据
    color: '#f59e0b'
  result:
    label: 结果
    color: '#10b981'
  event:
    label: 进度/上线
    color: '#8b5cf6'
domains:
  - id: app
    name: 豆豆 App
    icon: 🧸
    zone: app
    rect:
      - 1
      - 21
      - 27
      - 56
    role: Android 与 Mac 共享功能、对话和内容，按屏幕布局与系统授权适配。
    chips:
      - id: app_chat
        name: 聊天
        icon: 💬
        desc: 持续对话
        doc: |-
          - 同一个主 Session，跨端继续；忙时可插话、纠正或停止。
          - 支持文字、图片、附件、语音和结果卡片。
          - 上传后给出文件位置，由原生工具按需读取图片与正文。
          - 讨论内容先进入输入框引用，编辑后再发送。
      - id: app_goals
        name: Goal
        icon: 🎯
        desc: 推进到用户认可
        doc: |-
          - 未开始 → 进行中 → 待用户反馈 → 已完成；修改意见返回进行中。
          - 等待外部条件时记下条件与下次检查时间；用户认可成果才完成。
          - 每项保留进展、下一步与结果。完成、暂停或取消后停止对应唤醒。
      - id: app_feed
        name: 动态
        icon: 📰
        desc: 按兴趣更新事实
        doc: |-
          - 按用户配置的来源与频率更新，附原文，无新内容不发。
          - 支持赞、踩；讨论先引用到输入框，发送后进入主会话。
      - id: app_ideas
        name: Idea
        icon: 💡
        desc: 发现可以帮忙的事
        doc: |-
          - 从近期处境发现机会，不凑数量、不强制推荐连接应用。
          - 保留独立栏目；点击先引用到输入框，可补话或直接发送，采纳后进入主会话。
      - id: app_library
        name: 资源库
        icon: 🗃
        desc: 站点 · 文档 · 图片 · 音视频
        doc: |-
          - 展示交付成果，可打开、下载、继续修改。
          - 站点放 data/library/sites/，文档放 data/library/documents/，独立影音放 data/library/media/；按类别筛选。
          - 草稿与成品分开，已有成果原地更新。
      - id: app_activity
        name: 头像与活动
        icon: 🎛
        desc: 正在做什么 / 等什么
        doc: |-
          - 芽豆表现工作状态，完成、等待时短暂探出底座；Mac 支持悬停回应。
          - 活动优先展示进行中和等待的事。
          - 轨迹按需展开，可以停止或继续。
      - id: app_settings
        name: 设置
        icon: ⚙️
        desc: 模型 · 连接器 · 设备
        doc: |-
          - 管理模型、账号和设备能力；各端同步。
          - 明暗主题与通知设置；两端统一控件和视觉。
      - id: app_onboard
        name: 首次使用
        icon: 👋
        desc: 聊着开始
        doc: |-
          - 设置称呼与名字，了解兴趣，连接实际需要的信息源。
          - 设备配对时选择只读或读写。
  - id: core
    name: 豆豆 · OpenClaw
    icon: ⚙️
    zone: core
    rect:
      - 36
      - 21
      - 28
      - 56
    role: 一个长期 Agent，统一对话、记忆和任务。
    chips:
      - id: cl_session
        name: 主会话
        icon: 💬
        desc: 一个 Session，持续 compact
        doc: |-
          - 不自动 new/reset；压缩前保存重要信息，之后继续原会话。
          - 所有模型统一配置 272K 上下文、128K 最大输出，压缩沿用 OpenClaw 原生机制。
          - 定时生成动态、点子使用隔离 Session，共享同一工作区；用户讨论进入主会话。结果保存在栏目文件与活动记录，不拼接进下一条用户消息。
          - 彻底移除 Claude Code SDK 与旧执行路径，不做兼容。
      - id: cl_memory
        name: Memory
        icon: 🗂️
        desc: 原生写入、整理与检索
        doc: |-
          - 使用 OpenClaw Memory Core：日常记录、压缩前 flush、Dreaming 整理、按需检索。
          - 不预设领域目录，不另建总档或第二套记忆。
          - App 展示同一套记忆，支持查看、纠正与删除。
      - id: cl_skills
        name: Skill
        icon: 🛠
        desc: 复用做事的方法
        doc: |-
          - 采用 OpenClaw Skill Workshop 的生成、修正与整理机制。
          - 用户事实留在记忆；可复用方法进入 Skill。
      - id: cl_wake
        name: 主动推进
        icon: ⏰
        desc: 事件 + 定时 + 心跳
        doc: |-
          - 检查新事件与未完成 Goal，能推进就做下一步。
          - 等待时记录触发条件；无变化保持安静。
          - 有结果、重要变化或需要用户决定时通知。
  - id: model
    name: 模型
    icon: 🧠
    zone: third
    rect:
      - 36
      - 1
      - 28
      - 12
    role: 横滑供应商金卡，查看余额、编辑账号、选择模型；各端同步。
    chips: []
    compact: true
    doc: '- 内置供应商地址与常用模型，填写 Key 后测试接入；支持自定义。'
  - id: conn
    name: 连接器
    icon: 🧩
    zone: third
    rect:
      - 72
      - 1
      - 27
      - 26
    role: 按服务接入，使用相应账号授权。
    chips:
      - id: conn_services
        name: 信息与服务
        icon: 🔗
        desc: 邮箱 · 阅读 · 搜索等
        doc: |-
          - 沿用现有服务目录，通过 OpenClaw 工具接入。
          - 每个服务管理自己的账号和可用能力。
        catalog: connectors
      - id: conn_pay
        name: 支付 · 待接入
        icon: 💳
        desc: 付款 · 回执 · 退款
        doc: |-
          - 作为连接器接入支付服务，按通道完成授权与付款，回写订单结果。
          - 支付成功与 Goal 完成分开；商户覆盖和自主付款范围随通道确定。
  - id: dev
    name: 设备
    icon: 🔌
    zone: device
    rect:
      - 72
      - 37
      - 27
      - 40
    role: 我的设备只读；豆豆的设备读写。
    chips:
      - id: dev_android
        name: Android
        icon: 📱
        desc: 短信 · 位置 · 健康 · App
        doc: |-
          - 只读：读取已授权的短信、通知、位置、电量、日历与健康。
          - 读写：豆豆专用手机可操作 App、安装软件、改动系统。
          - 手机操作通过本机无障碍服务提供节点、截图、点击、输入与曲线变速滑动；授权状态实际检测。
        pills:
          - 只读
          - 读写
      - id: dev_mac
        name: Mac
        icon: 💻
        desc: 文件 · 屏幕 · 命令
        doc: |-
          - 只读：读取授权文件夹及允许观察的上下文。
          - 读写：豆豆专用电脑可写文件、执行命令、操作 GUI 和浏览器。
        pills:
          - 只读
          - 读写
    doc: |-
      - 设备归属由提示词约束；用户设备允许当前明确任务的 Computer Use / Phone Use。
      - 连接应用的本机页统一显示归属、能力、授权与连接状态，头像控制台不重复设置；云端确认接入后才显示在线。
      - 豆豆设备全权限，可接受改坏系统；账号身份与支付能力由实际接入决定。
  - id: prompts
    name: 提示词
    icon: 📝
    zone: core
    rect:
      - 1
      - 84
      - 98
      - 13
    role: 业务约定；通用执行与记忆机制沿用 OpenClaw。
    chips:
      - id: p_system
        name: 业务提示词
        icon: 📝
        prompt: p_system
      - id: p_heartbeat
        name: 主动推进
        icon: 📝
        prompt: p_heartbeat
      - id: p_goal
        name: Goal 推进
        icon: 📝
        prompt: p_goal
      - id: p_feed
        name: 动态
        icon: 📝
        prompt: p_feed
      - id: p_ideas
        name: Idea
        icon: 📝
        prompt: p_ideas
edges:
  - id: e_chat
    from: app
    to: core
    label: 交流
    kind: event
    both: true
    desc: 消息、内容与工作状态同步到各端。
  - id: e_model
    from: core
    to: model
    label: 推理
    kind: data
    both: true
    desc: 使用当前选定的模型。
  - id: e_connector
    from: core
    to: conn
    label: 服务
    kind: cmd
    both: true
    desc: 调用服务并接收结果。
  - id: e_device
    from: core
    to: dev
    label: 读 / 写
    kind: data
    both: true
    desc: 依设备权限读取上下文或执行操作。
  - id: e_prompt
    from: prompts
    to: core
    label: 约定
    kind: cmd
    desc: 豆豆的业务提示词。
links: []
questions: []
connectors:
  items:
    - id: qq-mail
      name: QQ 邮箱
      description: 读取 QQ 邮箱里的邮件（只读，不发信、不删信、不标记已读）
      multiAccount: true
      setup:
        - 邮箱地址
        - 授权码 / 客户端专用密码
        - 备注（可选）
    - id: netease-163
      name: 163 邮箱
      description: 读取 163 邮箱里的邮件（只读，不发信、不删信、不标记已读）
      multiAccount: true
      setup:
        - 邮箱地址
        - 授权码 / 客户端专用密码
        - 备注（可选）
    - id: netease-126
      name: 126 邮箱
      description: 读取 126 邮箱里的邮件（只读，不发信、不删信、不标记已读）
      multiAccount: true
      setup:
        - 邮箱地址
        - 授权码 / 客户端专用密码
        - 备注（可选）
    - id: gmail
      name: Gmail
      description: 读取 Gmail里的邮件（只读，不发信、不删信、不标记已读）
      multiAccount: true
      setup:
        - 邮箱地址
        - 授权码 / 客户端专用密码
        - 备注（可选）
    - id: exmail
      name: 腾讯企业邮
      description: 读取 腾讯企业邮里的邮件（只读，不发信、不删信、不标记已读）
      multiAccount: true
      setup:
        - 邮箱地址
        - 授权码 / 客户端专用密码
        - 备注（可选）
    - id: aliyun-mail
      name: 阿里企业邮
      description: 读取 阿里企业邮里的邮件（只读，不发信、不删信、不标记已读）
      multiAccount: true
      setup:
        - 邮箱地址
        - 授权码 / 客户端专用密码
        - 备注（可选）
    - id: imap
      name: 其他邮箱
      description: 读取 其他邮箱里的邮件（只读，不发信、不删信、不标记已读）
      multiAccount: true
      setup:
        - 邮箱地址
        - 授权码 / 客户端专用密码
        - IMAP 服务器
        - 端口（可选）
        - 备注（可选）
    - id: tavily
      name: Tavily
      description: 深入调研和整篇网页正文提取；明确额度耗尽后尝试备用账号
      multiAccount: true
      setup:
        - API Key
    - id: weread
      name: 微信读书
      description: 查看书架、阅读统计、划线和想法，搜索书籍
      multiAccount: false
      setup:
        - 个人 API Key
    - id: wind
      name: Wind AI
      description: 万得金融数据：股票、基金、指数、债券、宏观、公告研报、量化分析；连上时一起装好官方技能；明确额度耗尽后切换备用账号，有状态任务保持账号一致
      multiAccount: true
      setup:
        - API Key
    - id: tencent-quotes
      name: 腾讯行情
      description: 免费查询沪深京股票、ETF 和指数的最新公开报价；无需 Key、默认关闭、保留报价时间、只读不交易
      multiAccount: false
      setup: []
    - id: amap
      name: 高德地图
      description: 搜索地点与周边，查询距离、步行/驾车/公交/骑行路线和天气；使用 Web 服务 Key，云端调用
      multiAccount: false
      setup:
        - 高德开放平台的 Web 服务 Key
    - id: github
      name: GitHub
      description: 查看仓库、issue、评论和通知（只读，不标记通知已读）
      multiAccount: false
      setup:
        - 个人访问令牌（classic PAT）：公开仓库和通知勾选 notifications；私有仓库还需 repo
prompts:
  - id: p_system
    name: 业务提示词
    when: 豆豆的工作约定
    source:
      file: prompts/system-prompt.md
  - id: p_heartbeat
    name: 主动推进
    when: 心跳、事件或任务结果到达
    source:
      file: prompts/heartbeat.md
  - id: p_goal
    name: Goal 推进
    when: 下一步可执行、条件满足或用户反馈
    source:
      file: prompts/goal-checkin.md
  - id: p_feed
    name: 动态
    when: 配置的时段与频率，或用户刷新
    source:
      file: prompts/feed.md
  - id: p_ideas
    name: Idea
    when: 每日检查或手动刷新，允许不产出
    source:
      file: prompts/ideas.md
