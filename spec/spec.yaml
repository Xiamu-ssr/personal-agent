# 豆豆 0.8 产品规格（重构草案）；提示词正文与触发时间在构建时读取最新源文件。
meta:
  version: "0.8"
  title: 豆豆 · 产品规格
  subtitle: Spec 0.8 草案 · 会话即入口，动态替代简报
layout:
  width: 1080
  height: 860
  padding: 16
ui:
  overview: |-
    # 豆豆 0.8 重构草案
    - 点节点看产品决定，点提示词读全文。
    - 「待对齐」里是这次重构还没定的事。
    - 场景演示已删除，只保留架构图。

    ## 这次变了什么
    - 聊天是一切入口：首次使用、定目标、调动态口味，都在聊天里完成。
    - 豆豆只用「说话」回复你，不展示工具过程；头像告诉你它在忙。
    - 豆豆忙的时候也能接着说，消息直接进当前这一轮。
    - 撤掉「今日」和简报，换成「动态」：按你的口味刷事实。
    - 新增「点子」「目标」；站点和文件归进「资源库」。
    - 任务、定时、记忆、权限收进头像控制台。

    ## 连线
    - 蓝色：指令。
    - 金色：个人数据。
    - 绿色：结果。
    - 紫色：进度或上线。
zones:
  dev:
    label: 你的设备
    color: "#2faa7a"
  cloud:
    label: 你的云
    color: "#3b82f6"
  third:
    label: 第三方
    color: "#f08a3c"
kinds:
  cmd:
    label: 指令
    color: "#3b82f6"
  data:
    label: 个人数据
    color: "#f59e0b"
  result:
    label: 结果
    color: "#10b981"
  event:
    label: 进度/上线
    color: "#8b5cf6"
domains:
  - id: app
    name: 豆豆 App
    icon: 📱
    zone: dev
    rect:
      - 1
      - 15
      - 22
      - 41
    qs:
      - q_tabs
      - q_skin
    role: 安卓与 Mac 是同一个产品的两种布局。
    can:
      - 聊天 / 动态 / 点子 / 目标 / 资源库五个栏目，图标放在悬浮的底栏里
      - 顶部头像显示豆豆在不在忙，点开是控制台
      - 黑白两色，浅色深色跟随系统，蓝色只给链接
      - 一切配置都能在聊天里完成，页面只是快捷入口
    cannot:
      - 设备能力由用户在那台设备上授权；云端维护记忆
    holds:
      - 聊天和内容的本地缓存
    chips:
      - id: app_avatar
        name: 头像
        icon: 🧸
        desc: 空闲时看着你 · 忙时在干活
        q: q_mascot
        doc: |-
          - 聊天顶部居中一个 3D 的可爱形象，名字写在下面；名字由用户在第一次聊天时起。
          - 五种状态：空闲（看着你）、工作中（戴耳机敲电脑）、等你回复、完成（开心一下）、出错（流汗）。
          - 忙的时候名字下面多一行状态，如「努力工作中」「在看你的邮件」。
          - 点头像打开控制台。
      - id: app_chat
        name: 聊天
        icon: 💬
        desc: 会话即入口
        q: q_say
        doc: |-
          - 豆豆的回复是一条条气泡，一轮里可以说好几次；看不到工具调用和步骤。
          - 回复里可以带能点的卡片：选项（点一下就当你回复了）、连接应用、目标、网页预览、图片、音视频、文件、浏览器实时画面。
          - 豆豆忙时输入框照常可用，发出去的消息直接进当前这一轮，豆豆在下一步之前就能看到。没有排队，也没有撤回。
          - 想让它停：点头像，再点停止。
          - 左上角抽屉里可以另开旁聊，不打扰主聊天。
          - 加了图片或文件，输入框上方排一行缩略图，可以逐个删掉；输入框本身不变形。
          - 文字、图片、文件、拍照、按住说话、语音笔记照旧。
      - id: app_onboard
        name: 第一次聊天
        icon: 👋
        desc: 不填表，聊着开始
        doc: |-
          - 登录（云端地址 + 配对码）之后直接进聊天，豆豆先开口：介绍自己，问怎么称呼你。
          - 再请你给它起名：三个选项卡，「豆豆」排第一，也可以自己打。
          - 说清它能做什么：住在你自己的云主机上，你不在也能办事；连上应用、手机和电脑就能替你管。
          - 按这台设备推荐两三个连接卡片：安卓先给「一键开启本机能力」，再给邮箱等常用服务。点卡片进连接页或系统授权。
          - 聊天中了解到你的兴趣，就顺手写好动态说明，告诉你第一批动态去哪看。
      - id: app_feed
        name: 动态
        icon: 📰
        desc: 像刷推特一样刷事实
        q: q_feed_when
        doc: |-
          - 一条条帖子：来源图标、一句话标题、两三句正文带原文链接、配图或小表格、多久以前。
          - 每条可以赞、踩、讨论。点「讨论」不会马上发出：跳到主聊天，这条动态作为引用挂在输入框上方，你接着打字再发；聊天里显示你的话和一张小引用卡，豆豆拿到的是整条动态。
          - 顶部输入框直接说想看什么，如「多给我看点 AI 产品」；右上角的调节按钮打开「动态说明」全文和更新频率，可以直接改，保存后从下一次起生效。
          - 在聊天里说想看什么、丢一批渠道给豆豆，也都改进动态说明，调节面板里马上看得到。
          - 白天随时冒出新帖，最新的在最上面，讲的是刚发生的事；有新帖时底栏图标上有红点。
          - 只发事实：每条点名来源、附原文链接；没新东西就不发，不凑数。
      - id: app_ideas
        name: 点子
        icon: 💡
        desc: 点一下就开聊
        doc: |-
          - 豆豆根据记忆、目标和最近聊的事想出来的事，每条一个图标、一句标题、一段说明，按领域分组。
          - 点一条，就以你的口吻发到聊天里开始做。
          - 其中有推荐连接应用的点子，如「连上 GitHub，我每天帮你看通知」。
          - 每周一换一批，也可以点「换一批」。
      - id: app_goals
        name: 目标
        icon: 🎯
        desc: 在聊天里定，豆豆来盯
        doc: |-
          - 上面是「追踪中」：每个目标一行，带进度和下次跟进时间。
          - 下面是「创建目标」：健康、人际、金融、事业、兴趣、效率、其他。点一个会弹出说明，点「开始吧」进聊天，豆豆问几个问题把目标定下来。
          - 定好后按约定的频率跟进：到点发一条短消息问进展、给下一小步；能替你做的步骤先在后台做完再汇报。
          - 豆豆说「建好了」，追踪中就一定有它：目标卡只能指向已经写好的目标，没写好卡片发不出去。
          - 点进目标看计划和步骤；要改目标也去聊天里说。
      - id: app_library
        name: 资源库
        icon: 🗃
        desc: 构件 · 影音内容
        doc: |-
          - 构件：豆豆做的页面（原来的站点）和文档，两列缩略图，点开在 App 里用。
          - 影音内容：豆豆生成或交付的图片、视频和音频。
          - 新的排在前面。
      - id: app_console
        name: 头像控制台
        icon: 🎛
        desc: 活动 · 权限 · 电脑 · 定时 · 记忆
        doc: |-
          - 活动：豆豆做过的事，像 Muse 一样一件一条——主聊天里干了活的那几轮、目标跟进、委派出去的任务、旁聊、发了帖的动态。每条一个话题标题、一句做了什么和时间；点开看完整轨迹、接着聊。纯聊天不算活动，没发帖的动态也不列。
          - 权限：自动（默认）或完全放行。
          - 电脑：云端浏览器和在线设备的实时画面，可以接管。
          - 定时：所有定时安排，可以立即运行或停用。
          - 记忆：灵魂（豆豆的名字、性格、日记）和记忆（总档、各分类、健康）两张卡。
      - id: app_set
        name: 设置
        icon: ⚙️
        desc: 模型 · 连接应用 · 设备
        doc: |-
          - 从左上角抽屉底部进入。
          - 模型：内置 ZenMux 的 Haiku 5.5（默认）、Opus 5.5、GLM 5.3 Flash、GLM 5.3 FlashX，每项一行消耗说明；也可以添加自己的模型服务（名称、Base URL、API Key，下面挂模型 ID 和显示名，协议固定 Anthropic）。从下一轮起生效。
          - 连接应用：精选、按类别分组、来自这台设备；一服务一连接器，统一详情页添加、验证、修改、删除。
          - 连接应用和本机能力各用自己的彩色图标（品牌色，或一眼能认的颜色）；开着的一眼看得出是开着的。
          - 设备、通知、外观（跟随系统 / 浅色 / 深色）、云端地址、退出登录、版本。
  - id: mac_app
    name: Mac
    icon: 💻
    zone: dev
    rect:
      - 1
      - 60
      - 22
      - 11
    compact: true
    role: 相同页面的桌面布局：底栏换成侧边栏，保留菜单栏快捷聊天。
    chips: []
  - id: cloud
    name: 云端本体
    icon: ☁️
    zone: cloud
    rect:
      - 27
      - 15
      - 46
      - 56
    free: true
    qs:
      - q_kernel
      - q_inject
    role: 持续在线，负责对话、后台工作和内容维护。
    can:
      - 主聊天只管陪你说话和分派，多步的事交给后台任务
      - 只用「说话」回复，一轮可以说好几次；关键一步之前发选项卡问你
      - 写动态和点子，按时跟进目标
      - 使用已连接服务、已授权设备和云端浏览器
    cannot:
      - 没有轮询式的模型心跳：动态、目标跟进、点子都是定时安排
      - 不全量搬走设备数据，不把原始短信当记忆
    holds:
      - 个人内容、账号配置与会话记录
    chips:
      - id: cl_sched
        name: 调度器
        icon: ⏰
        at:
          - 4
          - 3
          - 35
          - 25
        desc: 到点做事
        doc: |-
          - 动态：白天（默认 7:00–23:00）每 30 分钟看一次，只发上次之后出现的新消息，一次 0 到 2 条，没有就不发；间隔和时段可以改，也可以关掉；点「刷新」马上看一次。
          - 目标按各自约定的频率跟进；点子每周一换一批；夜间整理每天 22:30。
          - 每 3 小时从在线的手机同步一次健康数据，不经过模型、不花 token。
          - 会对你说话的定时任务在主会话里跑，你回它时上下文是全的：目前只有目标跟进；主会话正忙就等这一轮说完再来。
          - 只产出内容或做整理的在后台各开一个新会话，不占住聊天、也不对你说话：动态、点子、夜间整理、补读；健康同步不经过模型。
      - id: cl_appgw
        name: App 网关
        icon: 🚪
        at:
          - 4
          - 37
          - 35
          - 23
        desc: 让两端看到同一进展
        doc: |-
          - 用户消息直接送进当前这一轮。同一条消息因为连点或网络重发到了两次，只算一次。
          - 把豆豆说的话、卡片、头像状态和后台活动推到两端；App 关闭不影响云端工作。
          - 赞踩、动态说明、目标和设置的修改都从这里进来。
      - id: cl_harness
        name: Claude Harness
        icon: ⚙️
        at:
          - 47
          - 3
          - 49
          - 25
        desc: 说话 · 模型 · 上下文
        doc: |-
          - 内核不变，仍是 Claude Agent SDK。
          - 系统提示词是一整份，两段拼成：前面是通用工作守则（Claude Code 自带的那份，删掉了和豆豆冲突的句子，比如「正文就是给用户看的」「动手前先说一句」「结尾写总结」「主要做软件工程」）；后面是豆豆的业务提示词，完整保留，开头写明以上是什么、以下是什么，不一致时以下面为准。
          - 主聊天是一条连续的会话，不会每条消息另开一个。你说的每句话、豆豆说的每句话都在同一份上下文里；上下文满了自动压缩。
          - 独立会话（全新上下文，带系统提示词，第一条消息就是任务）只用在不需要和你对话的事上：动态、点子、夜间整理、补读、委派出去的重活；旁聊是你自己另开的独立会话。委派的重活做完，结果交回主会话。
          - 新增「说话」：豆豆对你说话的唯一出口，带文字和卡片；工具过程和正文只进轨迹，不进聊天。一轮快结束时如果写了正文却没用「说话」，云端提醒它一次：要说给你听的用「说话」发，只是旁白就直接结束。后台会话不能说话。
          - 忙时收到的新消息在下一步之前交给模型；这一轮是系统发起的（比如交还浏览器后接着干），你的消息也进这一轮。
          - 工具环境：Python 默认 3.11，预装 PDF、Word、Excel 解析库和 PDF 转文字工具。
          - 不设工具审批。走到关键一步之前（下单付款、发出消息或邮件、提交表单、删除、替你答应别人），先用「说话」发选项卡问你，你点了才继续。
          - 模型在 App 里切换，从下一轮起全部用新模型；推理强度 max；内置模型预计下一次输入约 272K 时内置压缩，自定义模型约 100K。
          - 权限：自动（默认）拦下危险操作，完全放行什么都不拦；两种都不向 App 弹请求。
      - id: cl_devgw
        name: 设备网关
        icon: 🔗
        at:
          - 4
          - 70
          - 35
          - 23
        desc: 在线设备 · 已授权能力
        doc: |-
          - 只调用用户已开启的设备能力；离线、未授权或失败都返回具体原因。
          - 按需读取这一次需要的数据，也可以让豆豆看到设备截图。
      - id: cl_fs
        name: 内容库
        icon: 💾
        at:
          - 47
          - 37
          - 49
          - 23
        desc: 约定好的目录
        q: q_dirs
        doc: |-
          - 按 App 的栏目分区，打开哪个栏目就展示哪一块：动态、点子、目标、资源库（构件、影音）。
          - 控制台里的三块：记忆（总档和各分类）、灵魂（名字、性格、日记）、健康（从手机同步，豆豆只读）。
          - 你上传的文件单独一块，豆豆只读不动；还没收尾的事记在跟进清单里。
          - 上传的文件和健康数据怎么读都行，包括用命令行；只拦写入、改名、移动和删除。
          - 草稿区放过程文件，7 天没动自动清理；用熟的做法整理成技能，下次直接用。
          - 系统区放设置、连接账号、会话记录、定时安排和云端浏览器的登录状态，豆豆不直接改。
          - 不再有简报：旧简报移进备份，旧站点并进构件，日记和角色并进灵魂。
      - id: cl_feed
        name: 动态
        icon: 📰
        at:
          - 47
          - 70
          - 49
          - 23
        desc: 一条帖子一个文件
        q: q_feed_src
        doc: |-
          - 每次只找上次之后发布的新消息，时效第一；同一件事发过就不再发，有实质新进展才发续篇。
          - 从哪找：动态说明里点名的渠道（新闻站、博客、RSS、X 等公开页面）和网页搜索；你在云端浏览器里登录过的网站（比如 X 的时间线）也能去看。公众号、小红书这类封闭平台先不接。
          - 帖子带标题、来源、原文链接、发布时间，可选配图和小表格。
          - 写之前读动态说明、总档、近两周的赞踩，以及近三天已发的帖子。
          - 配图用原文自己的图，下载到本地；没有就不配，不生成图。
          - 赞、踩、讨论记进反馈记录，下一批参考。
  - id: cloudpc
    name: 云端浏览器
    icon: 🌐
    zone: cloud
    rect:
      - 78
      - 45
      - 21
      - 24
    qs:
      - q_cloudpc
    role: 云主机上一个带界面的 Chrome，跑在虚拟显示器里，不另开虚拟机；完整的云电脑以后再说。
    can:
      - 打开网页、点击、填写，像人一样用网站
      - 保留登录状态
      - App 里看实时画面，随时接管
    cannot:
      - 不碰你的设备
      - 登录和验证码交给你在 App 里接管
    holds:
      - 豆豆的浏览器登录状态和下载的文件
    chips: []
  - id: model
    name: 模型服务
    icon: 🧠
    zone: third
    rect:
      - 27
      - 0
      - 28
      - 12
    role: 提供推理；内置 ZenMux，也可以自己添加服务；在 App 设置里选择，下一轮起生效。
    can:
      - 内置 ZenMux 的五种模型，以及你自己添加的任何 Anthropic 协议服务
      - 推理强度均为 max
      - 内置模型预计下一次输入约 272K 时压缩（CLI 策略窗口 305K），自定义模型约 100K
    cannot:
      - 不负责个人内容的长期保存
    holds:
      - 本轮对话，以及用到的记忆与设备、服务结果
    chips:
      - id: md_main
        name: Haiku 5.5
        icon: 🧠
        desc: 默认模型
      - id: md_opus
        name: Opus 5.5
        icon: 🧠
        desc: 消耗约 40×；缓存读约 20×
      - id: md_glm_flash
        name: GLM 5.3 Flash
        icon: 🧠
        desc: 可在设置中切换
      - id: md_glm
        name: GLM 5.3 FlashX
        icon: 🧠
        desc: 可在设置中切换
      - id: md_mimo
        name: MiMo-V2.6-Pro
        icon: 🧠
        desc: 可在设置中切换
      - id: md_custom
        name: 自己添加的服务
        icon: ➕
        desc: Base URL + 模型 ID
        doc: |-
          - 设置 → 模型 → 添加模型服务：填名称、Base URL、API Key；协议固定 Anthropic，显示但不能改。
          - 一个服务下可以加多个模型，每个填模型 ID 和显示名。
          - 保存前先测一次连接，通了才能保存；Key 存在云端，App 里只显示末四位。
          - 选中后，聊天、动态、点子、目标跟进、夜间整理、活动标题都用它，和内置模型一样。
  - id: conn
