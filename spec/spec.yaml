        phone: |-
          权限
          自动：拦下危险操作
          完全放行：什么都不拦
        log: 权限有自动和完全放行，默认自动；两种都不会向 App 弹请求。
      - t: 6000
        pkt: e_grant
        log: 切换权限，两端同步，从下一轮起生效。
      - t: 7200
        "on":
          - cl_harness
        log: 上下文窗口 200K，约 167K 时使用内置压缩；保留内置提示词，接上豆豆业务提示词。
questions:
  - id: q_boundary
    title: 对外动作
    decided: 没有工具审批页面。意图明确就直接做，不明确先在聊天里问；涉及钱、合同、对第三方的承诺、不可恢复删除仍先问。只在已支持且已授权的能力内执行。
  - id: q_dirs
    title: 内容怎么分区
    decided: 成品长期维护、备份并在 App 展示；任务草稿可以清理；设置和运行状态单独管理。重复用到的做法整理成技能。
  - id: q_sync
    title: 增量补读
    decided: 设备重连且距上次补读至少 20 小时，单独补读已开启的来源。记忆写完才算完成；中断后继续，避免重复。云端来源需对应定时安排。
  - id: q_session
    title: 上下文与压缩
    decided: 统一 200K 窗口，输入约 167K 时使用 Claude Code 内置压缩，不附加自定义压缩要求。
  - id: q_site
    title: 今日与站点
    decided: 今日分简报、站点。简报直接看 HTML 卡片，没有详情页；站点长期保留，可以自由做页面，标题、简介、缩略图由 App 展示。
  - id: q_conn
    title: 连接器与设备
    decided: 云端一服务一连接器，只连接已支持的服务，可让豆豆引导、代填。设备能力需要在本机授权，可能离线。内置能力不展示，不支持自建连接器。
  - id: q_prompt
    title: 系统提示词
    decided: 保留 Claude Code 内置提示词，把豆豆的业务提示词接在后面。每次新会话和压缩后读总档；简报写法仅附在简报定时消息后。
  - id: q_memory
    title: 记忆库
    decided: 总档概括全部主题，分类下按主题整理。只记来源明确、稳定、值得留存的事实；事实变了原地更新，不保存被推翻的旧内容。健康卡只放实际读到的指标。
  - id: q_host
    title: 云主机
    decided: 本体住在用户自己的 ECS 云主机上，App 关闭后仍能工作。
  - id: q_model
    title: 模型
    decided: Haiku 5.5（默认）、MiMo V2.6 Pro、GLM 5.3 FlashX；App 内切换，两端同步，下一轮起全部使用新模型，推理强度 max。
  - id: q_proto
    title: 设备离线
    decided: 立即说明「设备离线」，读不到的内容不编造、不反复重试。
  - id: q_push
    title: App 不在前台时如何联系
    decided: 设备仍在线时，回复和任务完成可发系统通知，用户可关闭。设备断开或进程被关闭时不承诺送达，独立离线推送后放。
  - id: q_hw
    title: 以后的硬件
    decided: 后放。
  - id: q_spike
    title: 规格的用途
    decided: 用于对齐产品决定与使用过程；本地模拟不等于云端或真实设备验收。
  - id: q_health
    title: 厂商健康数据能否接入？
    body: Health Connect 支持的指标已定，但荣耀等厂商健康 App 是否向它同步，需要真机验证；计步传感器兜底只有步数。
    rec: 用真机确认数据来源、可用指标和授权效果，再决定是否需要补充来源。没有数据时显示 -- / 暂不可读，不编造。
  - id: q_secret
    title: 账号代填
    decided: 允许豆豆引导并代填，提醒授权码会留在聊天记录中；用户也可直接在 App 表单填写。
  - id: q_heartbeat
    title: 主动性
    decided: 按消息和定时安排工作，没有主动的模型心跳；维持设备连接不触发推理。
  - id: q_browser
    title: Mac 内置浏览器
    decided: 自带多标签豆豆浏览器，登录持久并与 Safari、Chrome 隔离；用户可随时接手。需要已有浏览器登录时可直接操作那个浏览器，鼠标自然移动。
  - id: q_permission
    title: 权限
    decided: 自动（默认）拦下危险操作，完全放行什么都不拦；App 内切换，下一轮起生效，两种都不会向 App 弹请求。
  - id: q_briefs
    title: HTML 简报
    decided: 一份 1–6 张卡片，最高为屏幕的 75%，超出内部滚动，无详情页；按钮发消息到聊天，其他跳转和网络请求全部拦截。
  - id: q_task
    title: 任务续聊
    decided: 进行中和已完成的任务都可看记录、接着聊；保留完整上下文，在后台继续，完成通知照旧。
