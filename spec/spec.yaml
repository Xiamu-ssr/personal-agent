prompts:
  - id: p_system
    name: 本体系统
    when: 启动主会话、隔离会话和后台 agent 时；运行层只取第一个 --- 后的正文，名字、称呼、时区在启动时填一次。
    sources:
      - file: prompts/system-prompt.md
        kind: file
  - id: p_morning
    name: 晨报
    when: 每天 07:30，或用户手动运行；主会话接闹钟后派后台 fork。
    sources:
      - file: ../cloud/seed/system/schedule.json
        kind: json
        item: morning
        field: prompt
  - id: p_evening
    name: 晚报
    when: 每天 21:30，或用户手动运行；主会话接闹钟后派后台 fork。
    sources:
      - file: ../cloud/seed/system/schedule.json
        kind: json
        item: evening
        field: prompt
  - id: p_health_weekly
    name: 健康周报
    when: 周日 20:00，或用户手动运行；写简报和健康指标。
    sources:
