    - id: imap
      name: 其他邮箱
      description: 读取 其他邮箱里的邮件（只读，不发信、不删信、不标记已读）
      multiAccount: true
      setup:
        - 邮箱地址
        - 授权码 / 客户端专用密码
        - IMAP 服务器
        - 端口（可选）
        - 备注（可选）
    - id: tavily
      name: Tavily
      description: 深入调研和整篇网页正文提取；明确额度耗尽后尝试备用账号
      multiAccount: true
      setup:
        - API Key
    - id: weread
      name: 微信读书
      description: 查看书架、阅读统计、划线和想法，搜索书籍
      multiAccount: false
      setup:
        - 个人 API Key
    - id: wind
      name: Wind AI
      description: 万得金融数据：股票、基金、指数、债券、宏观、公告研报、量化分析；连上时一起装好官方技能；明确额度耗尽后切换备用账号，有状态任务保持账号一致
      multiAccount: true
      setup:
        - API Key
    - id: tencent-quotes
      name: 腾讯行情
      description: 免费查询沪深京股票、ETF 和指数的最新公开报价；无需 Key、默认关闭、保留报价时间、只读不交易
      multiAccount: false
      setup: []
    - id: amap
      name: 高德地图
      description: 搜索地点与周边，查询距离、步行/驾车/公交/骑行路线和天气；使用 Web 服务 Key，云端调用
      multiAccount: false
      setup:
        - 高德开放平台的 Web 服务 Key
    - id: github
      name: GitHub
      description: 查看仓库、issue、评论和通知（只读，不标记通知已读）
      multiAccount: false
      setup:
        - 个人访问令牌（classic PAT）：公开仓库和通知勾选 notifications；私有仓库还需 repo
prompts:
  - id: p_base
    name: 通用工作守则
    when: 每次对话，排在系统提示词最前面
    source:
      file: prompts/base.md
  - id: p_system
    name: 系统提示词
    when: 每次对话，拼在通用工作守则后面
    source:
      file: prompts/system-prompt.md
  - id: p_feed
    name: 动态
    when: 白天每 30 分钟一次（默认 7:00–23:00，可改），以及点「刷新」
    source:
      file: prompts/feed.md
  - id: p_goal
    name: 目标跟进
    when: 按每个目标约定的频率
    source:
      file: prompts/goal-checkin.md
  - id: p_ideas
    name: 点子
    when: 每周一 8:00，以及点「换一批」
    source:
      file: prompts/ideas.md
  - id: p_night
    name: 夜间整理
    source:
      file: ../cloud/seed/system/schedule.json
      item: night
