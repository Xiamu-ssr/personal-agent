# 豆豆 0.5 产品规格；提示词正文与触发时间在构建时读取最新源文件。
meta:
  version: "0.5"
  title: 豆豆 · 产品规格
  subtitle: Spec 0.5 · 点节点看产品决定，点场景看使用过程
layout:
  width: 1080
  height: 860
  padding: 16
initialState:
  memory:
    profile: 1
    people: 2
    preferences: 4
    life: 2
    work: 1
    project: 1
    interests: 1
    history: 1
    health: 3
    finance: 1
    feedback: 0
    automation-prefs: 1
    role: 1
    voice-notes: 0
  stats:
    egress: 0
    sub: 0
    mem: 0
    dev: 0
  phone: 豆豆 · 等待中…
ui:
  overview: |-
    # 一起对齐豆豆
    - 点节点，查看它能做什么和用户会看到什么。
    - 点场景，按步骤看一次完整的使用过程。
    - 提示词区只有六条，点开可读全文。
    - 「待对齐」保留未定问题和已定事项。
    - 这里只做本地演示，不连接真实云端或设备。

    ## 连线
    - 蓝色：指令。
    - 金色：个人数据。
    - 绿色：结果。
    - 紫色：进度或上线。
  stats:
    egress: 次发往第三方
    dev: 次设备调用
    sub: 个后台任务
    mem: 处记忆更新
  memoryLabels:
    profile: 总档
    people: 人际
    preferences: 偏好
    life: 生活
    work: 工作
    project: 项目
    interests: 兴趣
    history: 历史
    health: 健康
    finance: 财务
    feedback: 反馈
    automation-prefs: 自动化偏好
    role: 角色
    voice-notes: 语音笔记
zones:
  dev:
    label: 你的设备
    color: "#2faa7a"
  cloud:
    label: 你的云
    color: "#3b82f6"
  third:
    label: 第三方
    color: "#f08a3c"
kinds:
  cmd:
    label: 指令
    color: "#3b82f6"
  data:
    label: 个人数据
    color: "#f59e0b"
  result:
    label: 结果
    color: "#10b981"
  event:
    label: 进度/上线
    color: "#8b5cf6"
domains:
  - id: app
    name: 豆豆 App
    icon: 📱
    zone: dev
    rect:
      - 1
      - 15
      - 22
      - 41
    role: 安卓与 Mac 是同一个产品的两种布局。
    can:
      - 聊天 / 今日 / 任务 / 记忆 / 豆豆五个栏目
      - 今日分简报与站点，默认看简报
      - 自己连接应用，或请豆豆引导、代填
      - 设置模型、权限、设备、技能、通知与账号
    cannot:
      - 设备能力由用户在那台设备上授权；云端维护记忆
    holds:
      - 聊天和内容的本地缓存
    chips:
      - id: app_chat
        name: 聊天
        icon: 💬
        desc: 输入框一直可用
        doc: |-
          - 忙时新消息按提交顺序排队；处理前可长按修改或撤回。
          - 已开始处理时提示「豆豆已经在看这条了」。撤回不留历史，修改只留最终内容。
          - 停止当前回复、停止某个后台任务分别操作，不清空其他任务和排队消息。
          - 支持文字、文件、图片、拍照、按住说话与语音笔记；在线绿点、离线灰点、忙时金色呼吸。
      - id: app_board
        name: 今日
        icon: 📋
        desc: 简报 · 站点
        doc: |-
          - 默认简报，按天分组、时间倒序，直接上下翻看 HTML 卡片，没有详情页。
          - 卡片最高为屏幕的 75%，超出部分内部滚动；卡片按钮可发消息并切到聊天。
          - 聊天中的简报入口显示名字与时间，点后切到今日并定位那份简报。
          - 站点常驻，以两列缩略图展示标题、简介和更新时间，点开可用。
      - id: app_task
        name: 任务
        icon: ✅
        desc: 看记录 · 接着聊
        doc: |-
          - 分「任务 / 定时」；进行中置顶并可单独停止，已完成按今天 / 近 7 天 / 更早分组。
          - 点任意任务看任务说明、默认折叠的步骤与结果；进行中每 3 秒更新记录。
          - 底部可接着聊，保留这项任务的完整上下文，继续在后台做，完成后照常通知。
          - 定时任务显示名字与触发时间，可以立即运行；系统维护不提供手动运行。
      - id: app_mem
        name: 记忆
        icon: 🗂
        desc: 总档 · 健康 · 分类
        doc: |-
          - 总档摘要作大卡，查看全部可读完整内容，相关主题可点开。
          - 健康卡显示睡眠、静息心率、步数、心率变异性，缺失数据显示「--」。
          - 语音笔记显示条数和最近时间，其余分类只展示有内容的文件夹卡。
      - id: app_diary
        name: 豆豆
        icon: 📔
        desc: 头像 · 便签日记
        doc: |-
          - 轮廓可选豆子、女生、男生、猫；配色可选晨雾蓝、暮光金、薄荷、樱粉，两端同步。
          - 显示陪伴的起始日期；换头像只改外观，豆豆的性格不变。
          - 日记像浅色便签，左右滑看摘要，点开读全文，也可查看全部日记与豆豆的设定。
      - id: app_set
        name: 设置
        icon: ⚙️
        desc: 模型 · 权限 · 连接
        doc: |-
          - 模型：Haiku 5.5（默认）、MiMo V2.6 Pro、GLM 5.3 FlashX，每项显示一行消耗说明。
          - 权限：自动（默认）/ 完全放行；两种都不会向 App 弹请求。
          - 选择两端同步，从下一轮起生效。保留连接应用、设备、技能、通知、云端地址、配对、退出登录与版本。
          - 顶部会员卡只展示称呼与陪伴天数。
      - id: app_guide
        name: 引导
        icon: 🧭
        desc: 一键开启 · 可跳过
        doc: |-
          - 本机页和首次引导都可一键开启，也可逐项开关或跳过。
          - 安卓集中申请系统权限，再申请运动健康；Mac 按系统要求依次授权。
          - 其他设备的能力只读展示，要去那台设备上开关。
      - id: app_connect
        name: 连接应用
        icon: 🧩
        desc: 云端 · 本机
        doc: |-
          - 一服务一连接器，使用官方图标，已连接的排在前面；本机列出这台设备的能力。
          - 统一详情页说明用途、所需参数与账号，支持添加、验证、修改、删除。
          - 同一邮箱服务可连多个账号；自己填表或让豆豆代填，聊天代填会提醒授权码留在记录中。
          - 内置搜索等不列在这里，未支持的服务如实说明暂时接不了。
  - id: mac_app
    name: Mac
    icon: 💻
    zone: dev
    rect:
      - 1
      - 60
      - 22
      - 11
    compact: true
    role: 相同页面的桌面布局，保留菜单栏快捷聊天。
    chips: []
  - id: cloud
    name: 云端本体
    icon: ☁️
    zone: cloud
    rect:
      - 27
      - 15
      - 46
      - 56
    free: true
    qs:
      - q_boundary
    role: 持续在线，负责对话、后台工作和内容维护。
    can:
      - 处理用户消息、定时安排与后台完成通知
      - 后台工作期间仍可聊天，完成后转述结果
      - 使用已连接服务和已授权设备
      - 维护记忆、简报、站点、日记与技能
    cannot:
      - 设备离线或未授权时如实说明
      - 不全量搬走设备数据，不将原始短信当记忆
      - 只接支持的服务，不自行增加连接器
      - 没有主动轮询式的模型心跳
    holds:
      - 个人内容、账号配置与会话记录
    chips:
      - id: cl_sched
        name: 调度器
        icon: ⏰
        at:
          - 4
          - 3
          - 35
          - 25
        desc: 到点做事
        doc: |-
          - 晨报每天 7:30，晚报每天 21:30，健康周报每周日 20:00，夜间整理每天 22:30。
          - 定时消息原样交给主会话；简报在后台完成，不占住聊天。
          - 完成后告诉用户结果；主会话可以继续润色。夜间整理单独做，不打扰聊天。
          - 站点需要刷新时另设定时安排，不会因为建了站点就自动刷新。
      - id: cl_appgw
        name: App 网关
        icon: 🚪
        at:
          - 4
          - 37
          - 35
          - 23
        desc: 让两端看到同一进展
        doc: |-
          - 接收用户消息，展示回复、排队、后台进度与完成结果。
          - 新内容和设置同步到两端；App 关闭不影响云端工作。
      - id: cl_harness
        name: Claude Harness
        icon: ⚙️
        at:
          - 47
          - 3
          - 49
          - 25
        desc: 模型 · 权限 · 上下文
        doc: |-
          - 模型：Haiku 5.5（默认）、MiMo V2.6 Pro、GLM 5.3 FlashX，在 App「设置 → 模型」里切换；从下一轮起主会话、后台任务、夜间整理、补读与自动判断全部用新模型。
          - 推理强度：max。
          - 权限：自动（默认）会拦下危险操作，完全放行什么都不拦；在 App 切换，两种都不会向 App 弹请求。
          - 上下文：200K 窗口，输入约 167K 时使用 Claude Code 内置压缩，不追加自己的压缩要求。
          - 系统提示词：保留 Claude Code 内置的，豆豆业务提示词接在后面。
      - id: cl_devgw
        name: 设备网关
        icon: 🔗
        at:
          - 4
          - 70
          - 35
          - 23
        desc: 在线设备 · 已授权能力
        doc: |-
          - 只调用用户已开启的设备能力；离线、未授权或失败都返回具体原因。
          - 按需读取这一次需要的数据，也可以让豆豆看到设备截图。
      - id: cl_fs
        name: 内容库
        icon: 💾
        at:
          - 47
          - 37
          - 49
          - 23
        widget: memory
        desc: 成品 · 草稿 · 设置
        doc: |-
          - 记忆、简报、站点、日记和用户附件长期保留，命名清楚、没有重复和半成品。
          - 任务草稿可接着用，已完成的可清理，7 天未动的草稿自动清理。
          - 配置和运行状态单独管理；重复用到的做法整理成技能。
        q: q_dirs
      - id: cl_briefs
        name: 简报
        icon: 📋
        at:
          - 47
          - 70
          - 49
          - 23
        desc: HTML 卡片 · 没有详情页
        doc: |-
          - 一份简报有 1–6 张 HTML 卡片，第一张总览，其他卡片各讲一个主题，可使用自己的样式和 CSS 动画。
          - 高度随内容，最高为屏幕的 75%，超出部分内部滚动；卡片不能点进详情。
          - 配色可选银蓝 + 香槟金、晨雾、薄荷、暮光，两端使用相同基础样式。
          - 按钮发一条用户消息并切到聊天；外部跳转与网络请求全部拦截，图片需自带。
  - id: model
    name: ZenMux
    icon: 🧠
    zone: third
    rect:
      - 27
      - 0
      - 28
      - 12
    role: 提供推理；在 App 设置里选择，下一轮起生效。
    can:
      - 三种模型的推理强度均为 max
    cannot:
      - 不负责个人内容的长期保存
    holds:
      - 本轮对话，以及用到的记忆与设备、服务结果
    chips:
      - id: md_main
        name: Haiku 5.5
        icon: 🧠
        desc: 默认模型
      - id: md_mimo
        name: MiMo V2.6 Pro
        icon: 🧠
        desc: 可在设置中切换
      - id: md_glm
        name: GLM 5.3 FlashX
        icon: 🧠
        desc: 可在设置中切换
  - id: conn
    name: 云端连接器
    icon: 🧩
    zone: third
    rect:
      - 59
      - 0
      - 34
      - 10
    compact: true
    role: 已经支持的在线服务，一服务一连接器。
    can:
      - 只读邮箱、深入调研与网页正文、微信读书
      - 同一邮箱服务可连多个账号；Tavily、微信读书各连一个账号
    cannot:
      - 未支持的服务暂时接不了，内置能力不展示
    holds:
      - 第三方账号数据
    doc: "- 在 App 自己填写参数，或请豆豆引导、代填；账号验证成功才保存。"
    chips: []
    catalog: connectors
  - id: dev
    name: 端侧连接器
    icon: 🔌
    zone: dev
    rect:
      - 78
      - 15
      - 21
      - 24
    role: 手机与电脑是豆豆的手脚，需要授权，也可能离线。
    can:
      - 执行已经开启的本机能力
    cannot:
      - 不整盘上传；离线或未授权时不执行
    holds:
      - 原始短信、日历、运动健康与电脑文件
    chips:
      - id: dev_android
        name: 安卓
        icon: 🤖
        desc: 通知 · 位置 · 日历 · 短信 · 健康
        doc: |-
          - 在线且授权后，可读电量、位置、日历、短信，发通知、写剪贴板。
          - 运动健康优先读 Health Connect 的步数、睡眠、心率与心率变异性；不可读时仅可用系统计步。
          - 链接通过通知交给用户点击，不自动打开页面。被系统关闭后台时显示离线。
          - 厂商健康数据是否可读需真机确认；缺失就说明原因，不编造。
      - id: dev_mac
        name: Mac
        icon: 💻
        desc: 命令行 · 操作电脑 · 浏览器 · 日历
        doc: |-
          - 在线且授权后，可执行命令、操作电脑、访问文件，发通知、读取日历；睡眠或断线时显示离线。
          - 桌面、文稿、下载分别授权；操作电脑需要用户开启屏幕录制与辅助功能。
          - 自带多标签「豆豆浏览器」，保留登录状态，与 Safari、Chrome 隔离，用户可随时接手。
          - 需要已有浏览器登录时可操作那个浏览器；鼠标自然移动。Mac 不提供运动健康数据。
  - id: prompts
    name: 提示词
    icon: 📝
    zone: cloud
    rect:
      - 1
      - 75
      - 98
      - 16
    role: 名字、触发条件、提示词全文。
    chips:
      - id: p_system
        name: 系统提示词
        icon: 📝
        prompt: p_system
      - id: p_morning
        name: 晨报
        icon: 📝
        prompt: p_morning
      - id: p_evening
        name: 晚报
        icon: 📝
        prompt: p_evening
      - id: p_health_weekly
        name: 健康周报
        icon: 📝
        prompt: p_health_weekly
      - id: p_night
        name: 夜间整理
        icon: 📝
        prompt: p_night
      - id: p_brief_guide
        name: 简报写法
        icon: 📝
        prompt: p_brief_guide
edges:
  - id: e_msg
    from: app
    to: cloud
    label: 消息
    kind: cmd
    "off": -45
    desc: 你在聊天或任务里说的话
    trigger: 你发消息
    trust: 来自你本人
  - id: e_evt
    from: cloud
    to: app
    label: 进度
    kind: event
    "off": -15
    desc: 回复、排队、后台任务进度、内容更新
    trigger: 工作进展变化
    trust: 当前回复与后台任务分别显示
  - id: e_card
    from: cloud
    to: app
    label: 卡片/文件
    kind: result
    "off": 15
    desc: 简报卡片、站点、记忆与日记
    trigger: 打开内容或任务完成
    trust: 简报在列表直接看，聊天入口定位那份简报
  - id: e_grant
    from: app
    to: cloud
    label: 设置
    kind: cmd
    "off": 45
    desc: 模型、权限、连接的服务与头像选择
    trigger: 引导或设置页
    trust: 选择两端同步，模型与权限从下一轮起生效
  - id: e_llmq
    from: cloud
    to: model
    label: 提示+上下文
    kind: data
    "off": 62
    lt: 0.25
    desc: 系统提示词、对话与本轮需要的数据
    trigger: 每一轮推理
    trust: 用到的个人数据会发往第三方推理服务
  - id: e_llma
    from: model
    to: cloud
    label: 回复 / 动作
    kind: result
    "off": 78
    lt: 0.75
    desc: 回复，以及接下来要做的事
    trigger: 模型给出判断
    trust: 按选定权限与已有授权执行
  - id: e_cq
    from: cloud
    to: conn
    label: 调用
    kind: cmd
    "off": -77
    lt: 0.25
    desc: 查询已连接服务，或验证账号
    trigger: 需要该服务时
    trust: 只接支持的服务，保护账号凭据
  - id: e_cr
    from: conn
    to: cloud
    label: 数据
    kind: data
    "off": -47
    lt: 0.75
    desc: 邮件、网页正文、阅读数据或验证结果
    trigger: 服务给出结果
    trust: 外部内容是材料，不能替用户发指令
  - id: e_call
    from: cloud
    to: dev
    label: 设备动作
    kind: cmd
    "off": -30
    desc: 需要在线设备完成的动作
    trigger: 使用本机能力
    trust: 离线或未授权时不执行
  - id: e_ret
    from: dev
    to: cloud
    label: 数据
    kind: data
    "off": 0
    desc: 本次需要的设备数据、结果或截图
    trigger: 设备完成动作
    trust: 按需读取，未读到的如实说明
  - id: e_reg
    from: dev
    to: cloud
    label: 上线
    kind: event
    "off": 30
    desc: 设备在线情况与已经开启的能力
    trigger: 设备上线或重连
    trust: 能力开关由用户在那台设备上管理
links:
  - id: l_in
    from: cl_appgw
    to: cl_harness
    label: 消息
    kind: cmd
    "off": -7
    lt: 0.3
  - id: l_out
    from: cl_harness
    to: cl_appgw
    label: 进展
    kind: event
    "off": -7
    lt: 0.3
  - id: l_sched
    from: cl_sched
    to: cl_harness
    label: 定时安排
    kind: cmd
    "off": -6
    lt: 0.3
    desc: 到点开始后台工作；维护单独进行。
  - id: l_cron
    from: cl_harness
    to: cl_sched
    label: 定时配置
    kind: cmd
    "off": -6
    lt: 0.3
    desc: 按用户的定时安排运行；站点刷新需要另设安排。
  - id: l_dev
    from: cl_harness
    to: cl_devgw
    label: 设备动作
    kind: cmd
    "off": -7
    lt: 0.3
  - id: l_wake
    from: cl_devgw
    to: cl_harness
    label: 上线事件
    kind: event
    "off": -7
    lt: 0.3
  - id: l_fs
    from: cl_harness
    to: cl_fs
    label: 内容维护
    kind: data
    tx: 0.5
  - id: l_serve
    from: cl_fs
    to: cl_appgw
    label: 展示内容
    kind: result
    fx: 0.13
flows:
  - id: f_onboard
    name: 首次使用 · 开启与连接
    icon: 🧭
    steps:
      - t: 0
        "on":
          - app_guide
        phone: |-
          首次登录 · 开通本机能力
          一键开启，也可逐项开关或跳过
        log: 登录后选择本机能力，可一键开启、逐项开关或跳过。
      - t: 1000
        "on":
          - dev_android
        log: 安卓集中申请系统权限，再申请运动健康。
      - t: 2100
        pkt: e_reg
        log: 设备上线，展示已经开启的能力。
      - t: 3200
        "on":
          - cl_devgw
        log: 豆豆只使用用户已开启的能力。
      - t: 4000
        "on":
          - dev_mac
        log: Mac 依次授权通知、日历、文件夹和操作电脑；浏览器自带。
      - t: 5100
        "on":
          - app_connect
        phone: |-
          连接应用 · 云端
          QQ 邮箱 / 163 邮箱，各自一个连接器
          点服务，在统一详情页添加账号
        log: 连接应用只展示已支持的服务。
      - t: 6200
        pkt: e_grant
        log: 填写邮箱地址与授权码，这里使用本地示例。
      - t: 7000
        pkt: e_cq
        "on":
          - conn
        log: 先验证账号能否连接。
      - t: 8100
        pkt: e_cr
        log: 验证成功；失败则保留输入并说明原因。
      - t: 9200
        "on":
          - cl_appgw
        log: 账号保存，凭据不以明文展示。
      - t: 10300
        "on":
          - cl_harness
        log: 新账号从下一轮起可用。
      - t: 11400
        pkt: e_evt
        log: 两端更新连接状态。
      - t: 12500
        "on":
          - app_set
        phone: |-
          已开启本机能力
          QQ 邮箱 · 1 个账号已连接
          其他设备去对应设备上开启
        log: 开启完成；其他设备的开关要去那台设备上管理。
  - id: f_chat
    name: 聊天 · 了解与回应
    icon: 💬
    steps:
      - t: 0
        "on":
          - app_chat
        phone: |-
          你：周六带娃去哪？
          以后周末优先室内活动。
        pkt: e_msg
        log: 用户问周末去处，并明确交代长期偏好。
      - t: 1100
        pkt: l_in
        log: 豆豆结合当前时间与在线设备处理消息。
      - t: 1800
        pkt: e_llmq
        "on":
          - md_main
        log: 所选模型理解需求。
      - t: 2900
        pkt: e_llma
        log: 先查已有的孩子相关记忆。
      - t: 3600
        pkt: l_fs
        log: 阅读相关主题。
      - t: 4400
        pkt: l_fs
        back: true
        log: 了解到孩子 5 岁、怕晒。
      - t: 5100
        pkt: e_llmq
        "on":
          - md_main
        log: 结合记忆继续判断。
      - t: 6200
        pkt: e_llma
        log: 需要当前位置与附近活动信息。
      - t: 6900
        pkt: l_dev
        log: 向在线手机读取位置。
      - t: 7600
        pkt: e_call
        stat:
          dev: 1
        log: 手机已授权位置能力。
      - t: 8600
        pkt: e_ret
        log: 取得本次位置。
      - t: 9400
        pkt: l_dev
        back: true
        log: 位置回到豆豆。
      - t: 9600
        "on":
          - cl_harness
        log: 搜索附近的亲子活动。
      - t: 10600
        log: 搜索结果只作为参考材料。
        "on":
          - cl_harness
      - t: 10800
        pkt: l_out
        log: 整理本次做过的步骤。
      - t: 11400
        pkt: e_evt
        log: App 默认折叠步骤，想看时再展开。
      - t: 12100
        pkt: e_llmq
        "on":
          - md_main
        log: 结合结果形成建议。
      - t: 13200
        pkt: e_llma
        log: 回答，同时记住用户明确交代的偏好。
      - t: 13900
        pkt: l_fs
        mem:
          interests: 1
        log: 只记录室内活动偏好，不从一次提问猜兴趣。
      - t: 14700
        pkt: l_out
        log: 记忆已经更新。
      - t: 15400
        pkt: e_evt
        log: 把建议展示给用户。
      - t: 16400
        "on":
          - app_chat
        phone: |-
          推荐：科技馆，室内避晒，也适合孩子。
          记忆已更新
        log: 用户看到建议与记忆更新提示。
  - id: f_queue
    name: 排队 · 撤回与修改
    icon: ✏️
    steps:
      - t: 0
        "on":
          - cl_harness
          - app_chat
        phone: |-
          豆豆正在转述后台结果
          输入框仍可发送
        log: 豆豆在回复，输入框仍可发送；后台任务另计。
      - t: 900
        pkt: e_msg
        phone: |-
          你：明天提醒取快递
          排队中 · 可撤回 / 修改
        log: 第一条消息排队，处理前可修改或撤回。
      - t: 2000
        pkt: e_msg
        phone: |-
          你：明早 8 点提醒带伞
          排队中 · 可撤回 / 修改
        log: 第二条按提交顺序排队。
      - t: 3100
        "on":
          - app_chat
        pkt: e_msg
        phone: |-
          修改排队消息 B
          明早 9 点提醒带伞
        log: 长按第二条，把提醒改到早上 9 点。
      - t: 4200
        pkt: e_evt
        log: 修改成功，两端同步最终文本。
      - t: 5300
        pkt: e_msg
        log: 长按第一条并撤回。
      - t: 6400
        pkt: e_evt
        phone: |-
          消息 A 已撤回
          消息 B：明早 9 点提醒带伞 · 排队中
        log: 撤回成功，不留聊天历史。
      - t: 7500
        pkt: l_out
        log: 当前回复完成。
      - t: 8500
        pkt: e_evt
        log: 豆豆空闲，开始处理下一条。
      - t: 9500
        pkt: l_in
        log: 只把修改后的最终内容留下来。
      - t: 10500
        pkt: e_llmq
        "on":
          - md_main
        log: 豆豆开始处理提醒。
      - t: 11600
        pkt: e_msg
        log: 开始处理后再尝试撤回。
      - t: 12700
        pkt: e_evt
        phone: 豆豆已经在看这条了
        log: 提示「豆豆已经在看这条了」。
      - t: 13800
        "on":
          - app_chat
        log: 停止当前回复仍保留其他排队消息和后台任务。
  - id: f_config
    name: 连接应用 · 引导与代填
    icon: 🔧
    steps:
      - t: 0
        "on":
          - app_chat
        phone: 你：帮我接上 163 邮箱
        pkt: e_msg
        log: 用户请豆豆接上 163 邮箱，也可自己填表。
      - t: 1100
        pkt: l_in
        log: 豆豆收到接入要求。
      - t: 1800
        pkt: e_llmq
        "on":
          - md_main
        log: 查看当前支持的服务。
      - t: 2900
        pkt: e_llma
        log: 确认所需参数与填写帮助。
      - t: 3600
        "on":
          - cl_harness
        log: 163 邮箱支持同一服务的多个账号。
      - t: 4200
        pkt: e_evt
        phone: |-
          需要邮箱地址和 IMAP 授权码
          按字段帮助去 163 邮箱获取
          可在 App 的连接应用中自己填
        log: 引导用户获取邮箱授权码。
      - t: 5300
        "on":
          - app_chat
        pkt: e_msg
        phone: |-
          你：请替我代填这些参数
          授权码已遮罩
        log: 聊天代填会留在记录中，提醒用户也可在 App 表单填写。
      - t: 6400
        pkt: l_in
        log: 此处仅演示参数，不收集真实凭据。
      - t: 7100
        pkt: e_llmq
        "on":
          - md_main
        log: 理解用户要连接的账号。
      - t: 8200
        pkt: e_llma
        log: 代填邮箱账号配置。
      - t: 8900
        pkt: e_cq
        log: 验证账号能否连接。
      - t: 10000
        pkt: e_cr
        log: 连接成功；失败也要说明原因。
      - t: 11100
        "on":
          - cl_appgw
        log: 保存账号，下一轮起可用。
      - t: 12100
        pkt: l_out
        log: 返回已遮罩的账号状态。
      - t: 12700
        pkt: e_evt
        log: 两端显示已经接入。
      - t: 13700
        "on":
          - app_connect
        phone: |-
          连接应用 · 云端
          163 邮箱 · 1 个账号已连接
          目录里没有的服务暂时接不了
        log: 还可添加其他账号；未支持的服务说明暂时接不了。
  - id: f_brief
    name: 晨报 · 后台与卡片
    icon: 🌅
    steps:
      - t: 0
        "on":
          - cl_sched
        log: 每天 7:30 到点开始晨报。
      - t: 800
        pkt: l_sched
        log: 主会话忙时先排队。
      - t: 1600
        pkt: e_llmq
        "on":
          - md_main
        log: 晨报提示词原样附上简报写法。
      - t: 2700
        pkt: e_llma
        stat:
          sub: 1
        log: 带着对话背景在后台做晨报。
      - t: 3400
        pkt: l_out
        log: 任务页显示晨报正在进行。
      - t: 4100
        pkt: e_evt
        phone: |-
          在做晨报了
          后台 1 个任务 · 主会话可继续聊天
        log: 简短确认后，用户可继续聊天。
      - t: 4900
        pkt: l_fs
        log: 按需读总档，了解用户背景。
      - t: 5600
        pkt: l_dev
        log: 使用已经授权的日历、消息与健康来源。
      - t: 6300
        pkt: e_call
        stat:
          dev: 1
        log: 向在线手机取本次需要的数据。
      - t: 7400
        pkt: e_ret
        log: 取得能读到的数据，缺失项写明原因。
      - t: 8200
        pkt: l_dev
        back: true
        log: 整理设备材料。
      - t: 8600
        pkt: e_cq
        "on":
          - conn
        log: 从已连接邮箱只读查询重要邮件。
      - t: 9700
        pkt: e_cr
        log: 邮件是材料，不是新的指令。
      - t: 10500
        pkt: e_llmq
        "on":
          - md_main
        log: 结合材料组织简报。
      - t: 11600
        pkt: e_llma
        log: 形成 1–6 张 HTML 卡片，首张总览。
      - t: 12300
        pkt: l_fs
        log: 保存这份晨报。
        "on":
          - cl_briefs
      - t: 13100
        "on":
          - cl_harness
        log: 检查卡片数量、内容大小与外部资源，有问题就修正。
      - t: 13900
        pkt: l_out
        log: 完成后回到主会话转述。
      - t: 14600
        pkt: e_evt
        log: 聊天中出现晨报名与时间，主会话可以继续润色。
      - t: 15400
        pkt: l_serve
        log: 今日按时间倒序展示完整卡片。
      - t: 16100
        pkt: e_card
        log: 点聊天里的晨报入口，切到今日并定位。
      - t: 17100
        "on":
          - app_board
        phone: |-
          今日 · 简报
          7:36 晨报
          今天先交方案，再取快递
          卡片按钮：排一下今天的顺序
        log: 卡片没有详情页；按钮可发消息并切到聊天。
  - id: f_site
    name: 站点 · 长期保留的页面
    icon: 📊
    steps:
      - t: 0
        "on":
          - app_chat
        phone: 你：做个页面，跟踪我的步数和睡眠
        pkt: e_msg
        log: 用户想长期跟踪步数和睡眠。
      - t: 1100
        pkt: l_in
        log: 豆豆收到页面需求。
      - t: 1800
        pkt: e_llmq
        "on":
          - md_main
        log: 判断页面要展示什么。
      - t: 2900
        pkt: e_llma
        stat:
          sub: 1
        log: 在后台制作，先简短确认。
      - t: 3600
        pkt: l_dev
        log: 读取最近一周的运动健康。
      - t: 4300
        pkt: e_call
        stat:
          dev: 1
        log: 使用已开启健康能力的手机。
      - t: 5300
        pkt: e_ret
        log: 只用实际读到的步数、睡眠，缺失就说明。
      - t: 6100
        pkt: l_dev
        back: true
        log: 整理健康数据。
      - t: 6800
        pkt: e_llmq
        "on":
          - md_main
        log: 根据数据安排页面。
      - t: 7900
        pkt: e_llma
        log: 生成可独立使用的页面，标题与简介清楚。
      - t: 8600
        pkt: l_fs
        log: 保存为站点，原有站点则原地更新。
      - t: 9400
        "on":
          - cl_appgw
        log: 今日出现站点；不会自动增加刷新安排。
      - t: 10200
        pkt: l_serve
        log: App 展示首屏缩略图，失败时显示站点名。
      - t: 10900
        pkt: e_card
        log: 完成后主会话转述，今日可找到站点。
      - t: 11900
        "on":
          - app_board
        phone: |-
          今日 · 站点
          健康趋势
          步数与睡眠 · 更新于刚刚
          点开使用
        log: 站点长期保留，需要定时刷新时再设安排。
  - id: f_task
    name: 任务 · 记录与续聊
    icon: 🧩
    steps:
      - t: 0
        "on":
          - app_chat
        phone: 你：调研三款儿童安全座椅，出对比表
        pkt: e_msg
        log: 用户要求调研三款儿童安全座椅。
      - t: 1100
        pkt: l_in
        log: 豆豆收到调研要求。
      - t: 1800
        pkt: e_llmq
        "on":
          - md_main
        log: 理解范围与交付目标。
      - t: 2900
        pkt: e_llma
        log: 后台做深入调研，主会话仍可聊天。
      - t: 3600
        pkt: l_out
        stat:
          sub: 1
        log: 登记这项后台任务。
      - t: 4200
        pkt: e_evt
        "on":
          - app_task
        phone: |-
          任务 · 安全座椅调研
          进行中 · 查看对话记录
        log: 点进行中的任务，可看说明与默认折叠的步骤。
      - t: 4900
        pkt: e_cq
        "on":
          - conn
        log: 通过已连接的 Tavily 深入检索。
      - t: 5900
        pkt: e_cr
        log: 得到 12 篇材料，只作为参考。
      - t: 6600
        pkt: e_llmq
        "on":
          - md_main
        log: 后台任务结合原来的需求阅读。
      - t: 7700
        pkt: e_llma
        log: 整理评测要点。
      - t: 8400
        pkt: l_fs
        log: 中间材料留作草稿。
      - t: 9200
        pkt: l_out
        log: 进行中的记录每 3 秒更新，可展开看步骤。
      - t: 9800
        pkt: e_evt
        "on":
          - app_task
        log: App 显示「已读 12 篇」。
      - t: 10500
        pkt: e_llmq
        "on":
          - md_main
        log: 汇总各款差异。
      - t: 11600
        pkt: e_llma
        log: 形成安全座椅对比表。
      - t: 12300
        pkt: l_fs
        log: 保存可长期查看的页面。
      - t: 13100
        pkt: l_out
        log: 主会话收到完成结果，转述要点。
      - t: 13700
        pkt: e_evt
        log: 完成项保留在任务列表。
      - t: 14700
        "on":
          - app_task
        phone: |-
          任务 · 安全座椅调研
          说明 · 步骤 · 对比结果
          输入框：接着聊
        log: 点任务查看说明、步骤与结果，底部可以接着聊。
      - t: 15800
        "on":
          - app_task
        pkt: e_msg
        phone: 你：再加一款适合新生儿的
        log: 在这项任务的输入框补充要求。
      - t: 16800
        pkt: l_in
        log: 保留该任务的完整上下文，继续在后台做。
      - t: 17800
        pkt: e_llmq
        log: 沿用已经读过的材料与原来的对比条件。
      - t: 18900
        pkt: e_llma
        log: 补充新款的判断，更新对比结果。
      - t: 19800
        pkt: l_out
        log: 接着做完后照常发完成通知。
      - t: 20800
        pkt: e_evt
        "on":
          - app_task
        phone: |-
          安全座椅调研 · 已完成
          已补上新生儿款，可以继续追问
        log: 新结果与后续对话仍留在同一项任务里。
  - id: f_night
    name: 夜间整理 · 记忆与日记
    icon: 🌙
    steps:
      - t: 0
        "on":
          - cl_sched
        log: 每天 22:30 开始夜间整理。
      - t: 800
        pkt: l_sched
        log: 整理单独进行，不打扰主聊天。
      - t: 1600
        pkt: e_llmq
        "on":
          - md_main
        log: 按夜间提示词开始维护。
      - t: 2700
        pkt: e_llma
        log: 先看总档与相关主题。
      - t: 3400
        pkt: l_fs
        log: 检查事实的来源与分类。
      - t: 4200
        pkt: l_fs
        back: true
        log: 只保留稳定、来源明确、值得留存的事实。
      - t: 4900
        pkt: e_llmq
        "on":
          - md_main
        log: 合并重复，核对总档指向的主题。
      - t: 6000
        pkt: e_llma
        log: 事实变了就原地更新，删除已被推翻的内容。
      - t: 6700
        pkt: l_fs
        mem:
          feedback: 1
        log: 把用户对晨报的明确反馈整理成长期要求。
      - t: 7500
        pkt: l_fs
        mem:
          people: 0
        stat:
          mem: 1
        log: 先改主题细节，再同步总档。
      - t: 8300
        pkt: l_fs
        log: 重写总档，每项都能找到对应的主题。
      - t: 9100
        pkt: l_fs
        log: 用豆豆自己的视角写今天的日记。
      - t: 9900
        "on":
          - cl_sched
          - cl_harness
        log: 整理完成后停止；上下文压缩使用 Claude Code 内置能力。
      - t: 10600
        pkt: l_serve
        log: App 更新日记列表。
      - t: 11300
        pkt: e_card
        log: 日记以便签展示，点开可读全文。
      - t: 12300
        "on":
          - app_diary
        phone: |-
