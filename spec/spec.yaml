        log: 冷却后下次符合条件的重连从第 2 批继续；最坏重读一批，写前查重
  - id: f_offline
    name: 设备离线·诚实降级
    icon: 🫥
    steps:
      - t: 0
        "on":
          - cl_sched
        log: 07:30 晨报闹钟
      - t: 600
        pkt: l_sched
        label: "[定时] 晨报"
        log: 进入主会话队列
      - t: 900
        bad:
          - dev_android
        dur: 10800
        log: 安卓被杀后台 → 离线
        logKind: bad
      - t: 1700
        pkt: e_llmq
        label: 晨报闹钟
        "on":
          - md_main
        log: → 主模型
      - t: 2800
        pkt: e_llma
        label: Agent fork · 后台
        stat:
          sub: 1
        log: 先派后台 fork，主会话简短确认，继续可聊天
      - t: 3500
        pkt: l_dev
        label: calendar_events
        log: fork → 设备网关
      - t: 4300
        pkt: l_dev
        back: true
        label: 设备离线
        bad:
          - cl_devgw
        dur: 1500
        log: 网关直接回设备离线，不向离线设备派发
        logKind: bad
      - t: 5000
        pkt: e_cq
        label: 未读邮件
        "on":
          - conn
        log: → 已配置邮箱（不依赖手机在线，服务失败也要照实说明）
      - t: 6000
        pkt: e_cr
        label: 3 封重要
        log: ← 本地示例邮件
      - t: 6700
        pkt: e_llmq
        label: 材料（缺日程）
        "on":
          - md_main
        log: 读不到就说读不到，不拿记忆或常识补，不反复重试同一调用
      - t: 7800
        pkt: e_llma
        label: 晨报 JSON
        log: ← 卡片用 note 区块说明日程暂不可读
      - t: 8500
        pkt: l_fs
        label: Write 晨报.json
        log: 写 data/briefs/2026-10-11/晨报.json，PostToolUse 校验
      - t: 9300
        pkt: l_out
        label: task_notification
        log: fork 完成原生唤醒主会话，转述缺失项；job.done 带 path
      - t: 10000
        pkt: e_card
        label: 含离线说明的卡片
        log: App 获取 /api/briefs 并画原生卡片
      - t: 11000
        "on":
          - app_board
        phone: |-
          今日 · 简报
          晨报
          日程暂不可读：手机离线
          邮件：3 封重要
        log: 设备离线 → 诚实降级，保留原有决定
questions:
  - id: q_boundary
    title: 对外动作
    decided: 没有工具审批页面。明确用户意图就直接做，不明确先在聊天里问；钱、合同、对第三方的承诺和不可恢复删除仍先问。只在已经支持且已授权的能力内执行。
  - id: q_dirs
    title: 工作目录怎么分区？
    decided: 保留三区：data/ 精心维护、备份、App 展示；workspace/ 放任务草稿；system/ 放配置和状态。目录约定不变，只更新简报格式和账号配置的文件说明。第二次使用的做法整理成 .claude/skills/ 技能。
  - id: q_sync
    title: 增量补读
    decided: 已开启且支持 sync 的设备来源在重连时隔离补读，目前距上次补读至少 20 小时，不按自然日计数；云端来源需要对应定时配置。
    rec: 设备游标在 system/sync/<设备>.json，连接器游标在 system/connectors/<名>/state.json。分批读，写完记忆再 sync_commit；未提交游标不动，冷却后再次触发可续读。
  - id: q_session
    title: 压缩
    decided: CLI 策略窗口 200K，预留输出 20K、摘要 13K，下一请求输入估计约 167K 时自动压缩。缓存读 / 写计入输入；夜间另有空闲 /compact，忙则跳过。
  - id: q_site
    title: 看板与站点
    decided: 看板 = 简报 + 站点，App 名为今日。简报 JSON 原生卡片；站点仍是 data/sites/<名>/index.html，存在即站点，不做低代码；标题和简介在 HTML 里，缩略图由 App 生成。
  - id: q_conn
    title: 连接器和设备怎么分
    decided: 设备能力经 devices MCP 调用，用户本机授权、可能离线；云端一服务一连接器，代码随版本发布，可配多账号。内置能力不展示，不做自建连接器。
    rec: 豆豆只查目录、引导必要参数并通过 connectors 工具代填；用户也可直接在 App 填。没有的服务如实说暂时接不了。账号变更后在下一轮重建 MCP / 主查询。
  - id: q_prompt
    title: 系统提示词
    decided: 启动时填一次后固定，有利于缓存复用；不装总档或索引，模型在新会话和压缩后自己读总档。
    rec: 时间、在线设备由 UserPromptSubmit 附加。写入 Hook 做路径 / 简报校验，连接器配置只能走工具；这些校验不增加用户审批流程。
  - id: q_memory
    title: 记忆库形态
    decided: 保留 data/memory/<分类>/<主题>.md，profile/ 只有总档；health/latest.json 专供原生指标卡。只记来源明确、稳定且值得留存的事实；事实改变原地更新，不把被推翻的内容归档到 history/。
  - id: q_host
    title: 云主机
    decided: ECS。
  - id: q_model
    title: 模型
    decided: 由云端 AGENT_MODEL 配置，当前代码默认 Haiku 5.5；不在 App 设置中展示模型一行或提供切换。
  - id: q_proto
    title: 设备离线
    decided: 设备网关直接返回「设备离线」。
  - id: q_push
    title: App 不在前台时怎么联系你
    decided: 设备 WebSocket 仍在线时收到回复 / 任务事件可发系统通知，用户能关消息通知。设备断开或进程被杀时不承诺能送达，独立离线推送后放。
  - id: q_hw
    title: 以后的硬件
    decided: 后放。
  - id: q_spike
    title: 0.4 对齐依据
    decided: app-v3.md 和 connectors.md 优先；没提到的按 app-v2.md，并核对系统提示词、任务协议和实际云端代码。模拟场景不是部署或真实设备验收。
  - id: q_health
    title: 厂商健康数据能否接入？
    body: Health Connect 支持的指标已定，但荣耀等厂商健康 App 是否向它同步，需要真机验证；计步传感器兜底只有步数。
    rec: 用真机确认数据来源、可用指标和授权效果，再决定是否需要补充来源。没有数据时显示 -- / 暂不可读，不编造。
  - id: q_secret
    title: 密钥代填
    decided: 允许豆豆指引用户提供必要参数并代填，同时提醒聊天记录里会留下授权码；用户也可在 App 填表单。
  - id: q_heartbeat
    title: 心跳
    decided: 没有主动的模型心跳；设备和 App 的 WebSocket ping 保活保留，不触发推理。
  - id: q_browser
    title: Mac 内置浏览器
    decided: App 自带 WKWebView「豆豆浏览器」，持久登录且与 Safari / Chrome 隔离；读取层级无障碍树并给节点 ref，原生点击和输入，鼠标沿带随机抖动的曲线移动。computer_use 同样用曲线移动，不瞬移。
