questions:
  - id: q_tabs
    title: 五个栏目
    decided: 照搬 Muse：聊天、动态、点子、目标、资源库。站点归进资源库的构件；任务、定时、记忆、日记、权限收进头像控制台。
  - id: q_say
    title: 只用「说话」回复
    decided: 这样做：豆豆说的每句话都通过「说话」发出，可以带选项和卡片，一轮里能说好几次；工具调用和步骤不进聊天，头像显示它在忙，控制台的活动里查得到。正文一律不进聊天，长段总结也不会刷屏。为了不吞答案，一轮结束前如果写了正文却没用「说话」，云端提醒它一次：要说给你听的用「说话」发，只是旁白就直接结束。
  - id: q_inject
    title: 忙的时候插话
    decided: 直接进当前这一轮，豆豆在下一步之前就能看到；排队、撤回都去掉。动手前先做一个小实验，确认 SDK 能在两次工具调用之间收到新消息。
  - id: q_feed_when
    title: 动态多久来一批
    decided: 跟 Muse 走：白天每 30 分钟看一次（默认 7:00–23:00），只发上次之后的新消息，一次 0 到 2 条，没有就不发；间隔、时段可以改，也可以关掉，随时能手动刷新。动态和其他事一样用你选的模型；跑一周看账单再调间隔。
  - id: q_feed_src
    title: 动态从哪来
    decided: 照 Muse 的做法：动态说明里点名的渠道加网页搜索，你在云端浏览器里登录过的网站（如 X）也能看；每条打开原文读过再写，配原文的图。公众号、小红书这类封闭平台先不接。
  - id: q_mascot
    title: 头像形象
    decided: 跟 Muse 走 3D 毛绒风格，三个候选里用户选了「芽豆」：开心果绿的豆子，头顶两片叶子。五种状态各一张图加一段短循环视频，浅色深色各一份，打包进 App；原来的轮廓和配色选择撤掉。
  - id: q_skin
    title: 外观
    decided: 撤掉银蓝、纸墨、夜幕三套皮肤，只留黑白两套，蓝色只给链接；头像、连接应用和本机能力的图标保留各自的颜色，不然一片灰像都没打开；跟随系统深浅色，也可以固定一种。界面向 Muse 靠，不向 nanoMuse 靠。
  - id: q_cloudpc
    title: 云端浏览器
    decided: 先在现有云主机上做：虚拟显示器里开一个真 Chrome，同时只开一个窗口，画面传到 App，可以接管；不另开虚拟机，完整的云电脑以后再说。跑几天看内存，不够再升 4G，升级前先给报价。
  - id: q_kernel
    title: 内核要不要换
    decided: 不换，继续用 Claude Agent SDK。nanoMuse 自己就用了两个内核：手机上是 OpenMinis 改出来的自研循环，电脑上是 DeepSeek Harness，不是 OpenClaw 也不是 Hermes。两个内核做出同一个产品，说明体验来自产品层，不来自内核。
  - id: q_fork
    title: 要不要在 nanoMuse 上二次开发
    decided: 不 fork，也不参考它的内核。它的大脑跑在每台设备上（手机里装一个 Linux），我们要的是一个大脑住在自己的云主机上；代码是 GPL。界面可以参考，但优先贴 Muse。
  - id: q_ours
    title: 和 Muse 比，豆豆独有的
    decided: 产品形态都跟 Muse 走。豆豆独有的只有两样：一是连上手机和电脑后，能申请带个人信息的权限，如短信、通知、健康数据、Mac 上的文件和操作；二是贴着国内外生态的连接应用，现在有国内邮箱、Gmail、微信读书、Wind、GitHub。健康和日记收进控制台，不单独占栏目。
  - id: q_briefs
    title: 简报
    decided: 晨报、晚报、健康周报和「今日」栏目撤掉。想要的事实进动态；日程提醒和健康变化做成目标或定时安排。
  - id: q_dirs
    title: 内容怎么分区
    decided: 按 App 的栏目重组：动态、点子、目标、资源库（构件、影音）各一块；记忆、灵魂（名字、性格、日记）、健康收在控制台下；上传的文件、跟进清单单列。过程文件进草稿区，7 天清理；设置、账号、会话、定时和浏览器登录状态进系统区。旧简报移进备份，旧站点并进构件，旧日记和角色并进灵魂，迁移一次做完，不留兼容。
  - id: q_prompt
    title: 系统提示词
    decided: 一整份系统提示词 = 通用工作守则 + 豆豆业务提示词。守则取自 Claude Code 自带的那份，只删不改：和业务提示词冲突的句子删掉；业务提示词完整保留，开头一句写明分界。规格里两份都展示全文。
  - id: q_boundary
    title: 对外动作
    decided: 不设工具审批，也不弹授权页，靠提示词约定：意图明确就直接做；走到关键一步之前停下，用「说话」发选项卡问你，比如下单付款、发出消息或邮件、提交表单、删除、替你答应别人。你点了才继续，没回就等着。只在已支持且已授权的能力内执行。
  - id: q_heartbeat
    title: 主动性
    decided: 没有模型心跳。主动都靠定时安排：动态、目标跟进、点子。跟进清单保留，在目标跟进或聊到相关话题时带上；一条回复最多带一件没问的事。
  - id: q_conn
    title: 连接器与设备
    decided: 云端一服务一连接器，只连接已支持的服务；豆豆在第一次聊天和点子里主动推荐，也可以引导、代填。设备能力需要在本机授权，可能离线。
  - id: q_memory
    title: 记忆库
    decided: 总档概括全部主题，分类下按主题整理。只记来源明确、稳定、值得留存的事实；事实变了原地更新。健康数据由云端定时从手机同步，豆豆只读不改。
  - id: q_task
    title: 后台活动
    decided: 原来的任务改名为活动，收进头像控制台，照 Muse：豆豆每干一件事记一条，主聊天里干了活的轮次也算（忙时插的话归进正在跑的那一条），后台的事也算；纯聊天不算。标题是概括出的话题，下面一句写做了什么。进行中和已完成的都能看轨迹、接着聊，云端重启后也能续聊。
  - id: q_main
    title: 主会话即入口
    decided: 主聊天是一条连续的会话，不会每条消息另开一个。会对你说话的事都进主会话，包括目标跟进，回它时上下文是全的。不需要和你对话的事（动态、点子、夜间整理、补读、委派的重活）各开新会话，免得每半小时一次的动态把主会话的上下文和账单撑爆；委派的结果交回主会话，动态要聊就点「讨论」带进来。
  - id: q_session
    title: 上下文与压缩
    decided: 内置模型预计下一次输入约 272K 时使用 Claude Code 内置压缩，CLI 策略窗口为 305K（预留 20K 输出与 13K 摘要）；自定义模型约 100K，不附加自定义压缩要求。
  - id: q_model
    title: 模型
    decided: 内置 ZenMux 的 Haiku 5.5（默认）、Opus 5.5、GLM 5.3 Flash、GLM 5.3 FlashX、MiMo-V2.6-Pro，另可自己添加 Anthropic 协议的模型服务（Base URL + 模型 ID + 显示名）；App 内切换，两端同步，下一轮起全部使用新模型，推理强度 max。所有用到模型的事都用选中的这一个：聊天、活动标题和摘要、动态、点子、目标跟进、夜间整理、旁聊；只有语音转文字另用一个能听音频的模型。
  - id: q_permission
    title: 权限
    decided: 自动（默认）拦下危险操作，完全放行什么都不拦；在控制台切换，两种都不会向 App 弹请求。
  - id: q_proto
    title: 设备离线
    decided: 立即说明「设备离线」，读不到的内容不编造、不反复重试。
  - id: q_push
    title: App 不在前台时如何联系
    decided: 设备仍在线时，豆豆说话、目标跟进可发系统通知，用户可关闭。独立离线推送后放。
  - id: q_secret
    title: 账号代填
    decided: 允许豆豆引导并代填，提醒授权码会留在聊天记录中；用户也可直接在 App 表单填写。
  - id: q_host
    title: 云主机
    decided: 豆豆住在用户自己的云主机上，App 关闭后仍能工作；连的是用户自己的手机和电脑。对话、记忆和文件都不经过别人的服务器，模型请求只发给你选的模型服务（默认 ZenMux）。
  - id: q_health
    title: 厂商健康数据能否接入？
    body: Health Connect 支持的指标已定，但荣耀等厂商健康 App 是否向它同步，需要真机验证；计步传感器兜底只有步数。
    rec: 用真机确认数据来源、可用指标和授权效果，再决定是否需要补充来源。没有数据时显示 -- / 暂不可读，不编造。
