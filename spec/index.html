<script>
let YAML_TEXT = JSON.parse(document.getElementById("spec-yaml").textContent);
const PROMPT_SOURCES = JSON.parse(document.getElementById("prompt-sources").textContent);
let SPEC = jsyaml.load(YAML_TEXT, {schema: jsyaml.CORE_SCHEMA});
const initialErrors = validateSpec(SPEC, PROMPT_SOURCES);
if (initialErrors.length) throw new Error(initialErrors.join("\n"));

/* ============ 运行时 ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const NS = "http://www.w3.org/2000/svg";
const mk = (tag, attrs, parent) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); if (parent) parent.appendChild(el); return el; };
const stage = $("#stage");

const S = {clock: 0, playing: true, speed: 1, auto: true, queue: [], packets: [], fx: new Map(), flow: -1, flowStart: 0,
  running: false, idleAt: 0, stats: {...SPEC.initialState.stats}, mem: {...SPEC.initialState.memory},
  sel: null, trust: false, domEls: {}, chipEls: {}, edgeEls: {}, geom: {}, svg: null, pk: null, dirtyStats: true};
const store = {
  get() { try { return JSON.parse(localStorage.getItem("pa_q") || "{}"); } catch (e) { return {}; } },
  set(v) { try { localStorage.setItem("pa_q", JSON.stringify(v)); } catch (e) {} }
};
let qState = store.get();

const dom = id => SPEC.domains.find(d => d.id === id);
const chipOwner = id => SPEC.domains.find(d => d.chips.some(c => c.id === id));
const edgeOf = id => SPEC.edges.find(e => e.id === id);
const linkOf = id => (SPEC.links || []).find(l => l.id === id);
const wireOf = id => edgeOf(id) || linkOf(id);
const chipOf = id => { const o = chipOwner(id); return o && o.chips.find(c => c.id === id); };
const nameOf = id => (dom(id) || chipOf(id) || {name: id}).name;
/* 元素相对舞台的矩形（未缩放坐标） */
function relRect(el) {
  let l = 0, t = 0, e = el;
  while (e && e !== stage) { l += e.offsetLeft; t += e.offsetTop; e = e.offsetParent; }
  return {l, t, r: l + el.offsetWidth, b: t + el.offsetHeight};
}

function buildStage() {
  stage.innerHTML = ""; S.domEls = {}; S.chipEls = {}; S.edgeEls = {}; S.geom = {};
  stage.classList.toggle("trust", S.trust);
  for (const d of SPEC.domains) {
    const z = SPEC.zones[d.zone], el = document.createElement("div");
    el.className = `domain ${d.id}${d.compact ? " compact" : ""}${d.chips.length ? "" : " single"}`;
    el.dataset.id = d.id; el.tabIndex = 0; el.setAttribute("role", "button"); el.setAttribute("aria-label", d.name);
    el.style.setProperty("--zc", z.color);
    const [x, y, w, h] = d.rect;
    Object.assign(el.style, {left: x + "%", top: y + "%", width: w + "%", height: h + "%"});
    el.innerHTML = `<div class="dhead"><span class="ico">${esc(d.icon)}</span><div class="dt"><div class="dname">${esc(d.name)}</div></div></div>`;
    if (d.chips.length) {
      const cw = document.createElement("div"); cw.className = "chips" + (d.free ? " free" : ""); el.appendChild(cw);
      for (const c of d.chips) {
        const ce = document.createElement("div"); ce.className = "chip"; ce.dataset.id = c.id;
        ce.tabIndex = 0; ce.setAttribute("role", "button"); ce.setAttribute("aria-label", c.name);
        ce.innerHTML = `<span class="ci">${esc(c.icon)}</span><div><b>${esc(c.name)}</b></div>`;
        if (d.free) { const [x, y, w, h] = c.at; Object.assign(ce.style, {left:x + "%",top:y + "%",width:w + "%",height:h + "%"}); }
        ce.onclick = e => { e.stopPropagation(); select("chip", c.id); };
        ce.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); ce.click(); } };
        cw.appendChild(ce); S.chipEls[c.id] = ce;
      }
    }
    el.onclick = () => select("domain", d.id);
    el.onkeydown = e => { if (e.target === el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); el.click(); } };
    stage.appendChild(el); S.domEls[d.id] = el;
  }
  S.svg = mk("svg", {id:"wires", "aria-label":"关系连线"}, stage);
  const defs = mk("defs", {}, S.svg);
  for (const [k, v] of Object.entries(SPEC.kinds)) {
    const m = mk("marker", {id:"ar_"+k,viewBox:"0 0 10 10",refX:9,refY:5,markerWidth:7,markerHeight:7,orient:"auto"}, defs);
    mk("path", {d:"M0 0L10 5L0 10z",fill:v.color}, m);
  }
  for (const e of [...SPEC.edges, ...SPEC.links]) {
    const isLink = !!linkOf(e.id), g = mk("g", {class:"edge"}, S.svg); g.dataset.id = e.id;
    const toThird = dom(e.to)?.zone === "third";
    const wire = mk("path", {class: (isLink ? "link" : "wire") + (toThird ? " egress" : ""),stroke:SPEC.kinds[e.kind].color,"marker-end":`url(#ar_${e.kind})`}, g);
    const hit = mk("path", {class:"hit",role:"button",tabindex:0,"aria-label":`${nameOf(e.from)} → ${nameOf(e.to)}：${e.label}`}, g);
    hit.onclick = ev => { ev.stopPropagation(); select("edge", e.id); };
    hit.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select("edge", e.id); } };
    S.edgeEls[e.id] = {g,wire,hit,link:isLink};
  }
  S.pk = mk("g", {}, S.svg); renderMem(); fit(); layoutWires();
}

/* The diagram fills the available width; narrow screens scroll inside stagewrap. */
function fit() {
  const wrap = $("#stagewrap"), box = $("#stagebox"), {width,height,padding} = SPEC.layout;
  const k = Math.max(0.5, Math.floor((wrap.clientWidth - 2 * padding) / width * 1000) / 1000);
  Object.assign(stage.style, {width:width+"px",height:height+"px",left:padding+"px",top:padding+"px",transform:`scale(${k})`});
  box.style.width = Math.ceil(width * k + 2 * padding) + "px";
  box.style.height = Math.ceil(height * k + 2 * padding) + "px";
  const row = getComputedStyle($("main")).flexDirection === "row";
  $("#panel").style.height = row ? Math.max(560, Math.min(box.offsetHeight, innerHeight - 130)) + "px" : "";
}

function layoutWires() {
  S.svg.setAttribute("width", stage.offsetWidth); S.svg.setAttribute("height", stage.offsetHeight);
  const R = {};
  for (const id in S.domEls) { const e = S.domEls[id]; R[id] = {l: e.offsetLeft, t: e.offsetTop, r: e.offsetLeft + e.offsetWidth, b: e.offsetTop + e.offsetHeight}; }
  for (const e of SPEC.edges) {
    const A = R[e.from], B = R[e.to], el = S.edgeEls[e.id]; if (!A || !B || !el) continue;
    const gx = Math.max(B.l - A.r, A.l - B.r), gy = Math.max(B.t - A.b, A.t - B.b);
    let x1, y1, x2, y2, horiz = gx >= gy;
    if (horiz) {
      const lo = Math.max(A.t, B.t) + 14, hi = Math.min(A.b, B.b) - 14;
      const y = (lo < hi ? (lo + hi) / 2 : (A.t + A.b + B.t + B.b) / 4) + (e.off || 0);
      y1 = y2 = y; if (B.l > A.r) { x1 = A.r; x2 = B.l - 2; } else { x1 = A.l; x2 = B.r + 2; }
    } else {
      const lo = Math.max(A.l, B.l) + 14, hi = Math.min(A.r, B.r) - 14;
      const x = (lo < hi ? (lo + hi) / 2 : (A.l + A.r + B.l + B.r) / 4) + (e.off || 0);
      x1 = x2 = x; if (B.t > A.b) { y1 = A.b; y2 = B.t - 2; } else { y1 = A.t; y2 = B.b + 2; }
    }
    const d = `M${x1} ${y1}L${x2} ${y2}`;
    el.wire.setAttribute("d", d); el.hit.setAttribute("d", d);
    S.geom[e.id] = {path: el.wire, len: el.wire.getTotalLength(), horiz};
  }
  /* 域内连线：两张卡片中心连线，按 off 平移后裁到卡片边框 */
  for (const e of SPEC.links || []) {
    const ea = S.chipEls[e.from], eb = S.chipEls[e.to], el = S.edgeEls[e.id]; if (!ea || !eb || !el) continue;
    const A = relRect(ea), B = relRect(eb);
    let ax = A.l + (A.r - A.l) * (e.fx ?? 0.5), ay = (A.t + A.b) / 2, bx = B.l + (B.r - B.l) * (e.tx ?? 0.5), by = (B.t + B.b) / 2;
    const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len, o = e.off || 0;
    ax += nx * o; ay += ny * o; bx += nx * o; by += ny * o;
    const exit = (R, x, y, ux, uy) => {
      const tx = ux > 0 ? (R.r + 2 - x) / ux : ux < 0 ? (R.l - 2 - x) / ux : Infinity;
      const ty = uy > 0 ? (R.b + 2 - y) / uy : uy < 0 ? (R.t - 2 - y) / uy : Infinity;
      const t = Math.min(tx, ty); return [x + ux * t, y + uy * t];
    };
    const [x1, y1] = exit(A, ax, ay, dx / len, dy / len), [x2, y2] = exit(B, bx, by, -dx / len, -dy / len);
    const d = `M${x1} ${y1}L${x2} ${y2}`;
    el.wire.setAttribute("d", d); el.hit.setAttribute("d", d);
    S.geom[e.id] = {path: el.wire, len: el.wire.getTotalLength(), horiz: Math.abs(dx) >= Math.abs(dy)};
  }
}

function renderMem() {
  const m = $("#mem"); if (!m) return;
  m.innerHTML = Object.entries(S.mem).map(([k,v]) => `<span data-k="${esc(k)}">${esc(k)} ${esc(v)}</span>`).join("");
}
function flashMem(k) { const el = [...$("#mem").children].find(el => el.dataset.k === k); if (!el) return; el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 900); }

/* ---- 引擎 ---- */
function enqueue(at, step) { S.queue.push({at, step}); S.queue.sort((a, b) => a.at - b.at); }
function setFx(id, kind, dur) { S.fx.set(id, {until: S.clock + dur, kind}); }
function addLog(text, kind) {
  const l = $("#logLines"), d = document.createElement("div");
  d.className = "lg" + (kind ? " " + kind : "");
  d.innerHTML = `<time>+${((S.clock - S.flowStart) / 1000).toFixed(1)}s</time><span>${esc(text)}</span>`;
  l.appendChild(d); while (l.children.length > 300) l.removeChild(l.firstChild); $("#log").scrollTop = $("#log").scrollHeight;
}
/* back = 沿同一条线反向走（工具调用的返回值），不用为每次返回再画一根线 */
function spawnPacket(edgeId, label, back) {
  const e = wireOf(edgeId), g = S.geom[edgeId]; if (!e || !g) return;
  const col = SPEC.kinds[e.kind].color, isLink = !edgeOf(edgeId);
  const grp = mk("g", {class: "pkt"}, S.pk);
  mk("circle", {r: isLink ? 5.5 : 7, fill: back ? "#fff" : col, stroke: back ? col : "#fff", "stroke-width": 2.5}, grp);
  S.packets.push({edge: edgeId, t0: S.clock, dur: isLink ? 850 : 1100, g: grp, back: !!back, target: back ? e.from : e.to});
  const to = dom(e.to);
  if (!isLink && !back && to && to.zone === "third") { S.stats.egress++; S.dirtyStats = true; }
}
function runStep(s) {
  if (s.on) for (const id of s.on) setFx(id, "ok", s.dur || 1500);
  if (s.warn) for (const id of s.warn) setFx(id, "warn", s.dur || 2500);
  if (s.bad) for (const id of s.bad) setFx(id, "bad", s.dur || 3000);
  if (s.pkt) spawnPacket(s.pkt, s.label, s.back);
  if (s.mem) for (const k in s.mem) { S.mem[k] = (S.mem[k] || 0) + s.mem[k]; S.stats.mem += s.mem[k]; S.dirtyStats = true; renderMem(); flashMem(k); }
  if (s.stat) { for (const k in s.stat) S.stats[k] = (S.stats[k] || 0) + s.stat[k]; S.dirtyStats = true; }
  const pb = $("#pbubble"); if (s.phone && pb) pb.textContent = s.phone;
  if (s.log) addLog(s.log, s.logKind);
}
function startFlow(i) {
  S.flow = (i + SPEC.flows.length) % SPEC.flows.length;
  const f = SPEC.flows[S.flow];
  S.queue = [];
  for (const p of S.packets) p.g.remove(); S.packets = []; S.fx.clear();
  S.flowStart = S.clock; S.running = true;
  for (const s of f.steps) enqueue(S.clock + s.t, s);
  addLog(`▶ ${f.icon} ${f.name}`, "sys");
  markFlow();
}
function ease(k) { return k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; }

function tick() {
  while (S.queue.length && S.queue[0].at <= S.clock) runStep(S.queue.shift().step);
  if (S.running && !S.queue.length && !S.packets.length && ![...S.fx.values()].some(f => f.until > S.clock)) {
    S.running = false; S.idleAt = S.clock;
  }
  if (!S.running && S.auto && S.clock - S.idleAt > 1800) startFlow(S.flow + 1);
}

function render() {
  const hot = new Set();
  for (let i = S.packets.length - 1; i >= 0; i--) {
    const p = S.packets[i], g = S.geom[p.edge], k = (S.clock - p.t0) / p.dur;
    if (!g || k >= 1) {
      p.g.remove(); S.packets.splice(i, 1);
      const el = S.domEls[p.target];
      if (el) { el.classList.add("pulse"); setTimeout(() => el.classList.remove("pulse"), 600); }
      else if (S.chipEls[p.target] && !S.fx.has(p.target)) setFx(p.target, "ok", 500);
      continue;
    }
    const pt = g.path.getPointAtLength(g.len * (p.back ? 1 - ease(k) : ease(k)));
    p.g.setAttribute("transform", `translate(${pt.x},${pt.y})`); hot.add(p.edge);
  }
  for (const id in S.edgeEls) S.edgeEls[id].wire.classList.toggle("hot", hot.has(id));
  for (const [id, f] of S.fx) {
    if (f.until <= S.clock) S.fx.delete(id);
  }
  for (const [id, el] of Object.entries({...S.domEls, ...S.chipEls})) {
    const f = S.fx.get(id);
    el.classList.toggle("on", !!f && f.kind === "ok");
    el.classList.toggle("warn", !!f && f.kind === "warn");
    el.classList.toggle("bad", !!f && f.kind === "bad");
  }
  if (S.dirtyStats) {
    S.dirtyStats = false;
    $("#stats").innerHTML = Object.entries(SPEC.ui.stats).map(([key,label]) => `<div><b>${S.stats[key]}</b> ${esc(label)}</div>`).join("");
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(now - last, 100); last = now;
  try {
    if (S.playing) { S.clock += dt * S.speed; tick(); }
    render();
  } catch (err) {
    console.error(err);
    if (S.lastErr !== err.message) { S.lastErr = err.message; addLog("⚠ 运行出错：" + err.message, "bad"); }
  }
  requestAnimationFrame(frame);
}

/* ---- 面板 ---- */
function renderFlowBar() {
  $("#flows").innerHTML = `<span class="lab">场景：</span>` + SPEC.flows.map((f, i) => `<button class="btn" data-i="${i}">${esc(f.icon)} ${esc(f.name)}</button>`).join("");
  document.querySelectorAll("#flows [data-i]").forEach(b => b.onclick = () => { startFlow(+b.dataset.i); showTab("log"); setPanel(true); });
}
function markFlow() {
  document.querySelectorAll("#flows [data-i]").forEach(b => b.classList.toggle("on", +b.dataset.i === S.flow));
}
function showTab(t) {
  document.querySelectorAll(".tabs .btn").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  document.querySelectorAll(".tabc").forEach(c => c.classList.toggle("show", c.id === t));
}
function li(arr, cls) { return `<ul>${(arr || []).map(x => `<li class="${cls || ""}">${esc(x)}</li>`).join("")}</ul>`; }
/* 极简 Markdown：标题 / 列表 / 表格 / 代码块 / 行内代码 / 粗体 */
function md(src) {
  const inl = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const out = []; let list = false, table = false, code = null;
  const close = () => { if (list) { out.push("</ul>"); list = false; } if (table) { out.push("</table>"); table = false; } };
  for (const line of String(src).split("\n")) {
    if (code !== null) { if (line.startsWith("```")) { out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); code = null; } else code.push(line); continue; }
    if (line.startsWith("```")) { close(); code = []; continue; }
    if (/^#{1,2} /.test(line)) { close(); out.push(line.startsWith("## ") ? `<h5>${inl(line.slice(3))}</h5>` : `<h4>${inl(line.slice(2))}</h4>`); continue; }
    if (/^\s*- /.test(line)) { if (table) close(); if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inl(line.replace(/^\s*- /, ""))}</li>`); continue; }
    if (line.startsWith("|")) { if (list) close(); if (/^\|[\s:|-]+\|$/.test(line)) continue; if (!table) { out.push("<table>"); table = true; } out.push("<tr>" + line.slice(1, -1).split("|").map(c => `<td>${inl(c.trim())}</td>`).join("") + "</tr>"); continue; }
    close(); if (line.trim()) out.push(`<p>${inl(line)}</p>`);
  }
  if (code !== null) out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
  close(); return `<div class="doc">${out.join("")}</div>`;
}
function qCard(q) {
  if (q.decided) return `<div class="q done"><div class="qt">✅ ${esc(q.title)}</div><div class="qrec">已定：${esc(q.decided)}</div>${q.rec ? `<div class="qb">${esc(q.rec)}</div>` : ""}</div>`;
  const st = qState[q.id] || "待定";
  return `<div class="q ${st === "采纳建议" ? "adopt" : st === "否决" ? "reject" : ""}"><div class="qt">${esc(q.title)}</div><div class="qb">${esc(q.body)}</div><div class="qrec">我的建议：${esc(q.rec)}</div><div class="qs">${["待定", "采纳建议", "否决"].map(s => `<button class="btn${st === s ? " on" : ""}" data-q="${q.id}" data-s="${s}">${s}</button>`).join("")}</div></div>`;
}
function bindQ(root) {
  root.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
    qState[b.dataset.q] = b.dataset.s; store.set(qState); renderQs(); renderDetail();
  });
}
function renderQs() {
  const open = SPEC.questions.filter(q => !q.decided), done = SPEC.questions.filter(q => q.decided);

  bindQ($("#qs"));

}
function overview() { return md(SPEC.ui.overview); }
function promptDetails(id) {

function connectorDetails() {

function renderDetail() {
  const p = $("#detail"), s = S.sel; if (!s) { p.innerHTML = overview(); return; }
  if (s.type === "domain") {
    const d = dom(s.id), z = SPEC.zones[d.zone];

  } else if (s.type === "chip") {

  } else {
    const e = wireOf(s.id), k = SPEC.kinds[e.kind];
    p.innerHTML = `<h3>${esc(e.label)}</h3><span class="tag" style="background:color-mix(in srgb,${k.color} 22%,white)">${esc(k.label)}</span>${linkOf(s.id) ? '<span class="tag">域内</span>' : ""}<div style="margin-top:6px">${esc(nameOf(e.from))} → ${esc(nameOf(e.to))}</div>${e.desc ? `<h5>载荷</h5><div>${esc(e.desc)}</div>` : ""}${e.trigger ? `<h5>触发</h5><div>${esc(e.trigger)}</div>` : ""}${e.trust ? `<h5>边界说明</h5><div>${esc(e.trust)}</div>` : ""}${e.doc ? md(e.doc) : ""}`;
  }
  bindQ(p); p.querySelectorAll("[data-node]").forEach(b => b.onclick = () => select("chip", b.dataset.node));

$("#panelClose").onclick = () => setPanel(false);
$("#bPlay").onclick = () => { S.playing = !S.playing; $("#bPlay").textContent = S.playing ? "⏸ 暂停" : "▶ 播放"; };
$("#sSpeed").onchange = e => S.speed = +e.target.value;
$("#bAuto").onclick = () => { S.auto = !S.auto; $("#bAuto").classList.toggle("on", S.auto); };
$("#bView").onclick = () => { S.trust = !S.trust; stage.classList.toggle("trust", S.trust); $("#bView").textContent = "视图：" + (S.trust ? "边界" : "架构"); $("#bView").classList.toggle("on", S.trust); };
document.querySelectorAll(".tabs .btn").forEach(b => b.onclick = () => showTab(b.dataset.tab));
const specMsg = (text, ok) => { const m = $("#specerr"); m.textContent = text; m.classList.toggle("ok", !!ok); };
$("#bSpec").onclick = () => { $("#specta").value = YAML_TEXT; specMsg(""); $("#specdlg").showModal(); };
$("#specClose").onclick = () => $("#specdlg").close();
$("#specCopy").onclick = async () => {
  const ta = $("#specta"); let ok = false;
  try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) {}
  if (!ok) { ta.select(); try { ok = document.execCommand("copy"); } catch (e) {} }
  specMsg(ok ? "已复制" : "浏览器不让自动复制，已全选，按 ⌘C / Ctrl+C", ok);
};
/* spec-validation:start */
function sourceKey(source) { return JSON.stringify(Object.fromEntries(Object.keys(source).sort().map(key => [key,source[key]]))); }
function validateSpec(sp, availableSources) {
  const errors = [], obj = v => !!v && typeof v === "object" && !Array.isArray(v), arr = Array.isArray;
  const text = v => typeof v === "string" && !!v.trim(), number = v => typeof v === "number" && Number.isFinite(v);
  if (!obj(sp)) return ["顶层必须是 YAML mapping"];
  try { JSON.stringify(sp); } catch { return ["规格不能包含循环引用"]; }
  for (const key of ["meta","layout","initialState","ui","zones","kinds","connectors"]) if (!obj(sp[key])) errors.push(`${key} 必须是 mapping`);
  for (const key of ["domains","edges","links","flows","questions","prompts"]) if (!arr(sp[key])) errors.push(`${key} 必须是数组`);
  if (errors.length) return errors;
  if (!text(sp.meta.title) || !text(sp.meta.subtitle) || !text(sp.ui.overview)) errors.push("meta.title / meta.subtitle / ui.overview 必须是文字");
  if (![sp.layout.width,sp.layout.height,sp.layout.padding].every(number) || sp.layout.width <= 0 || sp.layout.height <= 0 || sp.layout.padding < 0) errors.push("layout 需要正数 width / height 和非负 padding");
  for (const key of ["memory","stats"]) if (!obj(sp.initialState[key]) || Object.values(sp.initialState[key]).some(v => !number(v))) errors.push(`initialState.${key} 需要数字 mapping`);
  if (!text(sp.initialState.phone) || !obj(sp.ui.stats) || Object.keys(sp.ui.stats).some(key => !number(sp.initialState.stats?.[key]))) errors.push("初始场景消息或统计标签无效");
  for (const key of ["zones","kinds"]) {
    if (!Object.keys(sp[key]).length) errors.push(`${key} 不能为空`);
    for (const [id,v] of Object.entries(sp[key])) if (!obj(v) || !text(v.label) || !/^#[\da-f]{6}$/i.test(v.color)) errors.push(`${key}.${id} 需要 label 和六位十六进制 color`);
  }
  const ids = (items, kind) => {
    const set = new Set();
    for (const x of items) {
      if (!obj(x) || !/^[a-z][a-z0-9_-]*$/i.test(x.id || "")) errors.push(`${kind} 缺少有效 id`);
      else if (set.has(x.id)) errors.push(`${kind} id 重复：${x.id}`);
      else set.add(x.id);
    }
    return set;
  };
  const domainIds = ids(sp.domains,"domain"), edgeIds = ids(sp.edges,"edge"), linkIds = ids(sp.links,"link"), questionIds = ids(sp.questions,"question"), promptIds = ids(sp.prompts,"prompt"), chipIds = new Set();
  ids(sp.flows,"flow");
  if (!sp.domains.length || !sp.flows.length) errors.push("domains / flows 不能为空");
  const rect = v => arr(v) && v.length === 4 && v.every(number) && v[0] >= 0 && v[1] >= 0 && v[2] > 0 && v[3] > 0 && v[0]+v[2] <= 100 && v[1]+v[3] <= 100;
  for (const d of sp.domains) {
    if (!obj(d)) continue;
    if (!text(d.name) || !text(d.role) || !sp.zones[d.zone] || !rect(d.rect)) errors.push(`domain ${d.id} 的名称 / role / zone / rect 无效`);
    for (const key of ["can","cannot","holds","qs"]) if (d[key] !== undefined && !arr(d[key])) errors.push(`domain ${d.id}.${key} 必须是数组`);
    for (const id of arr(d.qs) ? d.qs : []) if (!questionIds.has(id)) errors.push(`domain ${d.id} 的问题 ${id} 不存在`);
    if (!arr(d.chips)) { errors.push(`domain ${d.id}.chips 必须是数组`); continue; }
    for (const c of d.chips) {
      if (!obj(c) || !/^[a-z][a-z0-9_-]*$/i.test(c.id || "") || !text(c.name)) { errors.push(`domain ${d.id} 的节点缺少 id / name`); continue; }
      if (chipIds.has(c.id) || domainIds.has(c.id)) errors.push(`节点 id 重复：${c.id}`); chipIds.add(c.id);
      if (d.free && !rect(c.at)) errors.push(`自由布局节点 ${c.id} 需要 at: [x,y,w,h]`);
      if (c.q && !questionIds.has(c.q)) errors.push(`节点 ${c.id} 的问题 ${c.q} 不存在`);
      if (c.prompt && !promptIds.has(c.prompt)) errors.push(`节点 ${c.id} 的提示词 ${c.prompt} 不存在`);
      if (c.pills !== undefined && !arr(c.pills)) errors.push(`节点 ${c.id}.pills 必须是数组`);
    }
  }
  for (const [items,set,kind] of [[sp.edges,domainIds,"edge"],[sp.links,chipIds,"link"]]) for (const e of items) {
    if (!obj(e)) continue;
    if (!set.has(e.from) || !set.has(e.to) || !sp.kinds[e.kind] || !text(e.label)) errors.push(`${kind} ${e.id} 的 from / to / kind / label 无效`);
    if (kind === "link" && edgeIds.has(e.id)) errors.push(`连线 id 重复：${e.id}`);
  }
  for (const flow of sp.flows) {
    if (!obj(flow)) continue;
    if (!text(flow.name) || !arr(flow.steps)) { errors.push(`flow ${flow.id} 需要 name / steps`); continue; }
    for (const [i,s] of flow.steps.entries()) {
      const where = `flow ${flow.id} 第 ${i+1} 步`;
      if (!obj(s) || !number(s.t) || s.t < 0) { errors.push(`${where} 需要非负数字 t`); continue; }
      if (s.pkt && !edgeIds.has(s.pkt) && !linkIds.has(s.pkt)) errors.push(`${where} 的 pkt ${s.pkt} 不存在`);
      for (const key of ["on","warn","bad"]) if (s[key] !== undefined) {
        if (!arr(s[key])) errors.push(`${where}.${key} 必须是数组`);
        else for (const id of s[key]) if (!domainIds.has(id) && !chipIds.has(id)) errors.push(`${where} 的节点 ${id} 不存在`);
      }
      for (const [key,initial] of [["mem",sp.initialState.memory],["stat",sp.initialState.stats]]) if (s[key] !== undefined) {
        if (!obj(s[key]) || Object.entries(s[key]).some(([id,v]) => !number(v) || !Object.hasOwn(initial || {},id))) errors.push(`${where}.${key} 必须引用初始状态中的数字项`);
      }
    }
  }
  for (const q of sp.questions) if (obj(q) && (!text(q.title) || !(text(q.decided) || text(q.body)))) errors.push(`question ${q.id} 需要标题和正文 / 决定`);
  if (sp.connectors.source !== "../cloud/connectors/index.mjs" || !arr(sp.connectors.items)) errors.push("connectors 需要目录来源和 items 数组");
  else {
    ids(sp.connectors.items,"connector");
    for (const c of sp.connectors.items) {
      if (!obj(c) || !text(c.name) || !text(c.description) || !arr(c.fields)) { errors.push("连接器需要名称、说明和字段数组"); continue; }
      for (const f of c.fields) if (!obj(f) || !text(f.key) || !text(f.label) || typeof f.required !== "boolean") errors.push(`连接器 ${c.id} 的字段无效`);
    }
  }
  for (const p of sp.prompts) {
    if (!obj(p) || !text(p.name) || !text(p.when) || !arr(p.sources) || !p.sources.length) { errors.push(`prompt ${p?.id} 需要名称、使用时机和来源`); continue; }
    for (const source of p.sources) {
      if (!obj(source) || !text(source.file) || !["file","json","code"].includes(source.kind)) { errors.push(`prompt ${p.id} 的来源无效`); continue; }
      if (source.kind === "code" && !text(source.start)) errors.push(`prompt ${p.id} 的代码来源需要 start 锚点`);
      if (source.kind === "json" && (!text(source.item) || !text(source.field))) errors.push(`prompt ${p.id} 的 JSON 来源需要 item / field`);
      if (availableSources && !Object.hasOwn(availableSources,sourceKey(source))) errors.push(`prompt ${p.id} 的来源尚未内联；保存 YAML 后运行 node spec/build.mjs`);
    }
  }
  return errors;
}
/* spec-validation:end */

$("#specApply").onclick = () => {
  let next;
  try { next = jsyaml.load($("#specta").value, {schema:jsyaml.CORE_SCHEMA}); } catch (err) { specMsg("YAML 解析失败：" + err.message); return; }
  const errs = validateSpec(next, PROMPT_SOURCES);
  if (errs.length) { specMsg(errs.slice(0, 8).join("\n") + (errs.length > 8 ? `\n…还有 ${errs.length - 8} 条` : "")); return; }
  const prev = SPEC, prevYAML = YAML_TEXT;
  try { SPEC = next; YAML_TEXT = $("#specta").value; resetRun(); boot(); }
  catch (err) { SPEC = prev; YAML_TEXT = prevYAML; resetRun(); boot(); specMsg("应用失败，已恢复上一版：" + err.message); return; }
  addLog("✔ 已应用新的 Spec，从第一个场景重新开始", "sys");
  $("#specdlg").close();
};

function resetRun() {
  S.sel = null; S.queue = []; S.packets = []; S.fx.clear(); S.running = false;
  S.mem = {...SPEC.initialState.memory}; S.stats = {...SPEC.initialState.stats}; S.dirtyStats = true;
  $("#logLines").innerHTML = ""; $("#pbubble").textContent = SPEC.initialState.phone;
}
let wrapW = 0;
new ResizeObserver(() => { const w = $("#stagewrap").clientWidth; if (w !== wrapW) { wrapW = w; fit(); } }).observe($("#stagewrap"));
addEventListener("resize", fit);

function boot(first) {
  $("h1").innerHTML = `${esc(SPEC.meta.title)}<small>${esc(SPEC.meta.subtitle)}</small>`;
  document.title = SPEC.meta.title;
  $("#pbubble").textContent = SPEC.initialState.phone;
  buildStage(); renderQs(); renderDetail(); renderFlowBar(); fit();
  requestAnimationFrame(() => {
    try {
      fit(); layoutWires();
      const q = new URLSearchParams(first ? location.hash.slice(1) : "");
      startFlow(parseInt(q.get("flow"), 10) || 0);
      if (q.get("trust") && !S.trust) $("#bView").click();
      for (let t = 0, ff = +q.get("ff") || 0; t < ff; t += 50) { S.clock += 50; tick(); }
      if (q.get("sel")) select(...q.get("sel").split(":"));
    } catch (err) { console.error(err); addLog("⚠ 启动出错：" + err.message, "bad"); }
  });
}
boot(true);
requestAnimationFrame(frame);
</script>
</body>
</html>
