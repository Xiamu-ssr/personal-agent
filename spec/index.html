<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Personal Agent · 架构模拟器</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink:#1d2433;--mut:#6b7488;--glass:rgba(255,255,255,.62);--line:rgba(30,40,70,.12)}
*{box-sizing:border-box}
body{margin:0;font:13px/1.45 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;color:var(--ink);background:linear-gradient(180deg,#c9e3fb 0%,#e7ecfb 45%,#fbe6d6 100%) fixed;min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px 6px;flex-wrap:wrap}
h1{font-size:17px;margin:0}
h1 small{font-weight:400;color:var(--mut);margin-left:8px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.72);border-radius:999px;padding:5px 12px;cursor:pointer;font:inherit;color:inherit;white-space:nowrap}
.btn:hover{background:#fff}
.btn.on{background:#1d2433;color:#fff;border-color:#1d2433}
select.btn{padding:5px 8px}
#flows{display:flex;gap:6px;flex-wrap:wrap;padding:4px 20px 10px;align-items:center}
#flows .lab{color:var(--mut);margin-right:2px}
main{display:flex;gap:14px;padding:0 20px 20px;align-items:flex-start}
html{scrollbar-gutter:stable}
#stagewrap{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden}
#stagebox{position:relative;overflow:hidden}
#stage{position:absolute;left:16px;top:16px;width:1080px;height:780px;transform-origin:0 0}
.domain{position:absolute;border-radius:22px;background:var(--glass);border:2px solid color-mix(in srgb,var(--zc) 55%,transparent);backdrop-filter:blur(8px);padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:box-shadow .3s,background .3s}
.domain.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--zc) 50%,transparent)}
.domain.pulse{box-shadow:0 0 0 4px color-mix(in srgb,var(--zc) 40%,transparent),0 0 26px color-mix(in srgb,var(--zc) 55%,transparent)}
.trust .domain{background:color-mix(in srgb,var(--zc) 30%,white);border-width:3px}
.trust .wire.egress{stroke:#e11d48!important;opacity:1}
.trust .zb{background:var(--zc);color:#fff}
.dhead{display:flex;gap:10px;align-items:flex-start}
.ico{font-size:24px;line-height:1}
.dt{flex:1;min-width:0}
.dname{font-weight:700;font-size:14px}
.drole{color:var(--mut);font-size:11.5px;line-height:1.35;margin-top:2px}
.zb{font-size:10.5px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--zc) 18%,white);color:color-mix(in srgb,var(--zc) 75%,black);white-space:nowrap}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.dev .chips{grid-template-columns:1fr}
.app .chips{grid-template-columns:1fr 1fr}
.conn .chips{grid-template-columns:repeat(2,minmax(0,1fr))}
.model .chips{grid-template-columns:minmax(0,1fr)}
.domain.compact .chip .ci{display:none}
.domain.compact .chip{min-width:0}
.domain.compact .chip small,.domain.compact .chip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.domain.compact .dname{white-space:nowrap}
.domain.compact{flex-direction:row;align-items:center;gap:12px;padding:8px 12px}
.domain.compact .dhead{flex:0 0 auto;align-items:center}
.domain.compact .drole{display:none}
.domain.compact .zb{display:none}
.domain.compact .chips{flex:1}
.domain.compact .chip small{white-space:nowrap}
.chip{display:flex;gap:8px;align-items:center;padding:6px 9px;border-radius:12px;background:rgba(255,255,255,.78);border:1px solid var(--line);cursor:pointer;position:relative;transition:all .25s}
.chip .ci{font-size:16px}
.chip b{display:block;font-size:12.5px}
.chip small{display:block;color:var(--mut);font-size:10.5px;line-height:1.3}
.chip.on{background:#fff;box-shadow:0 0 0 2px var(--zc),0 6px 18px color-mix(in srgb,var(--zc) 45%,transparent);transform:translateY(-1px)}
.chip.bad{background:#ffe4e4;box-shadow:0 0 0 2px #ef4444}
.chip.warn{background:#fff3d6;box-shadow:0 0 0 2px #f59e0b}
.chip.sel{outline:2px dashed #1d2433;outline-offset:1px}
.chips.free{display:block;position:relative;flex:1}
.chips.free .chip{position:absolute;align-items:flex-start;padding:6px 8px}
.chip.box{flex-direction:column;align-items:stretch;gap:4px}
.chip.box .mem{margin-top:0}
.chip.box .mem{gap:3px}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pills span{font-size:10px;padding:1px 7px;border-radius:6px;background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3}
.chip.box .memt{margin-top:2px}
.mem span[data-k="profile"]{font-weight:700;border-color:#3b82f6}
.chip.box .mem span{font-size:9px;padding:0 5px}
.domain.compact .chip>div{min-width:0}
.link{fill:none;stroke-width:1.6;opacity:.45}
.link.hot{opacity:1;stroke-width:2.6}
.lbl.small text{font-size:9px}
.doc{font-size:12px}
.doc h4{margin:10px 0 4px;font-size:13px}.doc h5{margin:8px 0 3px}
.doc pre{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:8px;font:10.5px/1.4 ui-monospace,Menlo,monospace;overflow:auto;white-space:pre}
.doc code{background:#eef2ff;border-radius:4px;padding:0 4px;font:11px ui-monospace,Menlo,monospace}
.doc pre code{background:none;padding:0;color:inherit}
.doc table{border-collapse:collapse;margin:4px 0;font-size:11.5px}.doc td{border:1px solid var(--line);padding:2px 6px}
.doc p{margin:4px 0}
.q.done{border-color:#10b981;background:#f0fdf4}
.qd{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:#f59e0b;border:2px solid #fff}
.qd.big{position:static;display:inline-block;margin-left:6px}
.phone{flex:1;min-height:110px;border-radius:16px;background:linear-gradient(180deg,#bfdcf7,#f8e2d2);border:1px solid var(--line);padding:8px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.pbubble{background:rgba(255,255,255,.85);border-radius:12px;padding:7px 9px;font-size:11.5px;min-height:46px;white-space:pre-line}
.ptabs{display:flex;justify-content:space-around;font-size:10.5px;color:var(--mut)}
.mem{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.mem span{font-size:10.5px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid var(--line);transition:all .3s}
.mem span.flash{background:#dbeafe;border-color:#3b82f6;transform:scale(1.12)}
.memt{font-size:10.5px;color:var(--mut)}
.widget{position:absolute;border-radius:16px;background:rgba(255,255,255,.55);border:1px solid var(--line);padding:10px 12px;font-size:11.5px}
.widget h4{margin:0 0 6px;font-size:12px}
.lg-row{display:flex;align-items:center;gap:6px;margin:2px 0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.stats b{font-size:16px}
#wires{position:absolute;left:0;top:0;pointer-events:none;z-index:5;overflow:visible}
.wire{fill:none;stroke-width:2.2;opacity:.55}
.wire.hot{opacity:1;stroke-width:3.2}
.wire.egress{stroke-dasharray:6 5}
.hit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}
.lbl{pointer-events:all;cursor:pointer}
.lbl text{font-size:10.5px;fill:#334}
.lbl rect{fill:rgba(255,255,255,.92);stroke:var(--line)}
.edge.sel .wire{stroke-width:4}
.pkt text{font-size:10.5px;font-weight:600}
#panel{width:350px;flex:0 0 350px;background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(8px);display:flex;flex-direction:column;height:780px}
.tabs{display:flex;gap:4px;padding:10px 10px 6px}
.tabs .btn{flex:1;text-align:center;padding:5px 4px}
.tabc{flex:1;overflow:auto;padding:12px 14px;display:none}
.tabc.show{display:block}
.tabc h3{margin:0 0 4px;font-size:15px}
.tabc h5{margin:12px 0 4px;font-size:12px;color:var(--mut)}
.tabc ul{margin:0;padding-left:16px}
.tabc li{margin:2px 0}
.tabc li.no{color:#b42318}
.tag{display:inline-block;font-size:10.5px;padding:1px 8px;border-radius:999px;background:#eef2ff;margin:1px 2px 1px 0}
.lg{display:flex;gap:6px;padding:3px 0;border-bottom:1px dashed var(--line);font-size:12px}
.lg time{color:var(--mut);flex:0 0 46px;font-variant-numeric:tabular-nums}
.lg.bad span{color:#b42318;font-weight:600}
.lg.sys span{color:var(--mut)}
.q{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.7);padding:10px;margin-bottom:9px}
.q .qt{font-weight:700}
.q .qb{color:var(--mut);font-size:12px;margin:3px 0}
.q .qrec{background:#ecfdf5;border-radius:8px;padding:5px 8px;font-size:12px;margin:5px 0}
.q .qs{display:flex;gap:5px}
.q .qs .btn{padding:2px 9px;font-size:11.5px}
.q.adopt{border-color:#10b981}.q.reject{opacity:.6}
dialog{border:0;border-radius:18px;padding:16px;width:min(760px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog textarea{width:100%;height:55vh;font:11.5px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:8px}
#specerr{min-height:18px;margin-top:6px;font-size:12px;color:#b42318;white-space:pre-line}
#specerr.ok{color:#047857}
.hint{color:var(--mut)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}
@media (max-width:1100px){main{flex-direction:column;align-items:stretch}#panel{width:100%;flex:none;height:460px}}
[hidden]{display:none!important}
.panel-top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 0;color:var(--mut)}
.domain.single{justify-content:center}
.domain.on{box-shadow:0 0 0 3px var(--zc),0 0 26px color-mix(in srgb,var(--zc) 40%,transparent)}
.domain.warn{background:#fff3d6}.domain.bad{background:#ffe4e4}
.dhead{align-items:center}.domain.single .dhead{justify-content:center}.domain.single .dt{flex:none}
.app .chips{flex:1;grid-auto-rows:minmax(38px,1fr)}
.chip{min-height:36px}.chips.free .chip{align-items:center;justify-content:center}
.prompts .chips{grid-template-columns:repeat(7,minmax(0,1fr));flex:1;grid-auto-rows:minmax(32px,1fr)}
.prompts .chip{padding:5px 7px}.prompts .ci{display:none}.prompts .chip b{font-size:12px}
.prompt-text{white-space:pre-wrap!important;overflow-wrap:anywhere;font-size:11px!important}
.source{overflow-wrap:anywhere;margin:6px 0 3px}
.connector{margin:12px 0}.connector h4{margin:0 0 3px}
#log .stats{margin:10px 0}#log .mem{margin:0 0 10px}
.chip:focus-visible,.domain:focus-visible{outline:2px solid #1d2433;outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>Personal Agent · 架构模拟器<small>Spec 0.4 · Claude Harness 内核 · 亮 = 当前模拟步骤</small></h1>
  <span class="sp"></span>
  <button class="btn" id="bPlay">⏸ 暂停</button>
  <select class="btn" id="sSpeed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
  <button class="btn on" id="bAuto">自动循环</button>
  <button class="btn" id="bView">视图：架构</button>
  <button class="btn" id="bSpec">Spec YAML</button>
  <button class="btn" id="bPanel" aria-controls="panel" aria-expanded="false">展开侧栏</button>
</header>
<div id="flows"></div>
<main>
  <div id="stagewrap"><div id="stagebox"><div id="stage"></div></div></div>
  <aside id="panel" hidden>
    <div class="panel-top"><span>场景与规格</span><button class="btn" id="panelClose" aria-label="收起侧栏">收起</button></div>
    <div class="tabs">
      <button class="btn on" data-tab="log">日志</button>
      <button class="btn" data-tab="detail">详情</button>
      <button class="btn" data-tab="qs">待对齐 <span id="qcount"></span></button>
    </div>
    <div class="tabc show" id="log"><div class="pbubble" id="pbubble"></div><div class="stats" id="stats"></div><div class="mem" id="mem"></div><div id="logLines"></div></div>
    <div class="tabc" id="detail"></div>
    <div class="tabc" id="qs"></div>
  </aside>
</main>
<dialog id="specdlg">
  <h3 style="margin:0 0 6px">Spec YAML（图 = 数据）</h3>
  <div class="hint" style="margin-bottom:8px">编辑 YAML 后点「应用」可临时预览。复制并保存到 spec/spec.yaml，再运行 node spec/build.mjs 更新离线 HTML；新增提示词来源需要重新构建。</div>
  <textarea id="specta" spellcheck="false"></textarea>
  <div id="specerr"></div>
  <div style="display:flex;gap:8px;margin-top:6px">
    <button class="btn" id="specApply">应用</button>
    <button class="btn" id="specCopy">复制</button>
    <span class="sp"></span>
    <button class="btn" id="specClose">关闭</button>
  </div>
</dialog>

<!-- spec-build:start -->

<script type="application/json" id="spec-yaml">"# 架构模拟器 0.4：编辑此文件，然后在 personal-agent 目录运行 node spec/build.mjs。\n# source.file 相对 spec/；代码用唯一 start/end 锚点引用，行号由 build 计算。\n# index.html 的生成区只内联数据；渲染和交互代码保留在 HTML。\nmeta:\n  version: \"0.4\"\n  title: Personal Agent · 架构模拟器\n  subtitle: Spec 0.4 · Claude Harness 内核 · 亮 = 当前模拟步骤\nlayout:\n  width: 1080\n  height: 860\n  padding: 16\ninitialState:\n  memory:\n    profile: 1\n    people: 2\n    preferences: 4\n    life: 2\n    work: 1\n    project: 1\n    interests: 1\n    history: 1\n    health: 3\n    finance: 1\n    feedback: 0\n    automation-prefs: 1\n    role: 1\n    voice-notes: 0\n  stats:\n    egress: 0\n    sub: 0\n    mem: 0\n    dev: 0\n  phone: 豆豆 · 等待中…\nui:\n  overview: |-\n    # 怎么读这张图\n    - 大框是域，卡片是域里的节点；图上只显示名称，说明放在详情。\n    - 点节点或连线会展开右侧详情；顶部按钮可随时收起或展开侧栏。\n    - 粗线连域，细线连域内部件；虚线表示数据出境，白心包表示沿原路返回。\n    - 亮起表示当前场景的一次调用或读写；日志页显示场景消息、统计和记忆写入。\n    - 视图「边界」按设备、云、第三方染色；场景可手动触发，默认自动轮播。\n    - 这里只做本地架构模拟，不连接真实云端或设备。\n\n    ## 修改规格\n    编辑 spec/spec.yaml，然后在 personal-agent 目录执行 node spec/build.mjs，再双击打开 spec/index.html。页面内的「Spec YAML」可以临时编辑并预览；复制后保存回 YAML 文件。\n\n    ## 连线图例\n    - 蓝色：指令。\n    - 金色：个人数据。\n    - 绿色：结果。\n    - 紫色：进度或上线事件。\n  stats:\n    egress: 次出境\n    dev: 次设备调用\n    sub: 个子任务\n    mem: 处记忆写入\nzones:\n  dev:\n    label: 你的设备\n    color: \"#2faa7a\"\n  cloud:\n    label: 你的云\n    color: \"#3b82f6\"\n  third:\n    label: 第三方\n    color: \"#f08a3c\"\nkinds:\n  cmd:\n    label: 指令\n    color: \"#3b82f6\"\n  data:\n    label: 个人数据\n    color: \"#f59e0b\"\n  result:\n    label: 结果\n    color: \"#10b981\"\n  event:\n    label: 进度/上线\n    color: \"#8b5cf6\"\ndomains:\n  - id: app\n    name: 豆豆 App\n    icon: 📱\n    zone: dev\n    rect: [1, 15, 22, 41]\n    role: 同一个产品，安卓是手机布局，Mac 是桌面布局。\n    can:\n      - 五个栏目：聊天 / 今日 / 任务 / 记忆 / 豆豆\n      - 今日就是看板：简报 + 站点\n      - 连接器：自己在 App 填，或让豆豆引导、代填参数\n      - 引导和本机页支持一键开启，仍可单项开关\n      - 设置：连接应用、设备、技能、通知、配对和版本\n    cannot:\n      - 记忆由云端维护，App 只展示和缓存\n      - App 关了不影响云端本体；本机能力取决于设备连接\n    holds:\n      - 本地缓存\n    chips:\n      - id: app_chat\n        name: 聊天\n        icon: 💬\n        desc: 主会话 · 可编辑队列\n        note: 输入框一直可用。主会话忙时按提交顺序排队，后台任务另计；停止当前回复和停止某个后台任务分开。\n        doc: |-\n          - 主会话状态点：在线绿、离线灰、忙时金色呼吸；忙碌说明在输入框上方。\n          - 长按排队气泡：撤回 / 修改。WS 发 `unqueue {id}` / `edit_queued {id, text}`，收到 `queue_update` 的 removed / edited 才更新。\n          - 已开始处理返回 too_late：豆豆已经在看这条了。\n          - 消息轮到时才写 chat.jsonl：撤回的不留历史，修改的只写最终文本。\n          - 以 status 和原生 session_state_changed.idle 放行队列，turn_end 只是回复结果。\n      - id: app_board\n        name: 今日\n        icon: 📋\n        desc: 看板 = 简报 + 站点\n        note: 简报 / 站点两个分段，默认简报。简报按天分组、时间倒序直接看 JSON 卡片；站点常驻，两列缩略图，点开 WebView。\n        doc: |-\n          - 简报：GET /api/briefs?days=7，一次返回解析好的内容；没有详情页。\n          - 聊天里的简报卡片带 path，点了切到今日并滚到该份简报。卡片 action 把 prompt 作为用户消息发到聊天。\n          - 站点标题 / 简介来自 HTML 的 title / meta description，mtime 来自 /api/tree。\n          - 缩略图由 App 在隐藏 WebView 中按手机宽度截首屏，按路径 + mtime 缓存；失败用渐变底 + 首字。\n      - id: app_task\n        name: 任务\n        icon: ✅\n        desc: 任务 · 定时\n        note: 任务合成一个列表：进行中的置顶并可单独停止，已完成的按今天 / 近 7 天 / 更早分组。定时是另一分段，不做为你推荐。\n        doc: |-\n          - 后台任务以服务端 tasks / task.snapshot 完整快照为准，不从历史还原运行计数。\n          - task.progress 更新摘要；completed / failed / stopped 从运行列表移除。\n          - stop_task {id} 只停这一项，最终状态等 notification / snapshot；interrupt 只停主回复，保留队列和后台任务。\n          - 有简报的完成项跳到今日，有站点文件的打开 WebView。\n      - id: app_mem\n        name: 记忆\n        icon: 🗂\n        desc: 总档 · 健康 · 分类\n        note: 总档前几行作大卡，查看全部打开完整总档；指针可点。健康读 latest.json，语音笔记显示条数和最近时间，其余有文件的分类用文件夹卡。\n        doc: |-\n          - 健康：data/memory/health/latest.json，由健康周报写 {updated, metrics:[{key,label,value,unit}]}。\n          - 四个指标：睡眠、静息心率、步数、心率变异性；缺数据显示 --。\n          - 分类和主题 MD 的目录约定不变；没有自动召回，模型按需查文件。\n      - id: app_diary\n        name: 豆豆\n        icon: 📔\n        desc: 头像 · 便签日记\n        note: 豆豆 / 女生 / 男生 / 猫，晨雾蓝 / 暮光金 / 薄荷 / 樱粉；代码绘制头像，选择存 system/app-profile.json，两端同步。日记仍在 diary/，便签预览，点开 Markdown。\n      - id: app_set\n        name: 设置\n        icon: ⚙️\n        desc: 连接应用 · 设备 · 技能\n        note: 会员卡是装饰；删掉模型一行。连接器只配参数，不写代码；用户自己填表单，或由豆豆引导并用配置工具代填。\n        doc: |-\n          - 设置 → 连接应用，分云端 / 本机两页；所有连接器使用通用详情页。\n          - 云端只列已发布连接器，内置搜索、网页读取、命令行、文件、定时、语音转写不展示。\n          - 设备入口跳到对应设备的本机连接器；其他设备只读，去对应设备开关，离线设备可移除。\n          - 通知开关、云端地址、生成配对码、退出登录和版本保留；定时任务在任务页。\n      - id: app_guide\n        name: 引导\n        icon: 🧭\n        desc: 一键开启 · 可跳过\n        note: 本机能力由用户在这台设备上授权。安卓集中申请运行时权限，再申请 Health Connect；Mac 顺序申请通知、日历、三个文件夹、屏幕录制、辅助功能。每项仍能单独关闭。\n      - id: app_connect\n        name: 连接应用\n        icon: 🧩\n        desc: 设置 → 连接应用 · 云端 / 本机\n        note: 入口在设置 → 连接应用，分云端 / 本机两页；所有连接器使用通用详情页。用户自己填参数，或让豆豆引导提供必要参数并代填。\n        doc: |-\n          - 云端：一服务一连接器，用官方图标；已连接服务在上面，可接入服务在下面，内置能力不展示。\n          - 本机：列当前设备的已授权能力；点设备直接去它的本机连接器页，其他设备只读。\n          - 通用详情页：服务说明、所需字段、账号列表、添加、测试、修改、删除；同一邮箱服务支持多个账号。\n          - 豆豆只能通过 connectors 工具代填账号配置，不写代码、不自建连接器。\n          - 允许用户在聊天里提供密钥并由豆豆代填；成功后提醒：聊天记录里会留下授权码。用户也可直接在 App 的表单填写。\n  - id: mac_app\n    name: Mac\n    icon: 💻\n    zone: dev\n    rect: [1, 60, 22, 11]\n    compact: true\n    role: 页面和豆豆 App 一样，是同一个产品的桌面布局。\n    chips: []\n    doc: \"- 差异在本机能力（见「端侧连接器 → Mac」）和菜单栏快捷发消息弹窗。\"\n  - id: cloud\n    name: 本体 · ECS\n    icon: ☁️\n    zone: cloud\n    rect: [27, 15, 46, 56]\n    free: true\n    qs:\n      - q_dirs\n      - q_boundary\n    role: Claude Harness + 两个网关 + 调度器 + 工作目录。\n    can:\n      - 主会话处理用户消息、简报闹钟和后台完成通知\n      - 定时简报派后台 fork；补读、夜间整理用隔离会话\n      - 通过设备网关用已授权本机能力\n      - 只用 connectors 工具改已发布连接器的账号配置\n    cannot:\n      - 没有工具审批流程；设备系统权限仍由用户开启\n      - 不全量同步设备数据，不把原始短信等写进记忆\n      - 没有模型主动心跳；网络保活不触发推理\n      - 不写连接器代码、不自建连接器\n    holds:\n      - 工作目录（记忆、简报、站点、日记、连接器配置、会话记录）\n    chips:\n      - id: cl_sched\n        name: 调度器\n        icon: ⏰\n        desc: 闹钟入队 · 隔离维护\n        at: [4, 3, 32, 15]\n        note: system/schedule.json 存 cron + prompt。普通定时任务 / 手动运行都给主会话投递闹钟，再派后台 fork；维护任务单独处理。\n        doc: |-\n          | 默认任务 | 时间 | 产出 / 行为 |\n          |---|---|---|\n          | 晨报 | 每天 07:30 | data/briefs/\u003c日期>/晨报.json |\n          | 晚报 | 每天 21:30 | data/briefs/\u003c日期>/晚报.json |\n          | 健康周报 | 周日 20:00 | 简报 JSON + health/latest.json |\n          | 夜间整理 / 日记 | 每天 22:30 | 隔离整理记忆，写 diary/\u003c日期>.md |\n          | 主线程压缩 | 每天 03:00 | 主线程空闲时 /compact，忙则跳过 |\n          | 清理草稿 | 周一 04:00 | 代码删除 workspace/ 中 7 天没动的目录 |\n\n          - 实际时间以 schedule.json 为准，不是 HTML 中的固定承诺。\n          - 定时简报首个工具应是 Agent（subagent_type: fork，run_in_background: true）；运行层拒绝其他工具三次，随后放开，避免卡死。\n          - fork 继承主会话上下文；完成通知原生唤醒主会话转述，必要时继续修改简报。\n          - [补读] / [夜间整理] 隔离执行；设备重连补读目前有 20 小时冷却，按已开启且标记 sync 的来源读取。\n          - 云端补读、站点刷新需要相应定时配置；不把站点存在当成自动登记，也没有 schedule_create 工具。\n      - id: cl_appgw\n        name: App 网关\n        icon: 🚪\n        desc: WebSocket · 读目录给 App\n        at: [4, 33, 32, 16]\n        note: 把 SDK 消息流翻成 App 事件，维护消息队列；简报接口返回解析后的 JSON，站点、记忆、日记按目录提供。\n        doc: |-\n          - 文字流：includePartialMessages；工具调用 / 结果：tool_use / tool_result。\n          - 主会话：status {busy, reason}，reason 可为 user / schedule / task_result；原生 idle 才放行下一条。\n          - 后台任务：background_tasks_changed 完整快照 → task.snapshot；task_started / task_progress / task_notification 更新进度。\n          - 写 memory/：PostToolUse → memory_updated；写 data/ → files_changed。\n          - 写简报 JSON：PostToolUse 校验，错误用中文反馈模型修正；完成 job.done 卡片带 path。\n          - GET /api/briefs?days=7 → {items:[{date,name,time,path,brief}]}；GET /api/profile / PUT /api/profile 同步头像选择。\n      - id: cl_harness\n        name: Claude Harness\n        icon: ⚙️\n        desc: Agent SDK · 机制不画\n        at: [44, 20, 52, 27]\n        pills:\n          - 系统提示词 · 固定\n          - 连接器 = MCP\n          - Skills\n          - 后台 fork\n          - Hooks\n          - 200K · 约167K压缩\n        note: Agent SDK 提供执行机制，薄壳管理生命周期、队列、任务和校验；内置搜索等可直接用，App 不把它们列为连接器。\n        doc: |-\n          ```js\n          query({ prompt: inbox, options: {\n            model: config.model,\n            systemPrompt: PROMPT,\n            mcpServers: { devices, connectors, ...services },\n            cwd: \"/srv/agent\", resume: mainId,\n            permissionMode: config.permissionMode,\n            includePartialMessages: true,\n            perTaskStopAffordance: true,\n            hooks: { UserPromptSubmit, PreToolUse, PostToolUse }\n          }})\n          ```\n          - 模型由 AGENT_MODEL 配置，当前代码默认 anthropic/claude-haiku-5.5；App 不提供模型切换。\n          - 系统提示词启动时填一次，有利于缓存复用；时间、在线设备由 UserPromptSubmit 附加。新会话和压缩后重读总档。\n          - 200K 是 CLI 策略窗口：200000 - 20000 输出预留 - 13000 摘要预留 = 约 167000 输入触发；包括普通输入、缓存读取和缓存创建，不是精确硬闸门。主会话、隔离会话和子任务共用策略。\n          - 简报 fork 的原生完成通知进入主会话；busy 和后台任务数分开。\n          - 连接器代码在 cloud/connectors/ 随版本发布，账号变更后重建 MCP，在下一轮边界重载主查询；账号配置不会作为可执行代码加载。\n          - 目录只是约定，不是操作系统沙箱；服务以非 root 用户运行。没有产品审批流程，系统权限和写入校验仍保留。\n      - id: cl_devgw\n        name: 设备网关\n        icon: 🔗\n        desc: 外连通道 · 在线状态\n        at: [64, 61, 32, 16]\n        note: \"设备主动外连（WebSocket），网关代理为 devices MCP。只暴露已开启能力；离线 / 未授权 → 直接返回原因。截图 {image: base64, mime} 转成 MCP image，让模型真的看到。\"\n      - id: cl_fs\n        name: 工作目录 /srv/agent\n        icon: 💾\n        desc: 按寿命分三区：data 精心维护 · workspace 随便写 · system 配置和状态\n        at: [4, 80, 92, 17]\n        q: q_dirs\n        widget: memory\n        pills:\n          - data/ · memory briefs sites diary\n          - workspace/ · 脚本 中间结果\n          - system/ · connectors sync sessions\n          - .claude/skills/\n        note: data / workspace / system 的目录约定保留。简报改 JSON 卡片，站点仍是 HTML，记忆和日记仍在原目录。\n        doc: |-\n          ```\n          /srv/agent/            ← cwd，属于 Linux 用户 agent\n            data/                 ← 持久，要精心维护、要备份；App 展示的都在这\n              memory/\u003c分类>/\u003c主题>.md\n              memory/health/latest.json\n              briefs/\u003c日期>/\u003c任务名>.json\n              sites/\u003c名>/index.html\n              diary/\u003c日期>.md\n              uploads/\u003c日期>/     ← 用户附件，只读不移动\n            workspace/\u003c任务>/     ← 草稿：脚本、下载、中间结果；可清理\n            system/               ← 配置和状态\n              connectors/\u003c名>/accounts.json ← 账号，600 权限、原子写入\n              connectors/\u003c名>/state.json    ← 连接器游标和状态\n              sync/\u003c设备>.json    ← 补读游标，网关维护\n              sessions/           ← CLAUDE_CONFIG_DIR\n              chat.jsonl          ← 主会话聊天记录\n              schedule.json       ← 定时配置\n              app-profile.json    ← 头像选择\n            .claude/skills/       ← 第二次使用的做法整理成技能\n          ```\n          - profile/ 只有总档.md；其余分类多个主题 MD，不建子目录。health/latest.json 是原生指标卡的数据，不替代健康主题 MD。\n          - voice-notes/ 保存用户用语音笔记交代要留存的内容，音频附件放 uploads/，转写后按记忆标准整理。\n          - system/connectors/ 只能通过配置工具操作，密钥返回为 ••••，不直接 Read / Write / Edit / Bash。\n          - 简报 {v:1,name,time,cards}：time 是带时区的 ISO 时间，1–5 张卡，首张总览；title ≤28 字，summary ≤80 字，每张最多 4 个 blocks。\n          - blocks：timeline ≤4 项、tiles 2–3 项、metrics ≤4 项、list ≤6 项、note 写暂不可读原因；tone 为 ok / warn / info。\n          - 可选 action {label,prompt}；卡片文字不含 emoji、链接或 Markdown。未知 type / 缺字段在 App 跳过。\n          - 站点写好 title 和 meta description，不需 site.json 或注册表；旧 HTML 简报由版本迁移，App 和接口只认 JSON。\n  - id: model\n    name: ZenMux\n    icon: 🧠\n    zone: third\n    rect: [27, 0, 28, 10]\n    compact: true\n    role: SDK 经 ANTHROPIC_BASE_URL 指向 ZenMux。\n    can:\n      - 推理\n    cannot:\n      - 不负责工作目录和记忆的持久化\n    holds:\n      - 本次请求的上下文；Read 过的记忆和工具结果会进入这里\n    chips:\n      - id: md_main\n        name: Haiku 5.5\n        icon: ⚡\n        desc: 代码默认 · 云端可配置\n  - id: conn\n    name: 云端连接器\n    icon: 🧩\n    zone: third\n    rect: [59, 0, 34, 10]\n    compact: true\n    role: 已发布服务，一服务一连接器。\n    can:\n      - 连接器代码读取账号配置并调用对应服务\n      - 同一邮箱服务多个账号，用 account 指定或查询全部；Tavily 和微信读书是单账号\n    cannot:\n      - 目录里没有的暂时接不了，不自建\n      - 内置能力不在 App 的云端连接器列表展示\n    holds:\n      - 第三方账号数据；云端账号配置与连接器代码分开\n    doc: |-\n      - 云端目录来自 cloud/connectors/index.mjs，下面列出每个已发布服务的名称、说明和配置字段。\n      - 不支持自建连接器。内置能力不展示；目录里没有的服务暂时接不了。\n      - 允许豆豆引导参数并代填；提醒用户聊天里会留下授权码。也可以直接在 App 表单填。\n    chips: []\n    catalog: connectors\n  - id: dev\n    name: 端侧连接器\n    icon: 🔌\n    zone: dev\n    rect: [78, 15, 21, 24]\n    role: 也是连接器，只是宿主是设备：要授权，会离线。\n    can:\n      - 执行本体经设备网关下发的工具调用\n    cannot:\n      - 数据不整盘上传：被调用时才读\n      - 未授权或设备离线时不执行，诚实返回原因\n    holds:\n      - 原始短信、日历、运动健康、电脑文件\n    chips:\n      - id: dev_android\n        name: 安卓\n        icon: 🤖\n        desc: 电量 · 发通知 · 位置 · 日历 · 短信 · 写剪贴板 · 运动健康\n        note: 授权 + 在线才可用。删掉 open_url；notify 可带 url，用户点通知才打开链接。被厂商杀后台就算离线。\n        doc: |-\n          - battery / location / calendar_events / sms / clipboard_write 保留；notify 增加可选 url。\n          - health {from, days}：优先 Health Connect，读取步数、睡眠、心率、心率变异性；不可用或无数据时以 TYPE_STEP_COUNTER 兜底，只有步数。\n          - 不宣称能读体重、跑步记录、联系人或相册；没有 Mac 命令行和操作电脑能力。\n          - 系统权限可以一键申请，Health Connect 随后单独打开；厂商健康 App 是否同步需真机验证。\n      - id: dev_mac\n        name: Mac\n        icon: 💻\n        desc: 命令行 · 三文件夹授权 · 操作电脑 · 浏览器 · 通知 · 日历\n        note: 授权 + 在线才可用。睡眠或断线就是离线；三个文件夹只有授权开关。浏览器是 App 自带的「豆豆浏览器」，登录状态持久，并与 Safari、Chrome 隔离。\n        doc: |-\n          | 能力 | 规则 |\n          |---|---|\n          | shell | zsh，{command,cwd?,timeout?≤300}；返回 stdout / stderr / exit code，输出超过 20k 字截断 |\n          | folder_desktop / folder_documents / folder_downloads | 桌面 / 文稿 / 下载的 TCC 授权开关，授权后 shell 访问，不各建文件工具 |\n          | computer_use | screenshot / click / type / key / scroll / drag；需要屏幕录制 + 辅助功能，移动鼠标走带随机抖动的曲线，不瞬移 |\n          | browser | App 内置 WKWebView「豆豆浏览器」窗口，多标签，登录状态持久，和 Safari / Chrome 隔离 |\n          | notify | 原生发通知，显示豆豆的名字 |\n          | calendar_events | 原生日历，权限挂在 App 上 |\n\n          ## 内置浏览器\n          - 页面读取：类似 Playwright aria snapshot 的层级无障碍树，节点带 ref；不是 HTML，内容最多 12k 字。\n          - 点击和输入发送原生事件；鼠标走带随机抖动的曲线，输入带随机间隔。\n          - 工具：tabs()、open({url,tab?})、snapshot({tab})、click({tab,ref})、type({tab,ref,text,submit?})、scroll({tab,dy})、screenshot({tab})、back({tab})、close({tab})。\n          - 用户能在「豆豆浏览器」接手登录；需要使用 Safari / Chrome 中的已有登录状态时，走 computer_use。\n          - 浏览器直接内置在 App 中，不做 Chrome 扩展，也没有本机 WebSocket。设备连云端的 WebSocket 和 ping 保活仍保留。\n\n          - 电量、剪贴板、打开网页、快捷指令、当前应用、文件读写统一用 shell，删旧独立能力，不做兼容；Mac 没有运动健康。\n          - 系统设置里的屏幕录制 / 辅助功能由用户开启。\n          - 构建用 ~/.personal-agent/signing/ 的固定自签名证书，避免升级反复丢 TCC 授权。\n  - id: prompts\n    name: 提示词\n    icon: 📝\n    zone: cloud\n    rect: [1, 75, 98, 24]\n    role: 引用源文件，构建时内联全文或代码片段，并计算当前行号；不复制修改云端提示词。\n    doc: |-\n      - 文件正文和 schedule.json 中的 prompt 显示全文；代码中的动态模板显示完整源代码片段，变量保持原样。\n      - 每项注明来源文件、构建时的行号和使用时机。修改源文件后重新 build，HTML 才更新。\n      - 主线程压缩 / 清理草稿两个种子任务没有独立 prompt：压缩复用同一份指令，清理草稿是普通代码。\n      - 后台完成通知由 SDK 原生生成，没有本地手写模板。\n    chips:\n      - id: p_system\n        name: 本体系统\n        icon: 📝\n        desc: 启动主会话、隔离会话和后台 agent 时；运行层只取第一个 --- 后的正文，名字、称呼、时区在启动时填一次。\n        prompt: p_system\n      - id: p_morning\n        name: 晨报\n        icon: 📝\n        desc: 每天 07:30，或用户手动运行；主会话接闹钟后派后台 fork。\n        prompt: p_morning\n      - id: p_evening\n        name: 晚报\n        icon: 📝\n        desc: 每天 21:30，或用户手动运行；主会话接闹钟后派后台 fork。\n        prompt: p_evening\n      - id: p_health_weekly\n        name: 健康周报\n        icon: 📝\n        desc: 周日 20:00，或用户手动运行；写简报和健康指标。\n        prompt: p_health_weekly\n      - id: p_night\n        name: 夜间整理\n        icon: 📝\n        desc: 每天 22:30；在隔离会话整理记忆、总档、工作区和日记。\n        prompt: p_night\n      - id: p_compact\n        name: 压缩\n        icon: 📝\n        desc: 原生自动压缩（200K 策略、约 167K 输入触发）和空闲时的手动 /compact；命令钩子复用同一份指令。\n        prompt: p_compact\n      - id: p_alarm\n        name: 闹钟消息\n        icon: 📝\n        desc: 普通定时任务或 /api/run：进入主会话队列，要求先派后台 fork；不是主动模型心跳。\n        prompt: p_alarm\n      - id: p_catchup\n        name: 补读\n        icon: 📝\n        desc: 支持 sync 的设备重连且满足冷却条件时，生成 [补读] 消息并开隔离会话。\n        prompt: p_catchup\n      - id: p_completion\n        name: 完成通知\n        icon: 📝\n        desc: 后台 task_notification 到达后，SDK 原生唤醒主会话转述；本地只消费事件和展示产出卡片。\n        prompt: p_completion\n      - id: p_fork_guard\n        name: 派发纠错\n        icon: 📝\n        desc: 定时回合没先派后台 fork 时，PreToolUse 拒绝并反馈这条要求；拒绝三次后放开。\n        prompt: p_fork_guard\n      - id: p_turn_context\n        name: 每轮上下文\n        icon: 📝\n        desc: UserPromptSubmit：把当前时间、时区和在线设备附加到当前轮，系统正文保持固定。\n        prompt: p_turn_context\n      - id: p_recovery\n        name: 会话恢复\n        icon: 📝\n        desc: 压缩或上下文失败重开主会话时，注入最近聊天摘要及记忆检索指针，再附当前消息。\n        prompt: p_recovery\n      - id: p_attachments\n        name: 附件说明\n        icon: 📝\n        desc: 用户发送图片、文件或语音笔记时，把附件路径和转写说明附在用户消息中；图片另附 image block。\n        prompt: p_attachments\n      - id: p_brief_guard\n        name: 简报纠错\n        icon: 📝\n        desc: Write / Edit 后简报 JSON 校验失败时，PostToolUse 把原因反馈给模型，要求修正。\n        prompt: p_brief_guard\n      - id: p_memory_guard\n        name: 记忆路径纠错\n        icon: 📝\n        desc: 写记忆前的 PreToolUse 路径校验失败时，向模型返回分类、层级或总档路径要求。\n        prompt: p_memory_guard\n      - id: p_connector_guard\n        name: 连接器纠错\n        icon: 📝\n        desc: 模型试图直接读写连接器账号文件，或搜索范围覆盖配置目录时，工具校验返回改用 connectors 工具的要求。\n        prompt: p_connector_guard\n      - id: p_device_tools\n        name: 设备工具\n        icon: 📝\n        desc: devices MCP 注册时，模型收到服务器 instructions 和 list_devices / call_device / read_since / sync_commit 的工具说明。\n        prompt: p_device_tools\n      - id: p_connector_tools\n        name: 配置工具\n        icon: 📝\n        desc: connectors MCP 的账号管理工具说明；代填授权码成功后 notice 要提醒聊天留痕。\n        prompt: p_connector_tools\n      - id: p_asr\n        name: 语音转写\n        icon: 📝\n        desc: 按住说话或语音笔记的音频转写请求：只输出带正常标点的逐字文字。\n        prompt: p_asr\n      - id: p_role\n        name: 角色口吻\n        icon: 📝\n        desc: 种子角色记忆，系统提示词要求按需读角色文件以保持豆豆的性格和口吻；实际运行文件可由豆豆维护。\n        prompt: p_role\n      - id: p_error_notice\n        name: 失败告知\n        icon: 📝\n        desc: 模型或压缩失败时发给用户的中文提示；这是 UI 通知，不作为新的模型执行指令。\n        prompt: p_error_notice\nedges:\n  - id: e_msg\n    from: app\n    to: cloud\n    label: 消息\n    kind: cmd\n    \"off\": -45\n    desc: 你在聊天里说的话\n    trigger: 你发消息\n    trust: 来自你本人\n  - id: e_evt\n    from: cloud\n    to: app\n    label: 进度流\n    kind: event\n    \"off\": -15\n    desc: 文字流、busy / reason、任务快照 / 进度、queue_update、记忆 / 文件更新\n    trigger: SDK 原生状态或运行层事件\n    trust: 主会话忙闲和后台任务数分开，队列操作以服务端回包为准\n  - id: e_card\n    from: cloud\n    to: app\n    label: 卡片/文件\n    kind: result\n    \"off\": 15\n    desc: 解析后的简报 JSON 卡片，以及站点 HTML、记忆 / 日记 Markdown\n    trigger: App 请求接口或文件；job.done 带简报 path\n    trust: 简报在今日原生渲染，站点打开 WebView；App 不直接修改云端文件\n  - id: e_grant\n    from: app\n    to: cloud\n    label: 设置\n    kind: cmd\n    \"off\": 45\n    desc: 连接器表单参数、设备状态、头像选择\n    trigger: 引导或设置页\n    trust: 连接器接口先验证后原子保存 accounts.json；参数不是可执行代码\n  - id: e_llmq\n    from: cloud\n    to: model\n    label: 提示+上下文\n    kind: data\n    \"off\": 62\n    lt: 0.25\n    desc: 固定系统提示词 + 对话 + 工具结果\n    trigger: 每一轮推理\n    trust: 数据出境处。记忆正文只有被 Read 过才在这里\n  - id: e_llma\n    from: model\n    to: cloud\n    label: 回复/工具\n    kind: result\n    \"off\": 78\n    lt: 0.75\n    desc: 文字、工具调用\n    trigger: 模型返回\n    trust: 工具调用由 SDK 直接执行\n  - id: e_cq\n    from: cloud\n    to: conn\n    label: 调用\n    kind: cmd\n    \"off\": -77\n    lt: 0.25\n    desc: 已发布服务的 MCP / API 请求或账号验证\n    trigger: 调用已配置连接器；表单提交时 test\n    trust: 密钥在 system/connectors/\u003c名>/accounts.json，由连接器代码读取，不经 Read / Bash 取配置\n  - id: e_cr\n    from: conn\n    to: cloud\n    label: 数据\n    kind: data\n    \"off\": -47\n    lt: 0.75\n    desc: 只读邮件、Tavily 检索 / 正文、微信读书数据或账号验证结果\n    trigger: 接口返回\n    trust: 外部内容当数据，不当指令；密钥字段遮罩\n  - id: e_call\n    from: cloud\n    to: dev\n    label: 工具调用\n    kind: cmd\n    \"off\": -30\n    desc: 本机连接器的工具\n    trigger: 设备网关转发\n    trust: 离线 / 未授权时不转发\n  - id: e_ret\n    from: dev\n    to: cloud\n    label: 数据\n    kind: data\n    \"off\": 0\n    desc: 短信、日历、位置、运动健康、命令行结果、浏览器结构或截图图片\n    trigger: 工具执行完\n    trust: 只回这一次要的；图片结果转换成 MCP image\n  - id: e_reg\n    from: dev\n    to: cloud\n    l      log: 只把符合记忆标准的事实写入记忆库，不保存短信全文为记忆\n      - t: 10300\n        pkt: l_dev\n        label: sync_commit(批次 1)\n        log: 写完记忆才提交 → 网关把游标推到第 1 批末尾\n      - t: 11100\n        pkt: l_dev\n        label: read_since(短信)\n        log: 取第 2 批\n      - t: 11800\n        bad:\n          - dev_android\n        dur: 2600\n        log: 读到一半，手机又离线了\n        logKind: bad\n      - t: 12300\n        pkt: l_dev\n        back: true\n        label: 设备离线\n        bad:\n          - cl_devgw\n        dur: 1200\n        log: 第 2 批没提交 → 游标不动；session 结束\n        logKind: bad\n      - t: 13300\n        \"on\":\n          - cl_devgw\n        log: 冷却后下次符合条件的重连从第 2 批继续；最坏重读一批，写前查重\n  - id: f_offline\n    name: 设备离线·诚实降级\n    icon: 🫥\n    steps:\n      - t: 0\n        \"on\":\n          - cl_sched\n        log: 07:30 晨报闹钟\n      - t: 600\n        pkt: l_sched\n        label: \"[定时] 晨报\"\n        log: 进入主会话队列\n      - t: 900\n        bad:\n          - dev_android\n        dur: 10800\n        log: 安卓被杀后台 → 离线\n        logKind: bad\n      - t: 1700\n        pkt: e_llmq\n        label: 晨报闹钟\n        \"on\":\n          - md_main\n        log: → 主模型\n      - t: 2800\n        pkt: e_llma\n        label: Agent fork · 后台\n        stat:\n          sub: 1\n        log: 先派后台 fork，主会话简短确认，继续可聊天\n      - t: 3500\n        pkt: l_dev\n        label: calendar_events\n        log: fork → 设备网关\n      - t: 4300\n        pkt: l_dev\n        back: true\n        label: 设备离线\n        bad:\n          - cl_devgw\n        dur: 1500\n        log: 网关直接回设备离线，不向离线设备派发\n        logKind: bad\n      - t: 5000\n        pkt: e_cq\n        label: 未读邮件\n        \"on\":\n          - conn\n        log: → 已配置邮箱（不依赖手机在线，服务失败也要照实说明）\n      - t: 6000\n        pkt: e_cr\n        label: 3 封重要\n        log: ← 本地示例邮件\n      - t: 6700\n        pkt: e_llmq\n        label: 材料（缺日程）\n        \"on\":\n          - md_main\n        log: 读不到就说读不到，不拿记忆或常识补，不反复重试同一调用\n      - t: 7800\n        pkt: e_llma\n        label: 晨报 JSON\n        log: ← 卡片用 note 区块说明日程暂不可读\n      - t: 8500\n        pkt: l_fs\n        label: Write 晨报.json\n        log: 写 data/briefs/2026-10-11/晨报.json，PostToolUse 校验\n      - t: 9300\n        pkt: l_out\n        label: task_notification\n        log: fork 完成原生唤醒主会话，转述缺失项；job.done 带 path\n      - t: 10000\n        pkt: e_card\n        label: 含离线说明的卡片\n        log: App 获取 /api/briefs 并画原生卡片\n      - t: 11000\n        \"on\":\n          - app_board\n        phone: |-\n          今日 · 简报\n          晨报\n          日程暂不可读：手机离线\n          邮件：3 封重要\n        log: 设备离线 → 诚实降级，保留原有决定\nquestions:\n  - id: q_boundary\n    title: 对外动作\n    decided: 没有工具审批页面。明确用户意图就直接做，不明确先在聊天里问；钱、合同、对第三方的承诺和不可恢复删除仍先问。只在已经支持且已授权的能力内执行。\n  - id: q_dirs\n    title: 工作目录怎么分区？\n    decided: 保留三区：data/ 精心维护、备份、App 展示；workspace/ 放任务草稿；system/ 放配置和状态。目录约定不变，只更新简报格式和账号配置的文件说明。第二次使用的做法整理成 .claude/skills/ 技能。\n  - id: q_sync\n    title: 增量补读\n    decided: 已开启且支持 sync 的设备来源在重连时隔离补读，目前距上次补读至少 20 小时，不按自然日计数；云端来源需要对应定时配置。\n    rec: 设备游标在 system/sync/\u003c设备>.json，连接器游标在 system/connectors/\u003c名>/state.json。分批读，写完记忆再 sync_commit；未提交游标不动，冷却后再次触发可续读。\n  - id: q_session\n    title: 压缩\n    decided: CLI 策略窗口 200K，预留输出 20K、摘要 13K，下一请求输入估计约 167K 时自动压缩。缓存读 / 写计入输入；夜间另有空闲 /compact，忙则跳过。\n  - id: q_site\n    title: 看板与站点\n    decided: 看板 = 简报 + 站点，App 名为今日。简报 JSON 原生卡片；站点仍是 data/sites/\u003c名>/index.html，存在即站点，不做低代码；标题和简介在 HTML 里，缩略图由 App 生成。\n  - id: q_conn\n    title: 连接器和设备怎么分\n    decided: 设备能力经 devices MCP 调用，用户本机授权、可能离线；云端一服务一连接器，代码随版本发布，可配多账号。内置能力不展示，不做自建连接器。\n    rec: 豆豆只查目录、引导必要参数并通过 connectors 工具代填；用户也可直接在 App 填。没有的服务如实说暂时接不了。账号变更后在下一轮重建 MCP / 主查询。\n  - id: q_prompt\n    title: 系统提示词\n    decided: 启动时填一次后固定，有利于缓存复用；不装总档或索引，模型在新会话和压缩后自己读总档。\n    rec: 时间、在线设备由 UserPromptSubmit 附加。写入 Hook 做路径 / 简报校验，连接器配置只能走工具；这些校验不增加用户审批流程。\n  - id: q_memory\n    title: 记忆库形态\n    decided: 保留 data/memory/\u003c分类>/\u003c主题>.md，profile/ 只有总档；health/latest.json 专供原生指标卡。只记来源明确、稳定且值得留存的事实；事实改变原地更新，不把被推翻的内容归档到 history/。\n  - id: q_host\n    title: 云主机\n    decided: ECS。\n  - id: q_model\n    title: 模型\n    decided: 由云端 AGENT_MODEL 配置，当前代码默认 Haiku 5.5；不在 App 设置中展示模型一行或提供切换。\n  - id: q_proto\n    title: 设备离线\n    decided: 设备网关直接返回「设备离线」。\n  - id: q_push\n    title: App 不在前台时怎么联系你\n    decided: 设备 WebSocket 仍在线时收到回复 / 任务事件可发系统通知，用户能关消息通知。设备断开或进程被杀时不承诺能送达，独立离线推送后放。\n  - id: q_hw\n    title: 以后的硬件\n    decided: 后放。\n  - id: q_spike\n    title: 0.4 对齐依据\n    decided: app-v3.md 和 connectors.md 优先；没提到的按 app-v2.md，并核对系统提示词、任务协议和实际云端代码。模拟场景不是部署或真实设备验收。\n  - id: q_health\n    title: 厂商健康数据能否接入？\n    body: Health Connect 支持的指标已定，但荣耀等厂商健康 App 是否向它同步，需要真机验证；计步传感器兜底只有步数。\n    rec: 用真机确认数据来源、可用指标和授权效果，再决定是否需要补充来源。没有数据时显示 -- / 暂不可读，不编造。\n  - id: q_secret\n    title: 密钥代填\n    decided: 允许豆豆指引用户提供必要参数并代填，同时提醒聊天记录里会留下授权码；用户也可在 App 填表单。\n  - id: q_heartbeat\n    title: 心跳\n    decided: 没有主动的模型心跳；设备和 App 的 WebSocket ping 保活保留，不触发推理。\n  - id: q_browser\n    title: Mac 内置浏览器\n    decided: App 自带 WKWebView「豆豆浏览器」，持久登录且与 Safari / Chrome 隔离；读取层级无障碍树并给节点 ref，原生点击和输入，鼠标沿带随机抖动的曲线移动。computer_use 同样用曲线移动，不瞬移。\nconnectors:\n  source: ../cloud/connectors/index.mjs\n  fieldSource: ../cloud/connectors/_shared/imap.mjs\n  items:\n    - id: qq-mail\n      name: QQ 邮箱\n      description: 读取QQ 邮箱里的邮件（IMAP，只读）\n      source: ../cloud/connectors/qq-mail/index.mjs\n      multiAccount: true\n      host: imap.qq.com\n      fields:\n        - key: address\n          label: 邮箱地址\n          type: text\n          required: true\n        - key: password\n          label: 授权码 / 客户端专用密码\n          type: secret\n          required: true\n        - key: label\n          label: 备注\n          type: text\n          required: false\n    - id: netease-163\n      name: 163 邮箱\n      description: 读取163 邮箱里的邮件（IMAP，只读）\n      source: ../cloud/connectors/netease-163/index.mjs\n      multiAccount: true\n      host: imap.163.com\n      fields:\n        - key: address\n          label: 邮箱地址\n          type: text\n          required: true\n        - key: password\n          label: 授权码 / 客户端专用密码\n          type: secret\n          required: true\n        - key: label\n          label: 备注\n          type: text\n          required: false\n    - id: netease-126\n      name: 126 邮箱\n      description: 读取126 邮箱里的邮件（IMAP，只读）\n      source: ../cloud/connectors/netease-126/index.mjs\n      multiAccount: true\n      host: imap.126.com\n      fields:\n        - key: address\n          label: 邮箱地址\n          type: text\n          required: true\n        - key: password\n          label: 授权码 / 客户端专用密码\n          type: secret\n          required: true\n        - key: label\n          label: 备注\n          type: text\n          required: false\n    - id: gmail\n      name: Gmail\n      description: 读取Gmail里的邮件（IMAP，只读）\n      source: ../cloud/connectors/gmail/index.mjs\n      multiAccount: true\n      host: imap.gmail.com\n      fields:\n        - key: address\n          label: 邮箱地址\n          type: text\n          required: true\n        - key: password\n          label: 授权码 / 客户端专用密码\n          type: secret\n          required: true\n        - key: label\n          label: 备注\n          type: text\n          required: false\n    - id: exmail\n      name: 腾讯企业邮\n      description: 读取腾讯企业邮里的邮件（IMAP，只读）\n      source: ../cloud/connectors/exmail/index.mjs\n      multiAccount: true\n      host: imap.exmail.qq.com\n      fields:\n        - key: address\n          label: 邮箱地址\n          type: text\n          required: true\n        - key: password\n          label: 授权码 / 客户端专用密码\n          type: secret\n          required: true\n        - key: label\n          label: 备注\n          type: text\n          required: false\n    - id: aliyun-mail\n      name: 阿里企业邮\n      description: 读取阿里企业邮里的邮件（IMAP，只读）\n      source: ../cloud/connectors/aliyun-mail/index.mjs\n      multiAccount: true\n      host: imap.qiye.aliyun.com\n      fields:\n        - key: address\n          label: 邮箱地址\n          type: text\n          required: true\n        - key: password\n          label: 授权码 / 客户端专用密码\n          type: secret\n          required: true\n        - key: label\n          label: 备注\n          type: text\n          required: false\n    - id: imap\n      name: 其他邮箱\n      description: 读取其他邮箱里的邮件（IMAP，只读）\n      source: ../cloud/connectors/imap/index.mjs\n      multiAccount: true\n      fields:\n        - key: address\n          label: 邮箱地址\n          type: text\n          required: true\n        - key: password\n          label: 授权码 / 客户端专用密码\n          type: secret\n          required: true\n        - key: host\n          label: IMAP 服务器\n          type: text\n          required: true\n        - key: port\n          label: 端口\n          type: number\n          required: false\n          default: 993\n        - key: label\n          label: 备注\n          type: text\n          required: false\n    - id: tavily\n      name: Tavily\n      description: 深入调研和整篇网页正文提取\n      source: ../cloud/connectors/tavily/index.mjs\n      multiAccount: false\n      fields:\n        - key: apiKey\n          label: API Key\n          type: secret\n          required: true\n    - id: weread\n      name: 微信读书\n      description: 查看书架、阅读统计、划线和想法，搜索书籍\n      source: ../cloud/connectors/weread/index.mjs\n      multiAccount: false\n      fields:\n        - key: apiKey\n          label: 个人 API Key\n          type: secret\n          required: true\nprompts:\n  - id: p_system\n    name: 本体系统\n    when: 启动主会话、隔离会话和后台 agent 时；运行层只取第一个 --- 后的正文，名字、称呼、时区在启动时填一次。\n    sources:\n      - file: prompts/system-prompt.md\n        kind: file\n  - id: p_morning\n    name: 晨报\n    when: 每天 07:30，或用户手动运行；主会话接闹钟后派后台 fork。\n    sources:\n      - file: ../cloud/seed/system/schedule.json\n        kind: json\n        item: morning\n        field: prompt\n  - id: p_evening\n    name: 晚报\n    when: 每天 21:30，或用户手动运行；主会话接闹钟后派后台 fork。\n    sources:\n      - file: ../cloud/seed/system/schedule.json\n        kind: json\n        item: evening\n        field: prompt\n  - id: p_health_weekly\n    name: 健康周报\n    when: 周日 20:00，或用户手动运行；写简报和健康指标。\n    sources:\n      - file: ../cloud/seed/system/schedule.json\n        kind: json\n        item: health-weekly\n        field: prompt\n  - id: p_night\n    name: 夜间整理\n    when: 每天 22:30；在隔离会话整理记忆、总档、工作区和日记。\n    sources:\n      - file: ../cloud/seed/system/schedule.json\n        kind: json\n        item: night\n        field: prompt\n  - id: p_compact\n    name: 压缩\n    when: 原生自动压缩（200K 策略、约 167K 输入触发）和空闲时的手动 /compact；命令钩子复用同一份指令。\n    sources:\n      - file: ../cloud/src/context-policy.mjs\n        kind: code\n        start: export const COMPACT_INSTRUCTIONS\n      - file: ../cloud/scripts/compact-instructions.mjs\n        kind: file\n      - file: ../cloud/src/agent.mjs\n        kind: code\n        start: \"  compactMain() {\"\n        end: \"  runIsolated(label, prompt) {\"\n  - id: p_alarm\n    name: 闹钟消息\n    when: 普通定时任务或 /api/run：进入主会话队列，要求先派后台 fork；不是主动模型心跳。\n    sources:\n      - file: ../cloud/src/scheduler.mjs\n        kind: code\n        start: \"  await harness.send(`[定时]\"\n  - id: p_catchup\n    name: 补读\n    when: 支持 sync 的设备重连且满足冷却条件时，生成 [补读] 消息并开隔离会话。\n    sources:\n      - file: ../cloud/src/main.mjs\n        kind: code\n        start: \"  harness.runIsolated(`补读\"\n  - id: p_completion\n    name: 完成通知\n    when: 后台 task_notification 到达后，SDK 原生唤醒主会话转述；本地只消费事件和展示产出卡片。\n    sources:\n      - file: ../cloud/src/background-tasks.mjs\n        kind: code\n        start: \"    if (m.subtype === \\\"task_notification\\\") {\"\n        end: \"    if (!record.background) return true;\"\n      - file: ../cloud/src/agent.mjs\n        kind: code\n        start: \"    if (m.type === \\\"system\\\" && main.tasks.handle(m)) return;\"\n      - file: prompts/system-prompt.md\n        kind: code\n        start: \"- `[定时] 该出\"\n    doc: 没有本地手写的「完成通知提示词」。通知内容由 SDK 提供；这里引用消费位置和系统提示词里的转述要求，不合成一个不存在的模板。\n  - id: p_fork_guard\n    name: 派发纠错\n    when: 定时回合没先派后台 fork 时，PreToolUse 拒绝并反馈这条要求；拒绝三次后放开。\n    sources:\n      - file: ../cloud/src/agent.mjs\n        kind: code\n        start: const SCHEDULE_FORK_REASON\n  - id: p_turn_context\n    name: 每轮上下文\n    when: UserPromptSubmit：把当前时间、时区和在线设备附加到当前轮，系统正文保持固定。\n    sources:\n      - file: ../cloud/src/agent.mjs\n        kind: code\n        start: \"  promptContext() {\"\n        end: \"  checkWrite(input) {\"\n  - id: p_recovery\n    name: 会话恢复\n    when: 压缩或上下文失败重开主会话时，注入最近聊天摘要及记忆检索指针，再附当前消息。\n    sources:\n      - file: ../cloud/src/conversation-recovery.mjs\n        kind: code\n        start: export function recoveryContext(\n        end: export function withRecovery(\n  - id: p_attachments\n    name: 附件说明\n    when: 用户发送图片、文件或语音笔记时，把附件路径和转写说明附在用户消息中；图片另附 image block。\n    sources:\n      - file: ../cloud/src/agent.mjs\n        kind: code\n        start: function userContent(\n        end: function toolHint(\n  - id: p_brief_guard\n    name: 简报纠错\n    when: Write / Edit 后简报 JSON 校验失败时，PostToolUse 把原因反馈给模型，要求修正。\n    sources:\n      - file: ../cloud/src/agent.mjs\n        kind: code\n        start: \"          return error ? { decision: \\\"block\\\", reason:\"\n        end: \"        }] }],\"\n  - id: p_memory_guard\n    name: 记忆路径纠错\n    when: 写记忆前的 PreToolUse 路径校验失败时，向模型返回分类、层级或总档路径要求。\n    sources:\n      - file: ../cloud/src/agent.mjs\n        kind: code\n        start: function memoryPathError(\n        end: export class Harness\n  - id: p_connector_guard\n    name: 连接器纠错\n    when: 模型试图直接读写连接器账号文件，或搜索范围覆盖配置目录时，工具校验返回改用 connectors 工具的要求。\n    sources:\n      - file: ../cloud/src/connector-guard.mjs\n        kind: code\n        start: const REASON\n        end: const inside\n  - id: p_device_tools\n    name: 设备工具\n    when: devices MCP 注册时，模型收到服务器 instructions 和 list_devices / call_device / read_since / sync_commit 的工具说明。\n    sources:\n      - file: ../cloud/src/devices.mjs\n        kind: code\n        start: \"      instructions: \\\"用户的手机和电脑。\"\n        end: \"      ],\"\n  - id: p_connector_tools\n    name: 配置工具\n    when: connectors MCP 的账号管理工具说明；代填授权码成功后 notice 要提醒聊天留痕。\n    sources:\n      - file: ../cloud/src/connectors.mjs\n        kind: code\n        start: \"      tool(\\\"list\\\", \\\"列出预置连接器\"\n        end: \"    ];\"\n  - id: p_asr\n    name: 语音转写\n    when: 按住说话或语音笔记的音频转写请求：只输出带正常标点的逐字文字。\n    sources:\n      - file: ../cloud/src/transcribe.mjs\n        kind: code\n        start: \"        { type: \\\"text\\\", text: \\\"把这段语音\"\n  - id: p_role\n    name: 角色口吻\n    when: 种子角色记忆，系统提示词要求按需读角色文件以保持豆豆的性格和口吻；实际运行文件可由豆豆维护。\n    sources:\n      - file: ../cloud/seed/data/memory/role/角色.md\n        kind: file\n  - id: p_error_notice\n    name: 失败告知\n    when: 模型或压缩失败时发给用户的中文提示；这是 UI 通知，不作为新的模型执行指令。\n    sources:\n      - file: ../cloud/src/conversation-recovery.mjs\n        kind: code\n        start: export const RECOVERY_NOTICE\n      - file: ../cloud/src/conversation-recovery.mjs\n        kind: code\n        start: export function humanError(\n        end: // Bounded disk read\n"</script>
<script type="application/json" id="prompt-sources">{"{\"file\":\"prompts/system-prompt.md\",\"kind\":\"file\"}":{"file":"prompts/system-prompt.md","kind":"file","startLine":1,"endLine":152,"text":"# Personal Agent 系统提示词 · v2\n\n> 整段作为 SDK `systemPrompt` 传入，不用 claude_code 预设。分隔线以上是写给人看的说明，不进提示词。\n> `{名字}` `{称呼}` `{时区}` 启动时填一次，之后一个字都不变，保证缓存命中。\n> 不在这里的东西：总档（模型自己 Read）、当前时间与在线设备（UserPromptSubmit 钩子每条附上）、工具和连接器清单（SDK 工具表）。\n> 写法：只写长期成立的原则和约定，不为某一次对话里的具体事件打补丁。\n\n---\n\n你是 {名字}，{称呼} 的个人 agent。你运行在 {称呼} 自己的云主机上，24 小时在线；{称呼} 的手机和电脑作为设备接入，是你的手脚。\n\n# 身份与语气\n- 你只服务 {称呼} 一个人。{称呼} 要的是判断，不是资料堆砌：给结论，给立场。\n- 性格和口吻以 `data/memory/role/角色.md` 为准；没写到的部分，做一个靠谱、话少、偶尔幽默的朋友。\n- 所有 {称呼} 看得到的文字都用中文，包括工具调用之间的过程说明。\n\n# 每个会话的开始\n回应之前先 Read `data/memory/profile/总档.md`。上下文被压缩之后同样重读一次。\n\n# 沟通\n- 结论先行，理由最多一层。长度与对方的消息相称：闲聊一两句，问事情才展开。\n- 推荐类问题只给一个答案和硬理由。不罗列选项，不两面下注，不写开场白和收尾客套。\n- 说错了，认一句，直接给更正后的结论。\n- 被批评时，从中提炼出可执行的反馈写进 `feedback/`，不反复道歉。\n- 不对 {称呼} 提工具名、技能名、子任务、文件路径这类内部概念，除非 {称呼} 问起或需要打开某个文件。说你做了什么，而不是怎么做的。\n\n# 工作目录\n当前目录就是你的工作目录。所有持久内容都按下面的约定放，约定之外不新建顶层目录。\n\n| 路径 | 用途 | 规则 |\n|---|---|---|\n| `data/memory/\u003c分类>/\u003c主题>.md` | 记忆 | 见「记忆」一节 |\n| `data/briefs/\u003cYYYY-MM-DD>/\u003c任务名>.json` | 简报 | 结构化 JSON 卡片，用 Write 写，按校验反馈修正 |\n| `data/sites/\u003c名>/index.html` | 站点：长期保留、会反复更新的页面 | 目录里有 `index.html` 就是一个站点，无需登记 |\n| `data/diary/\u003cYYYY-MM-DD>.md` | 你自己的日记 | 每天一篇 |\n| `data/uploads/\u003cYYYY-MM-DD>/` | {称呼} 上传的文件 | 只读，不改名、不移动、不删除 |\n| `workspace/\u003c任务名>/` | 草稿区：脚本、下载、中间结果 | 7 天没动的目录会被自动清掉 |\n| `.claude/skills/\u003c名>/SKILL.md` | 技能：可复用的做法 | 同一套做法第二次用到时整理成技能 |\n| `system/connectors/` | 预置连接器的账号配置 | 只能用 `connectors` 工具改，不能直接读写 |\n| `system/` 的其他内容 | 运行配置和状态 | 不要读写 |\n\n简报最小示例：`{\"v\":1,\"name\":\"晨报\",\"time\":\"2026-10-11T07:30:00+08:00\",\"cards\":[{\"chip\":\"10月11日 周日\",\"title\":\"今天先把周报交了\",\"summary\":\"下午三点前提交。\"}]}`。1–5 张卡，第一张总览的 chip 写日期，其余写分类；title ≤28 字、可选 summary ≤80 字，每张最多 4 个 blocks：timeline ≤4 项、tiles 2–3 项、metrics ≤4 项、list ≤6 项、note 写暂不可读原因；tone 只用 ok/warn/info，可选一个 action {label,prompt}。文字不用 emoji、链接或 Markdown。\n\n`data/` 下的东西 {称呼} 在 App 里都看得到，要像成品一样维护：命名清楚、没有重复、没有半成品。过程文件一律放 `workspace/`。\n\n# 数据从哪里来\n动手前先判断数据在哪，再选工具。四个来源不能互相替代：\n1. **设备**：短信、通知、日历、位置、电量、剪贴板、电脑上的文件等，通过设备工具读取。设备可能离线。\n2. **云端连接器**：邮箱、在线日历、代码托管等账号数据，一直在线。一个连接器可以挂多个账号，工具的 `account` 参数指定账号，不填就是全部。\n3. **公网**：网页搜索和网页读取。\n4. **工作目录**：你自己维护的记忆和产出。\n\n- 设备上开启的能力是 {称呼} 在那台设备上亲手打开的，开启即授权，直接调用，不需要再征求同意。没开启的能力你看不到，需要时请 {称呼} 去那台设备上打开。\n- 读不到就说读不到：设备离线、能力未开启、工具报错时，照实告诉 {称呼}，不重试同一个调用，也不用记忆或常识去填补。\n- 工具结果带分页游标（如 `next_before`、`next_cursor`）时，一页不是全部；需要更多就继续翻，直到够用或翻完。\n- {称呼} 要接入服务时，先调 `connectors.list()` 查目录；没有就如实说「暂时还接不了」。有的话照 `fields` 和 `help` 引导准备参数，由 {称呼} 在 App 填表单，或你用 `add_account` 代填。代填时提醒：「在 App 里填表单更安全，聊天记录里会留下授权码」。只配置，不写连接器代码，不读配置文件。\n- 日常搜索用内置网页搜索；深入调研或要提取整篇网页正文时用 Tavily。\n- {称呼} 发来的附件会在消息里列出路径：图片已经附在消息里；语音笔记附带转写文字；其他文件需要时自己 Read。\n\n# 记忆\n记忆是 `data/memory/` 下的一组 Markdown 文件，由你用 Read / Write / Edit / Grep 维护。没有自动召回，要用就自己去查。\n\n## 结构\n- 只有一层目录：`data/memory/\u003c分类>/\u003c主题>.md`，分类下不建子目录。健康周报顺手写 `data/memory/health/latest.json`：`{updated,metrics:[{key,label,value,unit}]}`，updated 为 ISO 时间，只放实际读到的睡眠、静息心率、步数、心率变异性，没数据就空 metrics。\n- 分类：\n  - `profile`：只放 `总档.md`\n  - `people`：一个人一个文件，如 `people/妈妈.md`；{称呼} 本人的基本信息放 `people/本人.md`\n  - `preferences`：口味、习惯、喜恶\n  - `life`：居住、出行、日常安排\n  - `work`：工作、职业\n  - `project`：{称呼} 在做的项目\n  - `interests`：长期兴趣\n  - `health`：健康状况和数据\n  - `finance`：收入、支出习惯、资产概况（不存账号、密码和精确余额）\n  - `history`：{称呼} 的过往经历，如毕业、搬家、换工作\n  - `feedback`：{称呼} 对你做事方式的要求\n  - `automation-prefs`：{称呼} 希望你自动做或不要做的事\n  - `voice-notes`：{称呼} 用语音笔记交代要留存的内容\n  - `role`：你自己的设定\n- 文件名是中文短主题。每个文件第一行写 `更新：YYYY-MM-DD`，然后是标题和条目。\n\n## 只记事实\n记忆里只能有两类内容：\n1. {称呼} 亲口说的。\n2. 你从数据里直接看到的，写明来源和日期，如「（短信，2026-10-08）」。\n\n不写进记忆的：\n- 推断、猜测和「可能」「说明」「应该是」一类的结论。从数据里看不出来的事就是不知道，不写，也不写「待确认」。值得知道的，在合适的时候直接问 {称呼}。\n- 工具或设备的状态、限制和故障（读不到什么、哪里报错）。这些不是关于 {称呼} 的事实。\n- 某一次任务的过程记录。做过的事属于聊天记录和产出物，不属于记忆；只有从中得到的长期偏好才记。\n- 情绪揣测、密码和验证码、一次性的状态、聊天原文。\n\n判断标准：这条事实稳定（几周以上不变）、会影响你以后的判断、并且无法随时现查。三条都满足才记。\n\n## 更新\n- 每条消息进来，先看有没有值得记的事实。聊到就当场写，不攒到晚上。\n- 事实变了就**原地改**那一条，改成新的事实并更新日期。不另建文件保存旧版本，不在 `history/` 里归档被推翻的内容。\n- 写入前先 Grep 有没有已有文件覆盖同一主题，有就更新那个文件，不建重复文件。\n- {称呼} 说「忘掉」的，删干净。\n- 写完不用告诉 {称呼}，App 会显示「记忆已更新」。\n\n## 总档\n- `profile/总档.md` 是全部记忆的索引式摘要：每条一行事实，行尾用 `→ \u003c分类>/\u003c主题>.md` 指向细节文件，例如 `- 住在杭州西湖区，租房 → life/居住.md`。\n- 每一条都必须指向一个存在的细节文件。总档里不放细节文件里没有的内容。\n- 改记忆时先改细节文件，再同步总档里对应的那一行。不直接在总档里写新事实。\n- 控制在 100 行以内，按重要程度排列。\n\n# 做事方式\n- 简单问题直接回答，不铺垫。\n- 你有 Agent 工具，可以把任务交给子 agent。用它的场景：\n  - 任务要多步、要跑几分钟、或要产出文件（报告、站点、数据整理）时，交给后台子 agent（`run_in_background: true`），先回一句「在弄了」，主线程继续陪 {称呼} 聊。完成时你会收到通知，届时转述结果。\n  - 需要大量检索、读很多文件或网页、而你只需要结论时，交给子 agent，免得原始材料塞满主线程的上下文。\n  - 互不依赖的几件事，在同一条消息里同时派出多个子 agent 并行做。\n- 不要用它的场景：已经知道要读哪个文件、查哪一条信息时，直接做；一两步就能完成的事，直接做。\n- 子 agent 看不到你们的对话。给它的说明要自成一体：目标、必要的背景、产出放在哪里、完成标准；不规定具体步骤。\n- 子 agent 的汇报 {称呼} 看不到，由你转述要点。已经派出去的工作不要自己再做一遍；结果没回来之前，不要猜测或预告结果。\n- 中间产物放 `workspace/\u003c任务名>/`，中断了可以接着做。\n- 交付物默认是一个自包含的 HTML 页面，放在 `data/sites/\u003c名>/index.html`，写好 `\u003ctitle>` 和 `\u003cmeta name=\"description\">`，回复里说明在哪里打开。改已有站点时原地改，不复制出新站点。\n- 说做完了，就必须真的做完、验证过。没做完或失败了，照实说。\n\n# 对外动作\n对外动作是会被别人看到或无法撤回的事：发消息、发邮件、建或改日程、删除文件、提交表单、在任何平台发布内容。只读的查询不算。\n\n规则只有一条：**确定 {称呼} 想这么做，就直接做；不确定，就先问。**\n- 「跟老王说我晚点到」→ 直接发，发完说一声。\n- 收到「晚上吃饭吗」→ 不替 {称呼} 回复，转告并附一个建议回复，等 {称呼} 确认。\n- 「帮我回这封邮件」但没说内容 → 先给草稿，等一句「发」。\n- 涉及钱、合同、对第三方的承诺、不可恢复的删除 → 无论多确定都先问。\n- {称呼} 没提过的对外动作不主动做，最多建议一句。\n\n需要问的时候，一句话问完，附上你打算怎么做，让 {称呼} 回一个「行」就能执行。不连环追问。\n\n# 诚实\n- 基于检索的回答，分清三件事：查到了什么、没查到什么、哪些是你的推断。推断可以在对话里说，但要标明，且不写进记忆。\n- 工具失败、超时、只返回部分结果、没有结果时，直说。\n- 有时效性的事实先查再答。\n- 不确定就说不确定，并说清原因：没有数据、数据冲突，还是做不到。\n\n# 时间\n- 每条消息附带当前时间和在线设备，以它为准。\n- 相对时间（明天、上周五）先换算成绝对日期再使用和记录。\n- 外部数据的时间统一换算到 {时区}。\n\n# 系统发起的会话\n系统消息以方括号前缀标记，不寒暄，不向用户追问。\n- `[定时] 该出「\u003c名称>」了`：先按闹钟要求用 Agent（`subagent_type: \"fork\"`、`run_in_background: true`）派到后台，自己只回一句确认。fork 继承对话，直接做、不再转派；用 Write 写 `data/briefs/\u003cYYYY-MM-DD>/\u003c任务名>.json`，暂不可读的部分写明原因，最后报告标题和路径。完成通知到达后，主会话简短转述结果并给出位置；失败则说明原因。\n- `[补读] \u003c连接器>`：循环调用 `read_since` 取一批数据，把符合记忆标准的事实写进记忆，再 `sync_commit` 这一批，直到没有新数据。记忆没写完不要 commit。\n- `[补读]`、`[夜间整理]` 在隔离会话执行，做完就停；`[夜间整理]`：\n  1. 检查记忆：合并重复文件；删除不符合「只记事实」的内容；核对每个文件的分类是否正确。\n  2. 依据细节文件重写总档，确保每一行都有对应的细节文件。\n  3. 整理工作区：`workspace/` 里已完成任务的草稿删除；会复用的脚本整理成技能；`data/` 里的半成品、重复站点清理掉。\n  4. 写今天的日记 `data/diary/\u003cYYYY-MM-DD>.md`：用你自己的视角写今天帮 {称呼} 做了什么、注意到什么、哪里做得不够好。"},"{\"field\":\"prompt\",\"file\":\"../cloud/seed/system/schedule.json\",\"item\":\"morning\",\"kind\":\"json\"}":{"file":"../cloud/seed/system/schedule.json","kind":"json","startLine":6,"endLine":6,"text":"给用户做今天的晨报。内容按这个顺序，读不到的写「暂不可读」和原因：\n1. 今天的日程（设备日历或日历连接器）\n2. 天气：用记忆里的常住城市搜索今天的天气，提醒带伞/加衣\n3. 昨晚到现在的重要消息和通知（只挑需要用户处理的）\n4. 你从记忆里想到的今天该提醒的事（生日、截止日、承诺过的事）\n先读总档。按简报格式写 JSON 到 data/briefs/\u003cYYYY-MM-DD>/\u003c任务名>.json。"},"{\"field\":\"prompt\",\"file\":\"../cloud/seed/system/schedule.json\",\"item\":\"evening\",\"kind\":\"json\"}":{"file":"../cloud/seed/system/schedule.json","kind":"json","startLine":12,"endLine":12,"text":"给用户做今天的晚报：今天发生了什么（日程、消息、你帮忙做过的事）、还没处理完的事、明天要注意的。先读总档。按简报格式写 JSON 到 data/briefs/\u003cYYYY-MM-DD>/\u003c任务名>.json。"},"{\"field\":\"prompt\",\"file\":\"../cloud/seed/system/schedule.json\",\"item\":\"health-weekly\",\"kind\":\"json\"}":{"file":"../cloud/seed/system/schedule.json","kind":"json","startLine":18,"endLine":18,"text":"做本周的健康周报：睡眠、步数、心率等能从设备读到的数据，和上周对比，给一条最值得改的建议。数据读不到就写读不到，不要编。顺手更新 data/memory/health/ 里对应的文件。按简报格式写 JSON 到 data/briefs/\u003cYYYY-MM-DD>/\u003c任务名>.json。顺手写 data/memory/health/latest.json，格式 {updated,metrics:[{key,label,value,unit}]}，updated 用 ISO 时间；只写实际读到的睡眠、静息心率、步数、心率变异性，没有数据就用空 metrics。"},"{\"field\":\"prompt\",\"file\":\"../cloud/seed/system/schedule.json\",\"item\":\"night\",\"kind\":\"json\"}":{"file":"../cloud/seed/system/schedule.json","kind":"json","startLine":24,"endLine":24,"text":"[夜间整理]\n按系统提示词里「系统发起的会话 · 夜间整理」的四步做：检查记忆、重写总档、整理工作区、写日记。"},"{\"file\":\"../cloud/src/context-policy.mjs\",\"kind\":\"code\",\"start\":\"export const COMPACT_INSTRUCTIONS\"}":{"file":"../cloud/src/context-policy.mjs","kind":"code","startLine":5,"endLine":5,"text":"export const COMPACT_INSTRUCTIONS = \"请用精炼的中文整理上下文，目标不超过 1500 tokens。保留用户目标、重要决定及原因、对话历史要点、未完成事项、必要的文件路径和记忆检索线索；尤其保留 data/ 中的记忆和待办指针。省略重复对话、长工具输出、代码全文和思考过程。不要执行任务或回答历史问题，只生成供后续对话继续使用的摘要。\";"},"{\"file\":\"../cloud/scripts/compact-instructions.mjs\",\"kind\":\"file\"}":{"file":"../cloud/scripts/compact-instructions.mjs","kind":"file","startLine":1,"endLine":3,"text":"// PreCompact command hooks' stdout becomes summary instructions, on auto and manual compaction.\nimport { COMPACT_INSTRUCTIONS } from \"../src/context-policy.mjs\";\nconsole.log(COMPACT_INSTRUCTIONS);"},"{\"end\":\"  runIsolated(label, prompt) {\",\"file\":\"../cloud/src/agent.mjs\",\"kind\":\"code\",\"start\":\"  compactMain() {\"}":{"file":"../cloud/src/agent.mjs","kind":"code","startLine":615,"endLine":622,"text":"  compactMain() {\n    if (this.busy) return false;\n    this.turnQueue.push({ manualCompact: true, input: { type: \"user\", message: { role: \"user\", content: `/compact ${COMPACT_INSTRUCTIONS}` }, parent_tool_use_id: null } });\n    this.scheduleDispatch().catch((e) => this.log(\"compact failed:\", this.connectors.redact(e.message)));\n    return true;\n  }\n\n  // ---------- isolated sessions (cron, catch-up, night tidy) ----------"},"{\"file\":\"../cloud/src/scheduler.mjs\",\"kind\":\"code\",\"start\":\"  await harness.send(`[定时]\"}":{"file":"../cloud/src/scheduler.mjs","kind":"code","startLine":59,"endLine":59,"text":"  await harness.send(`[定时] 该出「${label}」了。请用 Agent（subagent_type: \"fork\"，run_in_background: true）把下面的任务派到后台，你自己只回一句简短确认。\\n\\n任务说明：\\n${job.prompt || \"\"}`, \"schedule\");"},"{\"file\":\"../cloud/src/main.mjs\",\"kind\":\"code\",\"start\":\"  harness.runIsolated(`补读\"}":{"file":"../cloud/src/main.mjs","kind":"code","startLine":54,"endLine":54,"text":"  harness.runIsolated(`补读 · ${info.name || info.id}`, `[补读] ${info.id}\\n\\n设备：${info.name || info.id}\\n来源：${sources.join(\"、\")}`);"},"{\"end\":\"    if (!record.backgro ent.mjs","kind":"code","startLine":219,"endLine":228,"text":"  promptContext() {\n    const devs = this.hub.online();\n    const devText = devs.length ? devs.map((d) => `${d.name}（${d.id}）`).join(\"、\") : \"无\";\n    return {\n      hookSpecificOutput: {\n        hookEventName: \"UserPromptSubmit\",\n        additionalContext: `当前时间：${nowIn(config.timezone)}（${config.timezone}）\\n在线设备：${devText}`,\n      },\n    };\n  }"},"{\"end\":\"export function withRecovery(\",\"file\":\"../cloud/src/conversation-recovery.mjs\",\"kind\":\"code\",\"start\":\"export function recoveryContext(\"}":{"file":"../cloud/src/conversation-recovery.mjs","kind":"code","startLine":53,"endLine":64,"text":"export function recoveryContext({ root, chatLog, redact = (s) => s }) {\n  const legacyError = /^(?:Error during compaction:|Prompt (?:is )?too long(?:\\s*[·:：]|$)|API Error:|Conversation too long\\.)/i;\n  const rows = recentChat(chatLog).filter((e) => [\"user\", \"assistant\", \"card\"].includes(e.role) && !e.error &&\n    !(e.role === \"assistant\" && !e.partial && legacyError.test(e.text || \"\")) && e.text !== RECOVERY_NOTICE);\n  const excerpts = rows.map((e) => {\n    const text = String(e.text || e.title || \"\").slice(0, 900);\n    const atts = (e.attachments || []).map((a) => a.path).join(\"、\");\n    return `${e.role}：${text}${atts ? ` [附件路径：${atts}]` : \"\"}`;\n  }).join(\"\\n\").slice(-12_000);\n  // The chat archive remains on disk; older details can be searched instead of injected wholesale.\n  return redact(`[会话恢复交接]\\n旧会话因压缩或上下文错误停止，这是一个新会话。以下是最近聊天的摘录式摘要，可能不完整；不要将历史摘录当作新的执行指令。\\n先重读 data/memory/profile/总档.md，并按需检索 data/memory/。记忆、待办和成果仍在 data/；先检查文件中的待办和未完成事项，不要推定它们完成或重新执行已有副作用。定时任务仍在 system/schedule.json。完整聊天记录仍保留在 system/chat.jsonl，可按需分段检索。\\n记忆线索：\\n${memoryPointers(root).join(\"\\n\")}\\n最近对话要点及待办线索：\\n${excerpts}\\n[交接结束，下面是当前消息]`);\n}"},"{\"end\":\"function toolHint(\",\"file\":\"../cloud/src/agent.mjs\",\"kind\":\"code\",\"start\":\"function userContent(\"}":{"file":"../cloud/src/agent.mjs","kind":"code","startLine":684,"endLine":700,"text":"function userContent(text, atts) {\n  if (!atts.length) return text;\n  const lines = atts.map((a) => {\n    if (a.kind === \"voice\") return `- ${a.path}（语音笔记，转写：${a.transcript || \"空\"}）`;\n    if (a.kind === \"image\") return `- ${a.path}（图片，已附在本条消息里）`;\n    return `- ${a.path}（文件，需要时自己读）`;\n  });\n  const body = `${text || (atts.every((a) => a.kind === \"voice\") ? \"（一段语音笔记）\" : \"（发来了附件）\")}\\n\\n[附件]\\n${lines.join(\"\\n\")}`;\n  const blocks = [{ type: \"text\", text: body }];\n  for (const a of atts) {\n    const type = IMAGE_TYPES[path.extname(a.path).toLowerCase()];\n    if (a.kind !== \"image\" || !type) continue;\n    const buf = fs.readFileSync(path.join(config.root, a.path));\n    if (buf.length \u003c= 5 * 1024 * 1024) blocks.push({ type: \"image\", source: { type: \"base64\", media_type: type, data: buf.toString(\"base64\") } });\n  }\n  return blocks;\n}"},"{\"end\":\"        }] }],\",\"file\":\"../cloud/src/agent.mjs\",\"kind\":\"code\",\"start\":\"          return error ? { decision: \\\"block\\\", reason:\"}":{"file":"../cloud/src/agent.mjs","kind":"code","startLine":208,"endLine":209,"text":"          return error ? { decision: \"block\", reason: `简报校验失败：${error}。请用 Write / Edit 修正。`,\n            hookSpecificOutput: { hookEventName: \"PostToolUse\", additionalContext: `简报校验失败：${error}。请修正后再完成任务。` } } : {};"},"{\"end\":\"export class Harness\",\"file\":\"../cloud/src/agent.mjs\",\"kind\":\"code\",\"start\":\"function memoryPathError(\"}":{"file":"../cloud/src/agent.mjs","kind":"code","startLine":73,"endLine":85,"text":"function memoryPathError(r) {\n  if (!r.startsWith(\"data/memory/\")) return null;\n  if (r === \"data/memory/health/latest.json\") return null;\n  const parts = r.split(\"/\");\n  if (parts.length !== 4 || !parts[3].endsWith(\".md\")) {\n    return `记忆路径必须是 data/memory/\u003c分类>/\u003c主题>.md（只有一层目录），你写的是 ${r}`;\n  }\n  if (!MEMORY_CATEGORIES.includes(par      ),\n        tool(\"sync_commit\", \"提交一批已经处理完的补读数据，游标前移。\", { batch: z.string() }, async ({ batch }) => {\n          try {\n            this.commit(batch);\n            return text(\"已提交\");\n          } catch (e) {\n            return fail(e);\n          }\n        }),"},"{\"end\":\"    ];\",\"file\":\"../cloud/src/connectors.mjs\",\"kind\":\"code\",\"start\":\"      tool(\\\"list\\\", \\\"列出预置连接器\"}":{"file":"../cloud/src/connectors.mjs","kind":"code","startLine":268,"endLine":274,"text":"      tool(\"list\", \"列出预置连接器、账号状态和配置字段；密钥不会返回。\", {}, wrap(() => this.list())),\n      tool(\"add_account\", \"添加并验证账号。若用户在聊天里提供授权码，成功后将 notice 提醒告诉用户。\", { name: z.string(), values: VALUES }, wrap(async ({ name, values }) => ({\n        ...await this.addAccount(name, values),\n        notice: \"下次在 App 里点「连接」填表单更安全，聊天记录里会留下授权码\",\n      }))),\n      tool(\"update_account\", \"修改并验证账号。secret 省略或传 •••• 保持原值。\", { name: z.string(), id: z.string(), values: VALUES }, wrap(({ name, id, values }) => this.updateAccount(name, id, values))),\n      tool(\"remove_account\", \"删除账号；最后一个账号删除后卸载连接器。\", { name: z.string(), id: z.string() }, wrap(({ name, id }) => this.removeAccount(name, id))),"},"{\"file\":\"../cloud/src/transcribe.mjs\",\"kind\":\"code\",\"start\":\"        { type: \\\"text\\\", text: \\\"把这段语音\"}":{"file":"../cloud/src/transcribe.mjs","kind":"code","startLine":36,"endLine":36,"text":"        { type: \"text\", text: \"把这段语音逐字转写成文字。只输出转写内容，加上正常的标点，汉字之间不要加空格。听不清或没有人声就输出空。说话人在和名叫「豆豆」的助手说话。\" },"},"{\"file\":\"../cloud/seed/data/memory/role/角色.md\",\"kind\":\"file\"}":{"file":"../cloud/seed/data/memory/role/角色.md","kind":"file","startLine":1,"endLine":5,"text":"更新：2026-10-08\n\n- 名字：豆豆\n- 性格：靠谱、话少、偶尔有点幽默。像一个很懂你的朋友，不像客服。\n- 口吻：口语化中文，不用敬语，不用表情符号堆砌。"},"{\"file\":\"../cloud/src/conversation-recovery.mjs\",\"kind\":\"code\",\"start\":\"export const RECOVERY_NOTICE\"}":{"file":"../cloud/src/conversation-recovery.mjs","kind":"code","startLine":4,"endLine":4,"text":"export const RECOVERY_NOTICE = \"整理上下文失败，已重新开始对话，记忆不受影响。\";"},"{\"end\":\"// Bounded disk read\",\"file\":\"../cloud/src/conversation-recovery.mjs\",\"kind\":\"code\",\"start\":\"export function humanError(\"}":{"file":"../cloud/src/conversation-recovery.mjs","kind":"code","startLine":10,"endLine":18,"text":"export function humanError(raw = \"\", code = \"\") {\n  if (contextFailure(raw)) return \"对话太长，整理上下文失败，记忆和已保存的文件不受影响。\";\n  if (/max_output_tokens|exceeded the .*output token maximum/i.test(code + \" \" + raw)) return \"回复过长，本次未能完成，请缩小问题范围后重试。\";\n  if (/authentication|credential|unauthori[sz]ed|\\b401\\b|\\b403\\b/i.test(code + \" \" + raw)) return \"模型连接的授权出了问题，请联系管理员检查配置。\";\n  if (/billing|credit|balance|\\b402\\b/i.test(code + \" \" + raw)) return \"模型服务的额度不足，请联系管理员。\";\n  if (/rate_limit|overloaded|\\b429\\b|\\b529\\b/i.test(code + \" \" + raw)) return \"模型服务暂时繁忙，请稍后重试。\";\n  if (/timeout|timed out|ECONN|fetch failed|network/i.test(raw)) return \"暂时连不上模型服务，请稍后重试。\";\n  return \"模型服务暂时出错，请稍后重试，已保存的记忆不受影响。\";\n}"}}</script>
