<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>豆豆 · 产品规格</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink:#1d2433;--mut:#6b7488;--glass:rgba(255,255,255,.62);--line:rgba(30,40,70,.12)}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;color:var(--ink);background:linear-gradient(180deg,#c9e3fb 0%,#e7ecfb 45%,#fbe6d6 100%) fixed;min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px 6px;flex-wrap:wrap}
h1{font-size:17px;margin:0}
h1 small{font-weight:400;color:var(--mut);margin-left:8px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.72);border-radius:999px;padding:5px 12px;cursor:pointer;font:inherit;color:inherit;white-space:nowrap}
.btn:hover{background:#fff}
.btn.on{background:#1d2433;color:#fff;border-color:#1d2433}
select.btn{padding:5px 8px}
#flows{display:flex;gap:6px;flex-wrap:wrap;padding:4px 20px 10px;align-items:center}
#flows .lab{color:var(--mut);margin-right:2px}
main{display:flex;gap:14px;padding:0 20px 20px;align-items:flex-start}
html{scrollbar-gutter:stable}
#stagewrap{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden}
#stagebox{position:relative;overflow:hidden;margin-inline:auto}
#stage{position:absolute;left:16px;top:16px;width:1080px;height:780px;transform-origin:0 0}
.domain{position:absolute;border-radius:22px;background:var(--glass);border:2px solid color-mix(in srgb,var(--zc) 55%,transparent);backdrop-filter:blur(8px);padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:box-shadow .3s,background .3s}
.domain.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--zc) 50%,transparent)}
.domain.pulse{box-shadow:0 0 0 4px color-mix(in srgb,var(--zc) 40%,transparent),0 0 26px color-mix(in srgb,var(--zc) 55%,transparent)}
.trust .domain{background:color-mix(in srgb,var(--zc) 30%,white);border-width:3px}
.trust .wire.egress{stroke:#e11d48!important;opacity:1}
.trust .zb{background:var(--zc);color:#fff}
.dhead{display:flex;gap:10px;align-items:flex-start}
.ico{font-size:24px;line-height:1}
.dt{flex:1;min-width:0}
.dname{font-weight:700;font-size:14px}
.drole{color:var(--mut);font-size:11.5px;line-height:1.35;margin-top:2px}
.zb{font-size:10.5px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--zc) 18%,white);color:color-mix(in srgb,var(--zc) 75%,black);white-space:nowrap}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.dev .chips{grid-template-columns:1fr}
.app .chips{grid-template-columns:1fr 1fr}
.conn .chips{grid-template-columns:repeat(2,minmax(0,1fr))}
.model .chips{grid-template-columns:repeat(3,minmax(0,1fr))}.model .ci{display:none}.model .chip{padding:5px;min-width:0}.model .chip b{font-size:11.5px}
.domain.compact .chip .ci{display:none}
.domain.compact .chip{min-width:0}
.domain.compact .chip small,.domain.compact .chip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.domain.compact .dname{white-space:nowrap}
.domain.compact{flex-direction:row;align-items:center;gap:12px;padding:8px 12px}
.domain.compact .dhead{flex:0 0 auto;align-items:center}
.domain.compact .drole{display:none}
.domain.compact .zb{display:none}
.domain.compact .chips{flex:1}
.domain.compact .chip small{white-space:nowrap}
.chip{display:flex;gap:8px;align-items:center;padding:6px 9px;border-radius:12px;background:rgba(255,255,255,.78);border:1px solid var(--line);cursor:pointer;position:relative;transition:all .25s}
.chip .ci{font-size:16px}
.chip b{display:block;font-size:12.5px}
.chip small{display:block;color:var(--mut);font-size:10.5px;line-height:1.3}
.chip.on{background:#fff;box-shadow:0 0 0 2px var(--zc),0 6px 18px color-mix(in srgb,var(--zc) 45%,transparent);transform:translateY(-1px)}
.chip.bad{background:#ffe4e4;box-shadow:0 0 0 2px #ef4444}
.chip.warn{background:#fff3d6;box-shadow:0 0 0 2px #f59e0b}
.chip.sel{outline:2px dashed #1d2433;outline-offset:1px}
.chips.free{display:block;position:relative;flex:1}
.chips.free .chip{position:absolute;align-items:flex-start;padding:6px 8px}
.chip.box{flex-direction:column;align-items:stretch;gap:4px}
.chip.box .mem{margin-top:0}
.chip.box .mem{gap:3px}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pills span{font-size:10px;padding:1px 7px;border-radius:6px;background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3}
.chip.box .memt{margin-top:2px}
.mem span[data-k="profile"]{font-weight:700;border-color:#3b82f6}
.chip.box .mem span{font-size:9px;padding:0 5px}
.domain.compact .chip>div{min-width:0}
.link{fill:none;stroke-width:1.6;opacity:.45}
.link.hot{opacity:1;stroke-width:2.6}
.lbl.small text{font-size:9px}
.doc{font-size:14px;line-height:1.7;overflow-wrap:anywhere}
.doc h1,.doc h2,.doc h3,.doc h4,.doc h5,.doc h6{font-weight:650;color:var(--ink);line-height:1.4;margin:20px 0 8px}
.doc h1{font-size:21px}.doc h2{font-size:18px}.doc h3{font-size:16px}.doc h4,.doc h5,.doc h6{font-size:14px}
.doc pre{background:#eef2f7;border:1px solid var(--line);border-radius:10px;padding:12px;font:12px/1.6 ui-monospace,Menlo,monospace;overflow:auto;white-space:pre}
.doc code{background:#e9eef5;border-radius:4px;padding:1px 4px;font:12px ui-monospace,Menlo,monospace}
.doc pre code{background:none;padding:0;color:inherit}
.doc .md-table{overflow-x:auto;margin:10px 0}.doc table{border-collapse:collapse;min-width:100%;font-size:13px}.doc th,.doc td{border:1px solid var(--line);padding:6px 9px;vertical-align:top;min-width:80px}.doc th{background:#eef2f7;font-weight:600}
.doc p{margin:6px 0}.doc li>p{margin:3px 0}.doc li>ul,.doc li>ol{margin:5px 0;padding-left:22px}
.doc blockquote{margin:10px 0;padding:2px 12px;border-left:3px solid #9bb7d3;color:var(--mut)}.doc hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.prompt-trigger{display:inline-block;padding:4px 12px;background:#e7eef6;border-radius:12px;margin:6px 0 12px;font-size:14px}
.q.done{border-color:#10b981;background:#f0fdf4}
.qd{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:#f59e0b;border:2px solid #fff}
.qd.big{position:static;display:inline-block;margin-left:6px}
.phone{flex:1;min-height:110px;border-radius:16px;background:linear-gradient(180deg,#bfdcf7,#f8e2d2);border:1px solid var(--line);padding:8px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.pbubble{background:rgba(255,255,255,.85);border-radius:12px;padding:7px 9px;font-size:11.5px;min-height:46px;white-space:pre-line}
.ptabs{display:flex;justify-content:space-around;font-size:10.5px;color:var(--mut)}
.mem{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.mem span{font-size:10.5px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid var(--line);transition:all .3s}
.mem span.flash{background:#dbeafe;border-color:#3b82f6;transform:scale(1.12)}
.memt{font-size:10.5px;color:var(--mut)}
.widget{position:absolute;border-radius:16px;background:rgba(255,255,255,.55);border:1px solid var(--line);padding:10px 12px;font-size:11.5px}
.widget h4{margin:0 0 6px;font-size:12px}
.lg-row{display:flex;align-items:center;gap:6px;margin:2px 0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.stats b{font-size:16px}
#wires{position:absolute;left:0;top:0;pointer-events:none;z-index:5;overflow:visible}
.wire{fill:none;stroke-width:2.2;opacity:.55}
.wire.hot{opacity:1;stroke-width:3.2}
.wire.egress{stroke-dasharray:6 5}
.hit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}
.lbl{pointer-events:all;cursor:pointer}
.lbl text{font-size:10.5px;fill:#334}
.lbl rect{fill:rgba(255,255,255,.92);stroke:var(--line)}
.edge.sel .wire{stroke-width:4}
.pkt text{font-size:10.5px;font-weight:600}
#panel{width:380px;flex:0 0 380px;background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(8px);display:flex;flex-direction:column;height:780px}
.tabs{display:flex;gap:4px;padding:10px 10px 6px}
.tabs .btn{flex:1;text-align:center;padding:5px 4px}
.tabc{flex:1;overflow:auto;padding:12px 14px;display:none}
.tabc.show{display:block}
.tabc h3{margin:0 0 4px;font-size:15px}
.tabc h5{margin:12px 0 4px;font-size:12px;color:var(--mut)}
.tabc ul,.tabc ol{margin:0;padding-left:20px}
.tabc li{margin:6px 0}
.tabc li.no{color:#b42318}
.tag{display:inline-block;font-size:10.5px;padding:1px 8px;border-radius:999px;background:#eef2ff;margin:1px 2px 1px 0}
.lg{display:flex;gap:6px;padding:3px 0;border-bottom:1px dashed var(--line);font-size:12px}
.lg time{color:var(--mut);flex:0 0 46px;font-variant-numeric:tabular-nums}
.lg.bad span{color:#b42318;font-weight:600}
.lg.sys span{color:var(--mut)}
.q{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.7);padding:10px;margin-bottom:9px}
.q .qt{font-weight:700}
.q .qb{color:var(--mut);font-size:12px;margin:3px 0}
.q .qrec{background:#ecfdf5;border-radius:8px;padding:5px 8px;font-size:12px;margin:5px 0}
.q .qs{display:flex;gap:5px}
.q .qs .btn{padding:2px 9px;font-size:11.5px}
.q.adopt{border-color:#10b981}.q.reject{opacity:.6}
.hint{color:var(--mut)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}
#panel.prompt-mode{width:600px;flex-basis:600px}
@media (max-width:1100px){main{flex-direction:column;align-items:stretch}#panel,#panel.prompt-mode{width:100%;flex:none;height:560px}}
[hidden]{display:none!important}
.panel-top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 0;color:var(--mut)}
.domain.single{justify-content:center}
.domain.on{box-shadow:0 0 0 3px var(--zc),0 0 26px color-mix(in srgb,var(--zc) 40%,transparent)}
.domain.warn{background:#fff3d6}.domain.bad{background:#ffe4e4}
.dhead{align-items:center}.domain.single .dhead{justify-content:center}.domain.single .dt{flex:none}
.app .chips{flex:1;grid-auto-rows:minmax(38px,1fr)}
.chip{min-height:36px}.chips.free .chip{align-items:center;justify-content:center}
.prompts .chips{grid-template-columns:repeat(3,minmax(0,1fr));flex:1;grid-auto-rows:minmax(32px,1fr)}
.prompts .chip{padding:5px 7px}.prompts .ci{display:none}.prompts .chip b{font-size:12px}
.connector{margin:12px 0}.connector h4{margin:0 0 3px}
#log .stats{margin:10px 0}#log .mem{margin:0 0 10px}
.chip:focus-visible,.domain:focus-visible{outline:2px solid #1d2433;outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>豆豆 · 产品规格<small>Spec 0.5 · 点节点看产品决定，点场景看使用过程</small></h1>
  <span class="sp"></span>
  <button class="btn" id="bPlay">⏸ 暂停</button>
  <select class="btn" id="sSpeed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
  <button class="btn on" id="bAuto">自动循环</button>
  <button class="btn" id="bView">视图：架构</button>
  <button class="btn" id="bPanel" aria-controls="panel" aria-expanded="false">展开侧栏</button>
</header>
<div id="flows"></div>
<main>
  <div id="stagewrap"><div id="stagebox"><div id="stage"></div></div></div>
  <aside id="panel" hidden>
    <div class="panel-top"><span>场景与规格</span><button class="btn" id="panelClose" aria-label="收起侧栏">收起</button></div>
    <div class="tabs">
      <button class="btn on" data-tab="log">场景</button>
      <button class="btn" data-tab="detail">详情</button>
      <button class="btn" data-tab="qs">待对齐 <span id="qcount"></span></button>
    </div>
    <div class="tabc show" id="log"><div class="pbubble" id="pbubble"></div><div class="stats" id="stats"></div><div class="mem" id="mem"></div><div id="logLines"></div></div>
    <div class="tabc" id="detail"></div>
    <div class="tabc" id="qs"></div>
  </aside>
</main>

:"任务","icon":"✅","desc":"看记录 · 接着聊","doc":"- 分「任务 / 定时」；进行中置顶并可单独停止，已完成按今天 / 近 7 天 / 更早分组。\n- 点任意任务看任务说明、默认折叠的步骤与结果；进行中每 3 秒更新记录。\n- 底部可接着聊，保留这项任务的完整上下文，继续在后台做，完成后照常通知。\n- 定时任务显示名字与触发时间，可以立即运行；系统维护不提供手动运行。"},{"id":"app_mem","name":"记忆","icon":"🗂","desc":"总档 · 健康 · 分类","doc":"- 总档摘要作大卡，查看全部可读完整内容，相关主题可点开。\n- 健康卡显示睡眠、静息心率、步数、心率变异性，缺失数据显示「--」。\n- 语音笔记显示条数和最近时间，其余分类只展示有内容的文件夹卡。"},{"id":"app_diary","name":"豆豆","icon":"📔","desc":"头像 · 便签日记","doc":"- 轮廓可选豆子、女生、男生、猫；配色可选晨雾蓝、暮光金、薄荷、樱粉，两端同步。\n- 显示陪伴的起始日期；换头像只改外观，豆豆的性格不变。\n- 日记像浅色便签，左右滑看摘要，点开读全文，也可查看全部日记与豆豆的设定。"},{"id":"app_set","name":"设置","icon":"⚙️","desc":"模型 · 权限 · 连接","doc":"- 模型：Haiku 5.5（默认）、MiMo V2.6 Pro、GLM 5.3 FlashX，每项显示一行消耗说明。\n- 权限：自动（默认）/ 完全放行；两种都不会向 App 弹请求。\n- 选择两端同步，从下一轮起生效。保留连接应用、设备、技能、通知、云端地址、配对、退出登录与版本。\n- 顶部会员卡只展示称呼与陪伴天数。"},{"id":"app_guide","name":"引导","icon":"🧭","desc":"一键开启 · 可跳过","doc":"- 本机页和首次引导都可一键开启，也可逐项开关或跳过。\n- 安卓集中申请系统权限，再申请运动健康；Mac 按系统要求依次授权。\n- 其他设备的能力只读展示，要去那台设备上开关。"},{"id":"app_connect","name":"连接应用","icon":"🧩","desc":"云端 · 本机","doc":"- 一服务一连接器，使用官方图标，已连接的排在前面；本机列出这台设备的能力。\n- 统一详情页说明用途、所需参数与账号，支持添加、验证、修改、删除。\n- 同一邮箱服务可连多个账号；自己填表或让豆豆代填，聊天代填会提醒授权码留在记录中。\n- 内置搜索等不列在这里，未支持的服务如实说明暂时接不了。"}]},{"id":"mac_app","name":"Mac","icon":"💻","zone":"dev","rect":[1,60,22,11],"compact":true,"role":"相同页面的桌面布局，保留菜单栏快捷聊天。","chips":[]},{"id":"cloud","name":"云端本体","icon":"☁️","zone":"cloud","rect":[27,15,46,56],"free":true,"qs":["q_boundary"],"role":"持续在线，负责对话、后台工作和内容维护。","can":["处理用户消息、定时安排与后台完成通知","后台工作期间仍可聊天，完成后转述结果","使用已连接服务和已授权设备","维护记忆、简报、站点、日记与技能"],"cannot":["设备离线或未授权时如实说明","不全量搬走设备数据，不将原始短信当记忆","只接支持的服务，不自行增加连接器","没有主动轮询式的模型心跳"],"holds":["个人内容、账号配置与会话记录"],"chips":[{"id":"cl_sched","name":"调度器","icon":"⏰","at":[4,3,35,25],"desc":"到点做事","doc":"- 晨报每天 7:30，晚报每天 21:30，健康周报每周日 20:00，夜间整理每天 22:30。\n- 定时消息原样交给主会话；简报在后台完成，不占住聊天。\n- 完成后告诉用户结果；主会话可以继续润色。夜间整理单独做，不打扰聊天。\n- 站点需要刷新时另设定时安排，不会因为建了站点就自动刷新。"},{"id":"cl_appgw","name":"App 网关","icon":"🚪","at":[4,37,35,23],"desc":"让两端看到同一进展","doc":"- 接收用户消息，展示回复、排队、后台进度与完成结果。\ name":"126 邮箱","description":"读取 126 邮箱里的邮件（只读，不发信、不删信、不标记已读）","multiAccount":true,"setup":["邮箱地址","授权码 / 客户端专用密码","备注（可选）"]},{"id":"gmail","name":"Gmail","description":"读取 Gmail里的邮件（只读，不发信、不删信、不标记已读）","multiAccount":true,"setup":["邮箱地址","授权码 / 客户端专用密码","备注（可选）"]},{"id":"exmail","name":"腾讯企业邮","description":"读取 腾讯企业邮里的邮件（只读，不发信、不删信、不标记已读）","multiAccount":true,"setup":["邮箱地址","授权码 / 客户端专用密码","备注（可选）"]},{"id":"aliyun-mail","name":"阿里企业邮","description":"读取 阿里企业邮里的邮件（只读，不发信、不删信、不标记已读）","multiAccount":true,"setup":["邮箱地址","授权码 / 客户端专用密码","备注（可选）"]},{"id":"imap","name":"其他邮箱","description":"读取 其他邮箱里的邮件（只读，不发信、不删信、不标记已读）","multiAccount":true,"setup":["邮箱地址","授权码 / 客户端专用密码","IMAP 服务器","端口（可选）","备注（可选）"]},{"id":"tavily","name":"Tavily","description":"深入调研和整篇网页正文提取","multiAccount":false,"setup":["API Key"]},{"id":"weread","name":"微信读书","description":"查看书架、阅读统计、划线和想法，搜索书籍","multiAccount":false,"setup":["个人 API Key"]}]},"prompts":[{"id":"p_system","name":"系统提示词","when":"每次对话","text":"你是 {名字}，{称呼} 的个人 agent。你运行在 {称呼} 自己的云主机上，24 小时在线；{称呼} 的手机和电脑作为设备接入，是你的手脚。\n你是私人助理，不是编程助手：写代码、跑命令只是替 {称呼} 办事的手段，日常请求按办事来做，不要做成软件工程。\n\n# 身份与语气\n- 你只服务 {称呼} 一个人。{称呼} 要的是判断，不是资料堆砌：给结论，给立场。\n- 性格和口吻以 `data/memory/role/角色.md` 为准；没写到的部分，做一个靠谱、话少、偶尔幽默的朋友。\n- 所有 {称呼} 看得到的文字都用中文，包括工具调用之间的过程说明。\n\n# 每个会话的开始\n回应之前先 Read `data/memory/profile/总档.md`。上下文被压缩之后同样重读一次。\n\n# 沟通\n- 结论先行，理由最多一层。长度与对方的消息相称：闲聊一两句，问事情才展开。\n- 推荐类问题只给一个答案和硬理由。不罗列选项，不两面下注，不写开场白和收尾客套。\n- 说错了，认一句，直接给更正后的结论。\n- 被批评时，从中提炼出可执行的反馈写进 `feedback/`，不反复道歉。\n- 不对 {称呼} 提工具名、技能名、子任务、文件路径这类内部概念，除非 {称呼} 问起或需要打开某个文件。说你做了什么，而不是怎么做的。\n\n# 工作目录\n当前目录就是你的工作目录。所有持久内容都按下面的约定放，约定之外不新建顶层目录。\n\n| 路径 | 用途 | 规则 |\n|---|---|---|\n| `data/memory/\u003c分类>/\u003c主题>.md` | 记忆 | 见「记忆」一节 |\n| `data/briefs/\u003cYYYY-MM-DD>/\u003c任务名>.html` | 简报 | 简报放这里，按「简报写法」写 |\n| `data/sites/\u003c名>/index.html` | 站点：长期保留、会反复更新的页面 | 目录里有 `index.html` 就是一个站点，无需登记 |\n| `data/diary/\u003cYYYY-MM-DD>.md` | 你自己的日记 | 每天一篇 |\n| `data/uploads/\u003cYYYY-MM-DD>/` | {称呼} 上传的文件 | 只读，不改名、不移动、不删除 |\n| `workspace/\u003c任务名>/` | 草稿区：脚本、下载、中间结果 | 7 天没动的目录会被自动清掉 |\n| `.claude/skills/\u003c名>/SKILL.md` | 技能：可复用的做法 | 同一套做法第二次用到时整理成技能 |\n| `system/connectors/` | 预置连接器的账号配置 | 只能用 `connectors` 工具改，不能直接读写 |\n| `system/` 的其他内容 | 运行配置和状态 | 不要读写 |\n\n\n`data/` 下的东西 {称呼} 在 App 里都看得到，要像成品一样维护：命名清楚、没有重复、没有半成品。过程文件一律放 `workspace/`。\n\n# 数据从哪里来\n动手前先判断数据在哪，再选工具。四个来源不能互相替代：\n1. **设备**：短信、通知、日历、位置、电量、剪贴板、电脑上的文件等，通过设备工具读取。设备可能离线。\n2. **云端连接器**：邮箱、在线日历、代码托管等账号数据，一直在线。一个连接器可以挂多个账号，工具的 `account` 参数指定账号，不填就是全部。\n3. **公网**：网页搜索和网页读取。\n4. **工作目录**：你自己维护的记忆和产出。\n\n- 设备上开启的能力是 {称呼} 在那台设备上亲手打开的，开启即授权，直接调用，不需要再征求同意。没开启的能力你看不到，需要时请 {称呼} 去那台设备上打开。\n- 设备离线、能力未开启或数据缺失时，照实告诉 {称呼}，不用记忆或常识填补实际数据。\n- 工具结果带分页游标（如 `next_before`、`next_cursor`）时，一页不是全部；需要更多就继续翻，直到够用或翻完。\n- {称呼} 要接入服务时，先调 `connectors.list()` 查目录；没有就如实说「暂时还接不了」。有的话照 `fields` 和 `help` 引导准备参数，由 {称呼} 在 App 填表单，或你用 `add_account` 代填。代填时提醒：「在 App 里填表单更安全，聊天记录里会留下授权码」。只配置，不写连接器代码，不读配置文件。\n- 日常搜索用内置网页搜索；深入调研或要提取整篇网页正文时用 Tavily。\n- {称呼} 发来的附件会在消息里列出路径：图片已经附在消息里；语音笔记附带转写文字；其他文件需要时自己 Read。\n\n# 记忆\n记忆是 `data/memory/` 下的一组 Markdown 文件，由你用 Read / Write / Edit / Grep 维护。没有自动召回，要用就自己去查。\n\n## 结构\n- 只有一层目录：`data/memory/\u003c分类>/\u003c主题>.md`，分类下不建子目录。健康周报顺手写 `data/memory/health/latest.json`：`{updated,metrics:[{key,label,value,unit}]}`，updated 为 ISO 时间，只放实际读到的睡眠、静息心率、步数、心率变异性，没数据就空 metrics。\n- 分类：\n  - `profile`：只放 `总档.md`\n  - `people`：一个人一个文件，如 `people/妈妈.md`；{称呼} 本人的基本信息放 `people/本人.md`\n  - `preferences`：口味、习惯、喜恶\n  - `life`：居住、出行、日常安排\n  - `work`：工作、职业\n  - `project`：{称呼} 在做的项目\n  - `interests`：长期兴趣\n  - `health`：健康状况和数据\n  - `finance`：收入、支出习惯、资产概况（不存账号、密码和精确余额）\n  - `history`：{称呼} 的过往经历，如毕业、搬家、换工作\n  - `feedback`：{称呼} 对你做事方式的要求\n  - `automation-prefs`：{称呼} 希望你自动做或不要做的事\n  - `voice-notes`：{称呼} 用语音笔记交代要留存的内容\n  - `role`：你自己的设定\n- 文件名是中文短主题。每个文件第一行写 `更新：YYYY-MM-DD`，然后是标题和条目。\n\n## 只记事实\n记忆里只能有两类内容：\n1. {称呼} 亲口说的。\n2. 你从数据里直接看到的，写明来源和日期，如「（短信，2026-10-08）」。\n\n不写进记忆的：\n- 推断、猜测和「可能」「说明」「应该是」一类的结论。从数据里看不出来的事就是不知道，不写，也不写「待确认」。值得知道的，在合适的时候直接问 {称呼}。\n- 工具或设备的状态、限制和故障（读不到什么、哪里报错）。这些不是关于 {称呼} 的事实。\n- 某一次任务的过程记录。做过的事属于聊天记录和产出物，不属于记忆；只有从中得到的长期偏好才记。\n- 情绪揣测、密码和验证码、一次性的状态、聊天原文。\n\n判断标准：这条事实稳定（几周以上不变）、会影响你以后的判断、并且无法随时现查。三条都满足才记。\n\n## 更新\n- 每条消息进来，先看有没有值得记的事实。聊到就当场写，不攒到晚上。\n- 事实变了就**原地改**那一条，改成新的事实并更新日期。不另建文件保存旧版本，不在 `history/` 里归档被推翻的内容。\n- 写入前先 Grep 有没有已有文件覆盖同一主题，有就更新那个文件，不建重复文件。\n- {称呼} 说「忘掉」的，删干净。\n- 写完不用告诉 {称呼}，App 会显示「记忆已更新」。\n\n## 总档\n- `profile/总档.md` 是全部记忆的索引式摘要：每条一行事实，行尾用 `→ \u003c分类>/\u003c主题>.md` 指向细节文件，例如 `- 住在杭州西湖区，租房 → life/居住.md`。\n- 每一条都必须指向一个存在的细节文件。总档里不放细节文件里没有的内容。\n- 改记忆时先改细节文件，再同步总档里对应的那一行。不直接在总档里写新事实。\n- 控制在 100 行以内，按重要程度排列。\n\n# 产出\n- 多步、耗时的工作放到后台做，让主会话继续陪 {称呼} 聊。完成后转述要点，未完成就照实说明。\n- 交付的站点放在 `data/sites/\u003c名>/index.html`，写好 `\u003ctitle>` 和 `\u003cmeta name=\"description\">`，回复里说明在哪里打开。改已有站点时原地改。\n- 中间产物放在 `workspace/\u003c任务名>/`。\n\n# 对外动作\n对外动作是会被别人看到或无法撤回的事：发消息、发邮件、建或改日程、删除文件、提交表单、在任何平台发布内容。只读的查询不算。\n\n规则只有一条：**确定 {称呼} 想这么做，就直接做；不确定，就先问。**\n- 「跟老王说我晚点到」→ 直接发，发完说一声。\n- 收到「晚上吃饭吗」→ 不替 {称呼} 回复，转告并附一个建议回复，等 {称呼} 确认。\n- 「帮我回这封邮件」但没说内容 → 先给草稿，等一句「发」。\n- 涉及钱、合同、对第三方的承诺、不可恢复的删除 → 无论多确定都先问。\n- {称呼} 没提过的对外动作不主动做，最多建议一句。\n\n需要问的时候，一句话问完，附上你打算怎么做，让 {称呼} 回一个「行」就能执行。不连环追问。\n\n# 诚实\n- 基于检索的回答，分清三件事：查到了什么、没查到什么、哪些是你的推断。推断可以在对话里说，但要标明，且不写进记忆。\n- 工具失败、超时、只返回部分结果、没有结果时，直说。\n- 有时效性的事实先查再答。\n- 不确定就说不确定，并说清原因：没有数据、数据冲突，还是做不到。\n\n# 时间\n- 每条消息附带当前时间和在线设备，以它为准。\n- 相对时间（明天、上周五）先换算成绝对日期再使用和记录。\n- 外部数据的时间统一换算到 {时区}。\n\n# 系统发起的会话\n系统消息以方括号前缀标记，不寒暄，不向用户追问。\n- `[补读] \u003c连接器>`：循环调用 `read_since` 取一批数据，把符合记忆标准的事实写进记忆，再 `sync_commit` 这一批，直到没有新数据。记忆没写完不要 commit。\n- `[补读]`、`[夜间整理]` 在隔离会话执行，做完就停；`[夜间整理]`：\n  1. 检查记忆：合并重复文件；删除不符合「只记事实」的内容；核对每个文件的分类是否正确。\n  2. 依据细节文件重写总档，确保每一行都有对应的细节文件。\n  3. 整理工作区：`workspace/` 里已完成任务的草稿删除；会复用的脚本整理成技能；`data/` 里的半成品、重复站点清理掉。\n  4. 写今天的日记 `data/diary/\u003cYYYY-MM-DD>.md`：用你自己的视角写今天帮 {称呼} 做了什么、注意到什么、哪里做得不够好。"},{"id":"p_morning","name":"晨报","when":"每天 7:30","text":"给用户做今天的晨报。内容按这个顺序，读不到的写「暂不可读」和原因：\n1. 今天的日程（设备日历或日历连接器）\n2. 天气：用记忆里的常住城市搜索今天的天气，提醒带伞/加衣\n3. 昨晚到现在的重要消息和通知（只挑需要用户处理的）\n4. 你从记忆里想到的今天该提醒的事（生日、截止日、承诺过的事）\n先读总档。写到 data/briefs/\u003cYYYY-MM-DD>/\u003c任务名>.html。"},{"id":"p_evening","name":"晚报","when":"每天 21:30","text":"给用户做今天的晚报：今天发生了什么（日程、消息、你帮忙做过的事）、还没处理完的事、明天要注意的。先读总档。写到 data/briefs/\u003cYYYY-MM-DD>/\u003c任务名>.html。"},{"id":"p_health_weekly","name":"健康周报","when":"每周日 20:00","text":"做本周的健康周报：睡眠、步数、心率等能从设备读到的数据，和上周对比，给一条最值得改的建议。数据读不到就写读不到，不要编。顺手更新 data/memory/health/ 里对应的文件。写到 data/briefs/\u003cYYYY-MM-DD>/\u003c任务名>.html。顺手写 data/memory/health/latest.json，格式 {updated,metrics:[{key,label,value,unit}]}，updated 用 ISO 时间；只写实际读到的睡眠、静息心率、步数、心率变异性，没有数据就用空 metrics。"},{"id":"p_night","name":"夜间整理","when":"每天 22:30","text":"[夜间整理]\n按系统提示词里「系统发起的会话 · 夜间整理」的四步做：检查记忆、重写总档、整理工作区、写日记。"},{"id":"p_brief_guide","name":"简报写法","when":"晨报、晚报、健康周报的定时消息后面附带","text":"# 简报写法\n\n- 写到 `data/briefs/\u003cYYYY-MM-DD>/\u003c任务名>.html`。1–6 张卡片，每张是顶层 `\u003csection class=\"card\">`；可以在文件开头放公共 `\u003cstyle>`。\n- 画板宽 360px，在 320–480px 自适应；每张卡片内容控制在 560px 内。不写固定页面宽度，不用隐藏溢出截掉文字。\n- 云端注入字体、圆角、阴影、间距和组件样式，不用复制基础 CSS，也不用写 JavaScript。\n\n配色在 section 上选 `data-palette`：默认 `silver` 银蓝 + 香槟金、`mist` 晨雾、`mint` 薄荷、`dusk` 暮光。不写就是默认。四套共用变量：`--ink` 主文字、`--muted` 次文字、`--surface` 底色、`--tile` 小卡底色、`--accent` 强调、`--accent-soft` 浅强调、`--gold` 香槟金、`--button-ink` 按钮文字。自己的样式也用这些变量。\n\n组件直接用 class：\n- `chip` 日期或主题；`title` 一句话结论；`summary` 两行内摘要。\n- `timeline` 横排时间线，每项用 `when` 标时间，加短标题，最多 3 项。\n- `tiles` 横排 2–3 张 `tile`；每张短标题、短描述、`tag` 标签，标签可选 `data-tone=\"ok|warn|info\"`。\n- `metrics` 横排 2–3 个 `metric`；里面 `value` 大数字、`unit` 单位、`label` 指标名、`delta` 变化。\n- `list` 列表，`li` 一件事，`meta` 次要说明；`note` 灰底提示，写暂不可读的原因。\n- `button` 按钮：`\u003cbutton class=\"button\" data-prompt=\"用户要发的话\">按钮文案\u003c/button>`。只写 data-prompt，不写跳转或点击脚本。\n\n信息层次学 Today AI：第一张总览；顶上小日期 chip，接一句话判断；下面横排时间线或小卡；末尾一个有用的按钮。后续每张一个主题。数字大、标签小，最重要的结论放上面。少写长段落，四周留足 16–20px 内边距。相邻卡片可换配色，分类清楚，不用 emoji。CSS 动画轻一点，不影响阅读。\n\n不加载外部资源；图片只用内联 SVG 或 data URI。不开外链，不写 script、事件属性、iframe、表单。可写简单 CSS 装饰。\n\n最小示例（替换日期和内容）：\n```html\n\u003cmeta name=\"brief-name\" content=\"晨报\">\n\u003cmeta name=\"brief-time\" content=\"2026-10-11T07:30:00+08:00\">\n\u003csection class=\"card\" data-palette=\"mint\">\n  \u003cspan class=\"chip\">10月11日 周日\u003c/span>\n  \u003ch1 class=\"title\">今天先把周报交了\u003c/h1>\n  \u003cp class=\"summary\">下午三点前提交，上午适合收尾。\u003c/p>\n  \u003cdiv class=\"timeline\">\u003cdiv>\u003cspan class=\"when\">15:00\u003c/span>交周报\u003c/div>\u003c/div>\n  \u003cp class=\"note\">手机离线，日历暂不可读。\u003c/p>\n  \u003cbutton class=\"button\" data-prompt=\"帮我把今天的事排个顺序\">排一下今天的顺序\u003c/button>\n\u003c/section>\n```"}]}</script>
<script id="markdown-renderer">
// Small, dependency-free Markdown renderer for the offline product spec.
// Raw HTML is escaped. Links and images remain text, so prompts cannot navigate or fetch.
function renderMarkdown(source) {
  const escape = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[c]));
  function inline(text) {
    const code = [];
    let html = escape(text).replace(/(`+)([\s\S]*?)\1/g, (_, ticks, value) => `\u0000${code.push(`<code>${value}</code>`) - 1}\u0000`);
    html = html.replace(/!?\[([^\]]+)\]\(([^)]+)\)/g, (_, label, url) => `<span class="md-link">${label} (${url})</span>`)
      .replace(/\*\*([^*]+)\*\*|__([^_]+)__/g, (_, a, b) => `<strong>${a || b}</strong>`)
      .replace(/(^|\s)\*([^*\n]+)\*(?=\s|[，。,.!?;:]|$)/g, "$1<em>$2</em>");
    return html.replace(/\u0000(\d+)\u0000/g, (_, i) => code[+i] || "");
  }
  const indent = line => /^ */.exec(line)[0].length;
  const list = line => /^( *)([-+*]|\d+[.)]) +(.+)$/.exec(line);
  const fence = line => /^ {0,3}(`{3,}|~{3,})(.*)$/.exec(line);
  const heading = line => /^ {0,3}(#{1,6})\s+(.+?)\s*#*\s*$/.exec(line);

<script>
const SPEC = JSON.parse(document.getElementById("spec-data").textContent);
const initialErrors = validateSpec(SPEC);
if (initialErrors.length) throw new Error(initialErrors.join("\n"));

/* ============ 运行时 ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const NS = "http://www.w3.org/2000/svg";
const mk = (tag, attrs, parent) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); if (parent) parent.appendChild(el); return el; };
const stage = $("#stage");

const S = {clock: 0, playing: true, speed: 1, auto: true, queue: [], packets: [], fx: new Map(), flow: -1, flowStart: 0,
  running: false, idleAt: 0, stats: {...SPEC.initialState.stats}, mem: {...SPEC.initialState.memory},
  sel: null, trust: false, domEls: {}, chipEls: {}, edgeEls: {}, geom: {}, svg: null, pk: null, dirtyStats: true};
const store = {
  get() { try { return JSON.parse(localStorage.getItem("pa_q") || "{}"); } catch (e) { return {}; } },

let qState = store.get();

const dom = id => SPEC.domains.find(d => d.id === id);

/* 元素相对舞台的矩形（未缩放坐标） */

function buildStage() {

  stage.classList.toggle("trust", S.trust);
  for (const d of SPEC.domains) {
    const z = SPEC.zones[d.zone], el = document.createElement("div");
    el.className = `domain ${d.id}${d.compact ? " compact" : ""}${d.chips.length ? "" : " single"}`;
    el.dataset.id = d.id; el.tabIndex = 0; el.setAttribute("role", "button"); el.setAttribute("aria-label", d.name);
    el.style.setProperty("--zc", z.color);
    const [x, y, w, h] = d.rect;
    Object.assign(el.style, {left: x + "%", top: y + "%", width: w + "%", height: h + "%"});
    el.innerHTML = `<div class="dhead"><span class="ico">${esc(d.icon)}</span><div class="dt"><div class="dname">${esc(d.name)}</div></div></div>`;
    if (d.chips.length) {
      const cw = document.createElement("div"); cw.className = "chips" + (d.free ? " free" : ""); el.appendChild(cw);
      for (const c of d.chips) {
        const ce = document.createElement("div"); ce.className = "chip"; ce.dataset.id = c.id;
        ce.tabIndex = 0; ce.setAttribute("role", "button"); ce.setAttribute("aria-label", c.name);
        ce.innerHTML = `<span class="ci">${esc(c.icon)}</span><div><b>${esc(c.name)}</b></div>`;
        if (d.free) { const [x, y, w, h] = c.at; Object.assign(ce.style, {left:x + "%",top:y + "%",width:w + "%",height:h + "%"}); }
        ce.onclick = e => { e.stopPropagation(); select("chip", c.id); };
        ce.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); ce.click(); } };
        cw.appendChild(ce); S.chipEls[c.id] = ce;
      }
    }
    el.onclick = () => select("domain", d.id);
    el.onkeydown = e => { if (e.target === el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); el.click(); } };
    stage.appendChild(el); S.domEls[d.id] = el;
  }

  const defs = mk("defs", {}, S.svg);
  for (const [k, v] of Object.entries(SPEC.kinds)) {
    const m = mk("marker", {id:"ar_"+k,viewBox:"0 0 10 10",refX:9,refY:5,markerWidth:7,markerHeight:7,orient:"auto"}, defs);
    mk("path", {d:"M0 0L10 5L0 10z",fill:v.color}, m);
  }

    const isLink = !!linkOf(e.id), g = mk("g", {class:"edge"}, S.svg); g.dataset.id = e.id;
    const toThird = dom(e.to)?.zone === "third";
    const wire = mk("path", {class: (isLink ? "link" : "wire") + (toThird ? " egress" : ""),stroke:SPEC.kinds[e.kind].color,"marker-end":`url(#ar_${e.kind})`}, g);
    const hit = mk("path", {class:"hit",role:"button",tabindex:0,"aria-label":`${nameOf(e.from)} → ${nameOf(e.to)}：${e.label}`}, g);
    hit.onclick = ev => { ev.stopPropagation(); select("edge", e.id); };

/* The diagram fills the available width; narrow screens scroll inside stagewrap. */
function fit() {
  const wrap = $("#stagewrap"), box = $("#stagebox"), {width,height,padding} = SPEC.layout;
  const visibleHeight = Math.max(480, innerHeight - $("main").getBoundingClientRect().top - 2 * padding - 20);
  const scale = Math.min((wrap.clientWidth - 2 * padding) / width, visibleHeight / height);
  const k = Math.max(0.5, Math.floor(scale * 1000) / 1000);
  Object.assign(stage.style, {width:width+"px",height:height+"px",left:padding+"px",top:padding+"px",transform:`scale(${k})`});
  box.style.width = Math.ceil(width * k + 2 * padding) + "px";
  box.style.height = Math.ceil(height * k + 2 * padding) + "px";
  const row = getComputedStyle($("main")).flexDirection === "row";
  $("#panel").style.height = row ? Math.max(560, Math.min(box.offsetHeight, innerHeight - 130)) + "px" : "";
}

function layoutWires() {
  S.svg.setAttribute("width", stage.offsetWidth); S.svg.setAttribute("height", stage.offsetHeight);
  const R = {};
  for (const id in S.domEls) { const e = S.domEls[id]; R[id] = {l: e.offsetLeft, t: e.offsetTop, r: e.offsetLeft + e.offsetWidth, b: e.offsetTop + e.offsetHeight}; }
  for (const e of SPEC.edges) {
    const A = R[e.from], B = R[e.to], el = S.edgeEls[e.id]; if (!A || !B || !el) continue;
    const gx = Math.max(B.l - A.r, A.l - B.r), gy = Math.max(B.t - A.b, A.t - B.b);
    let x1, y1, x2, y2, horiz = gx >= gy;
    if (horiz) {
      const lo = Math.max(A.t, B.t) + 14, hi = Math.min(A.b, B.b) - 14;
      const y = (lo < hi ? (lo + hi) / 2 : (A.t + A.b + B.t + B.b) / 4) + (e.off || 0);
      y1 = y2 = y; if (B.l > A.r) { x1 = A.r; x2 = B.l - 2; } else { x1 = A.l; x2 = B.r + 2; }
    } else {
      const lo = Math.max(A.l, B.l) + 14, hi = Math.min(A.r, B.r) - 14;
      const x = (lo < hi ? (lo + hi) / 2 : (A.l + A.r + B.l + B.r) / 4) + (e.off || 0);
      x1 = x2 = x; if (B.t > A.b) { y1 = A.b; y2 = B.t - 2; } else { y1 = A.t; y2 = B.b + 2; }
    }
    const d = `M${x1} ${y1}L${x2} ${y2}`;
    el.wire.setAttribute("d", d); el.hit.setAttribute("d", d);
    S.geom[e.id] = {path: el.wire, len: el.wire.getTotalLength(), horiz};
  }
  /* 域内连线：两张卡片中心连线，按 off 平移后裁到卡片边框 */
  for (const e of SPEC.links || []) {
    const ea = S.chipEls[e.from], eb = S.chipEls[e.to], el = S.edgeEls[e.id]; if (!ea || !eb || !el) continue;
    const A = relRect(ea), B = relRect(eb);
    let ax = A.l + (A.r - A.l) * (e.fx ?? 0.5), ay = (A.t + A.b) / 2, bx = B.l + (B.r - B.l) * (e.tx ?? 0.5), by = (B.t + B.b) / 2;
    const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len, o = e.off || 0;
    ax += nx * o; ay += ny * o; bx += nx * o; by += ny * o;
    const exit = (R, x, y, ux, uy) => {
      const tx = ux > 0 ? (R.r + 2 - x) / ux : ux < 0 ? (R.l - 2 - x) / ux : Infinity;
      const ty = uy > 0 ? (R.b + 2 - y) / uy : uy < 0 ? (R.t - 2 - y) / uy : Infinity;
      const t = Math.min(tx, ty); return [x + ux * t, y + uy * t];
    };
    const [x1, y1] = exit(A, ax, ay, dx / len, dy / len), [x2, y2] = exit(B, bx, by, -dx / len, -dy / len);
    const d = `M${x1} ${y1}L${x2} ${y2}`;
    el.wire.setAttribute("d", d); el.hit.setAttribute("d", d);
    S.geom[e.id] = {path: el.wire, len: el.wire.getTotalLength(), horiz: Math.abs(dx) >= Math.abs(dy)};
  }
}

function renderMem() {
  const m = $("#mem"); if (!m) return;
  m.innerHTML = Object.entries(S.mem).map(([k,v]) => `<span data-k="${esc(k)}">${esc(SPEC.ui.memoryLabels[k])} ${esc(v)}</span>`).join("");
}
function flashMem(k) { const el = [...$("#mem").children].find(el => el.dataset.k === k); if (!el) return; el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 900); }

/* ---- 引擎 ---- */
function enqueue(at, step) { S.queue.push({at, step}); S.queue.sort((a, b) => a.at - b.at); }
function setFx(id, kind, dur) { S.fx.set(id, {until: S.clock + dur, kind}); }
function addLog(text, kind) {
  const l = $("#logLines"), d = document.createElement("div");
  d.className = "lg" + (kind ? " " + kind : "");
  d.innerHTML = `<time>+${((S.clock - S.flowStart) / 1000).toFixed(1)}s</time><span>${esc(text)}</span>`;
  l.appendChild(d); while (l.children.length > 300) l.removeChild(l.firstChild); $("#log").scrollTop = $("#log").scrollHeight;

/* back = 沿同一条线反向走（工具调用的返回值），不用为每次返回再画一根线 */
function spawnPacket(edgeId, label, back) {
  const e = wireOf(edgeId), g = S.geom[edgeId]; if (!e || !g) return;
  const col = SPEC.kinds[e.kind].color, isLink = !edgeOf(edgeId);
  const grp = mk("g", {class: "pkt"}, S.pk);
  mk("circle", {r: isLink ? 5.5 : 7, fill: back ? "#fff" : col, stroke: back ? col : "#fff", "stroke-width": 2.5}, grp);
  S.packets.push({edge: edgeId, t0: S.clock, dur: isLink ? 850 : 1100, g: grp, back: !!back, target: back ? e.from : e.to});

}
function runStep(s) {

  if (s.warn) for (const id of s.warn) setFx(id, "warn", s.dur || 2500);
  if (s.bad) for (const id of s.bad) setFx(id, "bad", s.dur || 3000);
  if (s.pkt) spawnPacket(s.pkt, s.label, s.back);
  if (s.mem) for (const k in s.mem) { S.mem[k] = (S.mem[k] || 0) + s.mem[k]; S.stats.mem += s.mem[k]; S.dirtyStats = true; renderMem(); flashMem(k); }

}
function startFlow(i) {
  S.flow = (i + SPEC.flows.length) % SPEC.flows.length;

function ease(k) { return k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; }

function tick() {

function render() {

      const el = S.domEls[p.target];
      if (el) { el.classList.add("pulse"); setTimeout(() => el.classList.remove("pulse"), 600); }
      else if (S.chipEls[p.target] && !S.fx.has(p.target)) setFx(p.target, "ok", 500);
      continue;
    }
    const pt = g.path.getPointAtLength(g.len * (p.back ? 1 - ease(k) : ease(k)));
    p.g.setAttribute("transform", `translate(${pt.x},${pt.y})`); hot.add(p.edge);

    if (f.until <= S.clock) S.fx.delete(id);
  }
  for (const [id, el] of Object.entries({...S.domEls, ...S.chipEls})) {
    const f = S.fx.get(id);
    el.classList.toggle("on", !!f && f.kind === "ok");
    el.classList.toggle("warn", !!f && f.kind === "warn");
    el.classList.toggle("bad", !!f && f.kind === "bad");
  }

let last = performance.now();
function frame(now) {

    render();
  } catch (err) {
    console.error(err);
    if (S.lastErr !== err.message) { S.lastErr = err.message; addLog("⚠ 运行出错：" + err.message, "bad"); }
  }
  requestAnimationFrame(frame);
}

/* ---- 面板 ---- */
function renderFlowBar() {
  $("#flows").innerHTML = `<span class="lab">场景：</span>` + SPEC.flows.map((f, i) => `<button class="btn" data-i="${i}">${esc(f.icon)} ${esc(f.name)}</button>`).join("");
  document.querySelectorAll("#flows [data-i]").forEach(b => b.onclick = () => { startFlow(+b.dataset.i); showTab("log"); setPanel(true); });
}
function markFlow() {
  document.querySelectorAll("#flows [data-i]").forEach(b => b.classList.toggle("on", +b.dataset.i === S.flow));
}
function showTab(t) {
  document.querySelectorAll(".tabs .btn").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  document.querySelectorAll(".tabc").forEach(c => c.classList.toggle("show", c.id === t));
}
function li(arr, cls) { return `<ul>${(arr || []).map(x => `<li class="${cls || ""}">${esc(x)}</li>`).join("")}</ul>`; }
function md(src) { return `<div class="doc">${renderMarkdown(src)}</div>`; }
function qCard(q) {
  if (q.decided) return `<div class="q done"><div class="qt">✅ ${esc(q.title)}</div><div class="qrec">已定：${esc(q.decided)}</div>${q.rec ? `<div class="qb">${esc(q.rec)}</div>` : ""}</div>`;
  const st = qState[q.id] || "待定";
  return `<div class="q ${st === "采纳建议" ? "adopt" : st === "否决" ? "reject" : ""}"><div class="qt">${esc(q.title)}</div><div class="qb">${esc(q.body)}</div><div class="qrec">我的建议：${esc(q.rec)}</div><div class="qs">${["待定", "采纳建议", "否决"].map(s => `<button class="btn${st === s ? " on" : ""}" data-q="${q.id}" data-s="${s}">${s}</button>`).join("")}</div></div>`;
}
function bindQ(root) {
  root.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
    qState[b.dataset.q] = b.dataset.s; store.set(qState); renderQs(); renderDetail();
  });
}
function renderQs() {
  const open = SPEC.questions.filter(q => !q.decided), done = SPEC.questions.filter(q => q.decided);
  $("#qs").innerHTML = open.map(qCard).join("") + (done.length ? `<h4>已定事项（${done.length}）</h4>` + done.map(qCard).join("") : "");
  bindQ($("#qs"));
  $("#qcount").textContent = `(${open.filter(q => (qState[q.id] || "待定") === "待定").length})`;
}
function overview() { return md(SPEC.ui.overview); }
function promptDetails(id) {
  const prompt = SPEC.prompts.find(p => p.id === id);
  return prompt ? `<p class="prompt-trigger">${esc(prompt.when)}</p>${md(prompt.text)}` : "";
}
function connectorDetails() {
  return SPEC.connectors.items.map(item => `<section class="connector"><h4>${esc(item.name)}</h4><p>${esc(item.description)}</p><p>${item.multiAccount ? "可连接多个账号" : "可连接一个账号"} · 填写${item.setup.map(esc).join("、")}</p></section>`).join("");
}
function renderDetail() {
  const p = $("#detail"), s = S.sel;
  $("#panel").classList.toggle("prompt-mode", !!s && s.type === "chip" && !!chipOf(s.id)?.prompt);
  if (!s) { p.innerHTML = overview(); return; }
  if (s.type === "domain") {
    const d = dom(s.id);
    if (d.id === "prompts") {
      p.innerHTML = `<h3>提示词</h3>` + d.chips.map(c => `<p><button class="btn" data-node="${c.id}">${esc(c.name)}</button></p>`).join("");
    } else {
      p.innerHTML = `<h3>${esc(d.name)}</h3><p>${esc(d.role)}</p>${d.can?.length ? "<h5>能做</h5>" + li(d.can) : ""}${d.cannot?.length ? "<h5>约定</h5>" + li(d.cannot) : ""}${d.holds?.length ? "<h5>持有的数据</h5>" + li(d.holds) : ""}${d.doc ? md(d.doc) : ""}${d.catalog ? connectorDetails() : ""}${d.chips.length ? "<h5>节点</h5>" + d.chips.map(c => `<button class="btn" data-node="${c.id}">${esc(c.name)}</button>`).join(" ") : ""}`;
    }
  } else if (s.type === "chip") {
    const c = chipOf(s.id);
    p.innerHTML = c.prompt ? `<h3>${esc(c.name)}</h3>${promptDetails(c.prompt)}` : `<h3>${esc(c.name)}</h3>${c.desc ? `<p>${esc(c.desc)}</p>` : ""}${c.doc ? md(c.doc) : ""}`;
  } else {
    const e = wireOf(s.id);
    p.innerHTML = `<h3>${esc(e.label)}</h3><p>${esc(nameOf(e.from))} → ${esc(nameOf(e.to))}</p>${e.desc ? `<p>${esc(e.desc)}</p>` : ""}${e.trigger ? `<p>发生时机：${esc(e.trigger)}</p>` : ""}${e.trust ? `<p>${esc(e.trust)}</p>` : ""}`;
  }
  p.querySelectorAll("[data-node]").forEach(b => b.onclick = () => select("chip", b.dataset.node));
}
function setPanel(open) {
  $("#panel").hidden = !open;
  $("#bPanel").textContent = open ? "收起侧栏" : "展开侧栏";
  $("#bPanel").setAttribute("aria-expanded", String(open)); fit();
}

function select(type, id) {
  const el = type === "domain" ? S.domEls[id] : type === "chip" ? S.chipEls[id] : type === "edge" && S.edgeEls[id] ? S.edgeEls[id].g : null;
  if (!el) return;
  S.sel = {type, id};
  document.querySelectorAll(".sel").forEach(e => e.classList.remove("sel"));
  el.classList.add("sel");
  renderDetail(); showTab("detail"); setPanel(true);
}

/* ---- 控件 ---- */
$("#bPanel").onclick = () => setPanel($("#panel").hidden);
$("#panelClose").onclick = () => setPanel(false);
$("#bPlay").onclick = () => { S.playing = !S.playing; $("#bPlay").textContent = S.playing ? "⏸ 暂停" : "▶ 播放"; };
$("#sSpeed").onchange = e => S.speed = +e.target.value;
$("#bAuto").onclick = () => { S.auto = !S.auto; $("#bAuto").classList.toggle("on", S.auto); };
$("#bView").onclick = () => { S.trust = !S.trust; stage.classList.toggle("trust", S.trust); $("#bView").textContent = "视图：" + (S.trust ? "边界" : "架构"); $("#bView").classList.toggle("on", S.trust); };
document.querySelectorAll(".tabs .btn").forEach(b => b.onclick = () => showTab(b.dataset.tab));
/* spec-validation:start */
function validateSpec(sp) {
  const errors = [], obj = v => !!v && typeof v === "object" && !Array.isArray(v), arr = Array.isArray;
  const text = v => typeof v === "string" && !!v.trim(), number = v => typeof v === "number" && Number.isFinite(v);
  if (!obj(sp)) return ["顶层必须是 YAML mapping"];
  try { JSON.stringify(sp); } catch { return ["规格不能包含循环引用"]; }
  for (const key of ["meta","layout","initialState","ui","zones","kinds","connectors"]) if (!obj(sp[key])) errors.push(`${key} 必须是 mapping`);
  for (const key of ["domains","edges","links","flows","questions","prompts"]) if (!arr(sp[key])) errors.push(`${key} 必须是数组`);
  if (errors.length) return errors;
  if (!text(sp.meta.title) || !text(sp.meta.subtitle) || !text(sp.ui.overview)) errors.push("meta.title / meta.subtitle / ui.overview 必须是文字");
  if (![sp.layout.width,sp.layout.height,sp.layout.padding].every(number) || sp.layout.width <= 0 || sp.layout.height <= 0 || sp.layout.padding < 0) errors.push("layout 需要正数 width / height 和非负 padding");
  for (const key of ["memory","stats"]) if (!obj(sp.initialState[key]) || Object.values(sp.initialState[key]).some(v => !number(v))) errors.push(`initialState.${key} 需要数字 mapping`);
  if (!obj(sp.ui.memoryLabels) || Object.keys(sp.initialState.memory || {}).some(key => !text(sp.ui.memoryLabels?.[key]))) errors.push("记忆分类需要中文名称");
  if (!text(sp.initialState.phone) || !obj(sp.ui.stats) || Object.keys(sp.ui.stats).some(key => !number(sp.initialState.stats?.[key]))) errors.push("初始场景消息或统计标签无效");
  for (const key of ["zones","kinds"]) {
    if (!Object.keys(sp[key]).length) errors.push(`${key} 不能为空`);
    for (const [id,v] of Object.entries(sp[key])) if (!obj(v) || !text(v.label) || !/^#[\da-f]{6}$/i.test(v.color)) errors.push(`${key}.${id} 需要 label 和六位十六进制 color`);
  }
  const ids = (items, kind) => {
    const set = new Set();
    for (const x of items) {
      if (!obj(x) || !/^[a-z][a-z0-9_-]*$/i.test(x.id || "")) errors.push(`${kind} 缺少有效 id`);
      else if (set.has(x.id)) errors.push(`${kind} id 重复：${x.id}`);
      else set.add(x.id);
    }
    return set;
  };
  const domainIds = ids(sp.domains,"domain"), edgeIds = ids(sp.edges,"edge"), linkIds = ids(sp.links,"link"), questionIds = ids(sp.questions,"question"), promptIds = ids(sp.prompts,"prompt"), chipIds = new Set();
  ids(sp.flows,"flow");
  if (!sp.domains.length || !sp.flows.length) errors.push("domains / flows 不能为空");
  const rect = v => arr(v) && v.length === 4 && v.every(number) && v[0] >= 0 && v[1] >= 0 && v[2] > 0 && v[3] > 0 && v[0]+v[2] <= 100 && v[1]+v[3] <= 100;
  for (const d of sp.domains) {
    if (!obj(d)) continue;
    if (!text(d.name) || !text(d.role) || !sp.zones[d.zone] || !rect(d.rect)) errors.push(`domain ${d.id} 的名称 / role / zone / rect 无效`);
    for (const key of ["can","cannot","holds","qs"]) if (d[key] !== undefined && !arr(d[key])) errors.push(`domain ${d.id}.${key} 必须是数组`);
    for (const id of arr(d.qs) ? d.qs : []) if (!questionIds.has(id)) errors.push(`domain ${d.id} 的问题 ${id} 不存在`);
    if (!arr(d.chips)) { errors.push(`domain ${d.id}.chips 必须是数组`); continue; }
    for (const c of d.chips) {
      if (!obj(c) || !/^[a-z][a-z0-9_-]*$/i.test(c.id || "") || !text(c.name)) { errors.push(`domain ${d.id} 的节点缺少 id / name`); continue; }
      if (chipIds.has(c.id) || domainIds.has(c.id)) errors.push(`节点 id 重复：${c.id}`); chipIds.add(c.id);
      if (d.free && !rect(c.at)) errors.push(`自由布局节点 ${c.id} 需要 at: [x,y,w,h]`);
      if (c.q && !questionIds.has(c.q)) errors.push(`节点 ${c.id} 的问题 ${c.q} 不存在`);
      if (c.prompt && !promptIds.has(c.prompt)) errors.push(`节点 ${c.id} 的提示词 ${c.prompt} 不存在`);
      if (c.pills !== undefined && !arr(c.pills)) errors.push(`节点 ${c.id}.pills 必须是数组`);
    }
  }
  for (const [items,set,kind] of [[sp.edges,domainIds,"edge"],[sp.links,chipIds,"link"]]) for (const e of items) {
    if (!obj(e)) continue;
    if (!set.has(e.from) || !set.has(e.to) || !sp.kinds[e.kind] || !text(e.label)) errors.push(`${kind} ${e.id} 的 from / to / kind / label 无效`);
    if (kind === "link" && edgeIds.has(e.id)) errors.push(`连线 id 重复：${e.id}`);
  }
  for (const flow of sp.flows) {
    if (!obj(flow)) continue;
    if (!text(flow.name) || !arr(flow.steps)) { errors.push(`flow ${flow.id} 需要 name / steps`); continue; }
    for (const [i,s] of flow.steps.entries()) {
      const where = `flow ${flow.id} 第 ${i+1} 步`;
      if (!obj(s) || !number(s.t) || s.t < 0) { errors.push(`${where} 需要非负数字 t`); continue; }
      if (s.pkt && !edgeIds.has(s.pkt) && !linkIds.has(s.pkt)) errors.push(`${where} 的 pkt ${s.pkt} 不存在`);
      for (const key of ["on","warn","bad"]) if (s[key] !== undefined) {
        if (!arr(s[key])) errors.push(`${where}.${key} 必须是数组`);
        else for (const id of s[key]) if (!domainIds.has(id) && !chipIds.has(id)) errors.push(`${where} 的节点 ${id} 不存在`);
      }
      for (const [key,initial] of [["mem",sp.initialState.memory],["stat",sp.initialState.stats]]) if (s[key] !== undefined) {
        if (!obj(s[key]) || Object.entries(s[key]).some(([id,v]) => !number(v) || !Object.hasOwn(initial || {},id))) errors.push(`${where}.${key} 必须引用初始状态中的数字项`);
      }
    }
  }
  for (const q of sp.questions) if (obj(q) && (!text(q.title) || !(text(q.decided) || text(q.body)))) errors.push(`question ${q.id} 需要标题和正文 / 决定`);
  if (!arr(sp.connectors.items)) errors.push("connectors 需要 items 数组");
  else {
    ids(sp.connectors.items,"connector");
    for (const c of sp.connectors.items) {
      if (!obj(c) || !text(c.name) || !text(c.description) || typeof c.multiAccount !== "boolean" || !arr(c.setup) || !c.setup.every(text)) errors.push("连接器需要名称、说明、账号数量与填写要求");
    }
  }
  const promptIdsInOrder = ["p_system","p_morning","p_evening","p_health_weekly","p_night","p_brief_guide"];
  if (JSON.stringify(sp.prompts.map(p => p?.id)) !== JSON.stringify(promptIdsInOrder)) errors.push("提示词必须且只能是系统、晨报、晚报、健康周报、夜间整理、简报写法六条");
  for (const p of sp.prompts) {
    if (!obj(p) || !text(p.name)) { errors.push("提示词需要名称"); continue; }
    if (Object.hasOwn(p,"text")) {
      if (!text(p.text) || !text(p.when)) errors.push(`提示词 ${p.id} 需要触发条件与全文`);
    } else if (!obj(p.source) || !text(p.source.file)) errors.push(`提示词 ${p.id} 需要正文来源`);
  }
  return errors;
}
/* spec-validation:end */

let wrapW = 0;
new ResizeObserver(() => { const w = $("#stagewrap").clientWidth; if (w !== wrapW) { wrapW = w; fit(); } }).observe($("#stagewrap"));
addEventListener("resize", fit);

function boot(first) {
  $("h1").innerHTML = `${esc(SPEC.meta.title)}<small>${esc(SPEC.meta.subtitle)}</small>`;
  document.title = SPEC.meta.title;
  $("#pbubble").textContent = SPEC.initialState.phone;
  buildStage(); renderQs(); renderDetail(); renderFlowBar(); fit();
  requestAnimationFrame(() => {
    try {
      fit(); layoutWires();
      const q = new URLSearchParams(first ? location.hash.slice(1) : "");
      startFlow(parseInt(q.get("flow"), 10) || 0);
      if (q.get("trust") && !S.trust) $("#bView").click();
      for (let t = 0, ff = +q.get("ff") || 0; t < ff; t += 50) { S.clock += 50; tick(); }
      if (q.get("sel")) select(...q.get("sel").split(":"));
    } catch (err) { console.error(err); addLog("⚠ 启动出错：" + err.message, "bad"); }
  });
}
boot(true);
requestAnimationFrame(frame);
</script>
